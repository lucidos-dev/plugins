id = "notify-when-needed"
version = "0.2.1"
name = "Notify When Needed"
description = "Pushes a deep-linking notification whenever Lucidos (or a coding agent) is blocked waiting on you (a question, a permission prompt, a credential request, an MCP consent) or when a turn dies on an error and the work just stops. Tapping the push lands on the exact card or failed turn you need to act on. Duplicate error pushes are collapsed, and trigger-channel failures are left to the scheduler's own error notification. Event-driven; ships its own trigger that auto-registers on install."
source = "https://github.com/lucidos-dev/plugins/tree/main/notify-when-needed"
categories = ["automation", "productivity"]
