id = "ouroboros"
version = "0.3.0"
name = "Ouroboros"
description = "Classic Snake game with a polished highscore board, replays, and custom victory audio. Plays fully local out of the box; optionally syncs a shared family/friends scoreboard through a Lucidos proxy you configure, discovered automatically. Ask Lucidos to wire up a shared board after install if you want one."
source = "https://github.com/lucidos-dev/plugins/tree/main/ouroboros"
engine = ">=0.9.1"
categories = ["fun"]
setup = """
Ouroboros works immediately as a single-player game — highscores save to the local workspace and the bundled fanfare/trombone audio plays on its own. No setup is required to start playing.

Optional — shared scoreboard. The game can sync a highscore board across several people (family, friends, work) through a Lucidos proxy pointing at a Firebase Realtime Database. Shared boards are discovered automatically: any `data/config/apis.json` proxy named `snake-storage-<group>` shows up in Ouroboros → 💾 by itself.

- Ask the user whether they want a shared scoreboard. If not, do nothing — the game stays local.
- If yes: load the `apps/ouroboros/knowhow/storage-backends.md` knowhow shipped with this plugin. It documents the exact proxy snippet, the RTDB layout (`/snake/highscores.json`, `/snake/players.json`), and the recommended Firebase security rules.
- Add a `snake-storage-<group>` proxy entry to `data/config/apis.json`, and register the token credential if the database requires one.
- Test it with a GET on `/snake/highscores.json` through the proxy.
- Tell the user to open Ouroboros → 💾 and tap the new board to activate it.
- Do not invent a Firebase URL or token — ask the user for their own backend, or leave the game local if they don't have one.
"""
