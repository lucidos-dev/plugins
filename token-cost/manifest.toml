id = "token-cost"
version = "0.6.0"
name = "Token Cost"
description = "Real-time token usage and running cost across every model call the workspace makes. Live totals that tick as agents stream over SSE, a date range picker with presets, an analysis table and chart grouped by any mix of model (optionally split by reasoning effort), type (auxiliary calls split by purpose, cache keep-alive pings on their own) and thread, cache-hit share and context size, all priced from Lucidos's dated price table: each day is priced at the rate in force that day, and each call at the model that actually served it. A dead stream, a gap behind it, or a stale rollup are each detected and named in the header. Also ships the Thread cost widget: what the open thread costs, sub-threads included, with its model mix and costliest sub-threads. Ships an incremental rollup script and a per-thread snapshot script; setup offers an hourly rollup and an hourly thread snapshot."
source = "https://github.com/lucidos-dev/plugins/tree/main/token-cost"
engine = ">=0.50.0"
categories = ["developer-tools", "data"]
icon = "media/icon.svg"
screenshots = ["media/dashboard.png", "media/thread-cost-widget.png", "media/settings.png"]
setup_revision = 1
setup_reason = "0.4.x left a daily price-check trigger behind; it now repeats Keep prices current and its recipe is gone."

setup = """
This plugin needs four things wired up: a schedule for its rollup script, the
proxy entry its currency refresh uses, a seed and a schedule for the Thread
cost widget's snapshot, and a word with the user about keeping prices current.

The plugin carries no prices. The app, the rollup and the snapshot all read
Lucidos's price table: the dated cards Lucidos ships, merged with the
workspace override in `data/config/model-prices.json`. Run
`lucidos model-prices` to see it. A rate the user edits in the app's Settings
tab lands in that override. There is nothing to seed.

1. Ask the user how often they want the rollup to run. Hourly at five past
   (`0 5 * * * *`) is a good default: the dashboard folds live calls on top of
   the last rollup, so a longer gap costs nothing but a slower cold start.
2. Create a **script** trigger with that cron, `app_id = "token-cost"`, running
   `apps/token-cost/scripts/rollup.py`. Leave `go_to_review` off, it is silent
   housekeeping. The script prints one line and notifies nothing.
3. Check that `data/config/apis.json` has a `frankfurter` entry. The Settings
   tab's **Update rates** button fetches exchange rates through
   `lucidos.proxy('frankfurter')`. If the entry is missing, add it (no auth):

   ```json
   "frankfurter": { "base_url": "https://api.frankfurter.dev/v1" }
   ```

4. Run the rollup once so `artifacts/token-cost/daily.json` exists. The first
   run reads every `ContextCaptured` row and can take a minute on a busy
   workspace; later runs resume from the recorded sequence.
5. **Seed the Thread cost widget.** Run `scripts/token-cost/thread_costs.py`
   once (with `LUCIDOS_WORKSPACE` set, as any run_python or run_bash call has
   it). It prices every call per thread and writes
   `artifacts/token-cost/threads-cost.json` through `lucidos data write`. The
   widget prices newer calls live on top of that snapshot, and shows "No data
   yet" until the first run.
6. Offer an hourly refresh for that snapshot, so the widget's thread titles
   and totals stay current. Ten past the hour (`0 10 * * * *`) is a good
   default, five minutes after the rollup. If the user wants it, create a
   **script** trigger with `app_id = "thread-cost"` running
   `scripts/token-cost/thread_costs.py`, with `go_to_review` off. It prints
   one summary line and notifies nothing.
7. **Prices.** Tell the user that keeping prices current is Lucidos's job, not
   this plugin's: **Keep prices current** in Settings > Intelligence checks
   the providers' own pages on a schedule and writes any change to the
   override. Offer to turn it on if it is off. Do not create a price-check
   trigger here.
   Then look for a leftover from a 0.4.x install: an intent trigger with
   `app_id = "token-cost"` that checks prices (its name is usually "Token Cost
   daily price check"). Lucidos cannot remove it on update, because setup
   created it, not the plugin. If you find one, recommend deleting it and say
   why in plain words: it repeats what Keep prices current does, it writes
   `artifacts/token-cost/pricing.json`, which nothing reads any more, and the
   recipe it loads (`token-cost/daily-price-check`) is gone since 0.6.0, so
   every fire now runs without its instructions. Delete it when the user
   agrees. If they want to keep it, say it will keep firing daily until they
   delete or pause it. Do the same check on a re-run, so a user who declined
   before is asked again.
8. Tell the user it is done, name any model in `daily.json` that the price
   table does not price, link the app, and tell them they can ask for the
   Thread cost widget in any thread.

Both scripts talk to the workspace Postgres through `psql`, passing the
read-only `LUCIDOS_DATABASE_URL` the engine gives every spawned script, and
read prices with `lucidos model-prices`. They stop with a clear message if
either is missing. Nothing here needs a credential or an API key.
"""
