id = "token-cost"
version = "0.7.0"
name = "Token Cost"
description = "Live token usage and cost across every workspace model call. Pick any date range, group analysis by model, reasoning effort, type or thread, and explore share donuts and daily or weekly bars. Thread drill-downs show each agent session and keep-alive spend; Handoffs compares narrative cost and calls before and after each checkpoint. Cache views show ping cost against evidenced savings, write/read/input spend and rewrites by cause, with missing evidence marked unknown. A rollup-only first paint is marked while newer calls load, and the page stays live without a Refresh button. Dated Lucidos price cards price each call at its served model; unpriced calls are counted and named. Includes the Thread cost widget with scope controls, session rows and a lightweight snapshot. Keeps the 0.4.x price migration. Setup offers hourly rollup and snapshot schedules."
source = "https://github.com/lucidos-dev/plugins/tree/main/token-cost"
engine = ">=0.51.0"
categories = ["developer-tools", "data"]
icon = "media/icon.svg"
screenshots = ["media/dashboard.png", "media/analysis.png", "media/thread-cost-widget.png", "media/settings.png"]
setup_revision = 2
setup_reason = "0.5.0 to 0.6.3 stopped reading 0.4.x's pricing.json, so its prices went unpriced. Setup now moves them into Lucidos's price table."

setup = """
This plugin needs five things wired up: a schedule for its rollup script, the
proxy entry its currency refresh uses, a seed and a schedule for the Thread
cost widget's snapshot, the prices an older install kept in its own file, and
a word with the user about keeping prices current.

The plugin carries no prices. The app, the rollup and the snapshot all read
Lucidos's price table: the dated cards Lucidos ships, merged with the
workspace override in `data/config/model-prices.json`. Run
`lucidos model-prices` to see it. A rate the user edits in the app's Settings
tab lands in that override. A fresh install has nothing to seed.

Token Cost 0.4.x kept its own prices in `artifacts/token-cost/pricing.json`.
0.5.0 to 0.6.3 stopped reading it and moved nothing over, so every model it
priced that Lucidos ships no card for went unpriced. The plugin's
`scripts/token-cost/migrate_prices.py` moves those cards into the override,
unchanged, and never edits the old file. The rollup and the snapshot run it
first on every run, so it heals without you. Step 4 runs it now, so the user
sees the result in this thread.

1. Ask the user how often they want the rollup to run. Hourly at five past
   (`0 5 * * * *`) is a good default: the dashboard folds live calls on top of
   the last rollup, so a longer gap costs nothing but a slower cold start.
2. Create a **script** trigger with that cron, `app_id = "token-cost"`, running
   `apps/token-cost/scripts/rollup.py`. Leave `go_to_review` off, it is silent
   housekeeping. The script prints one line and notifies nothing.
3. Check that `data/config/apis.json` has a `frankfurter` entry. The Settings
   tab's **Update rates** button fetches exchange rates through
   `lucidos.proxy('frankfurter')`. If the entry is missing, add it (no auth):

   ```json
   "frankfurter": { "base_url": "https://api.frankfurter.dev/v1" }
   ```

4. **Move 0.4.x prices.** Skip this step when
   `artifacts/token-cost/pricing.json` does not exist. Otherwise run
   `scripts/token-cost/migrate_prices.py --json` (with `LUCIDOS_WORKSPACE`
   set, as any run_python or run_bash call has it). Its first line sums up
   the run, and the JSON report follows; the same report stays in
   `artifacts/token-cost/price-migration.json` and shows in the app's
   Settings tab. Tell the user in plain words:
   - which models it moved (`migrated`), and that each keeps its 0.4 source
     and dates;
   - which it left out because the price table already prices them
     (`covered`), and where `differs` is true, that the price table's rate
     differs from the old one and the price table's wins;
   - every card in `unsupported` and every line in `errors`, with its reason,
     and every field in `settings.unsupported`. These did NOT move. Offer to
     fix each by hand in the app's Settings tab, from the provider's own
     price page. Never guess a rate.
   Exit code 1 means it wrote nothing (`status` is `error`, `blocked` or
   `retry`). Fix what `errors` names, such as an override Lucidos ignores,
   and run it again. Exit code 0 with `status` `done` on a re-run means
   everything already moved. Do not move, edit or delete `pricing.json`, and
   do not copy a `covered` card by hand.
5. Run the rollup once so `artifacts/token-cost/daily.json` exists. The first
   run reads every `ContextCaptured` row and can take a minute on a busy
   workspace; later runs resume from the recorded sequence.
6. **Seed the Thread cost widget.** Run `scripts/token-cost/thread_costs.py`
   once (with `LUCIDOS_WORKSPACE` set, as any run_python or run_bash call has
   it). It prices every call per thread and writes
   `artifacts/token-cost/threads-cost.json` through `lucidos data write`. The
   widget prices newer calls live on top of that snapshot, and shows "No data
   yet" until the first run.
7. Offer an hourly refresh for that snapshot, so the widget's thread titles
   and totals stay current. Ten past the hour (`0 10 * * * *`) is a good
   default, five minutes after the rollup. If the user wants it, create a
   **script** trigger with `app_id = "thread-cost"` running
   `scripts/token-cost/thread_costs.py`, with `go_to_review` off. It prints
   one summary line and notifies nothing.
8. **Prices.** Tell the user that keeping prices current is Lucidos's job, not
   this plugin's: **Keep prices current** in Settings > Intelligence checks
   the providers' own pages on a schedule and writes any change to the
   override. Offer to turn it on if it is off. Do not create a price-check
   trigger here.
   Then look for a leftover from a 0.4.x install: an intent trigger with
   `app_id = "token-cost"` that checks prices (its name is usually "Token Cost
   daily price check"). Lucidos cannot remove it on update, because setup
   created it, not the plugin. If you find one, recommend deleting it and say
   why in plain words: it repeats what Keep prices current does, it writes
   `artifacts/token-cost/pricing.json`, which nothing prices from any more
   (step 4 only copies the cards the price table lacks), and the recipe it
   loads (`token-cost/daily-price-check`) is gone since 0.6.0, so every fire
   now runs without its instructions. Delete it when the user
   agrees. If they want to keep it, say it will keep firing daily until they
   delete or pause it. Do the same check on a re-run, so a user who declined
   before is asked again.
9. Tell the user it is done, name any model in `daily.json` that the price
   table does not price (the dashboard and the widget both say how many calls
   their totals leave out), link the app, and tell them they can ask for the
   Thread cost widget in any thread.

Both scripts talk to the workspace Postgres through `psql`, passing the
read-only `LUCIDOS_DATABASE_URL` the engine gives every spawned script, and
read prices with `lucidos model-prices`. They stop with a clear message if
either is missing. The migration writes the override with
`lucidos data write`. Nothing here needs a credential or an API key.
"""
