<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thread cost</title>
<script src="/api/v1/sdk-prefs.js"></script>
<link rel="stylesheet" href="/api/v1/sdk-iframe.css">
<script src="/api/v1/sdk.js"></script>
<style>
  body { margin: 0; padding: var(--space-md); color: var(--text-primary); background: transparent; }
  .head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: var(--space-sm); }
  .total { font-size: var(--font-size-xl); font-weight: 600; font-variant-numeric: tabular-nums; }
  .meta { color: var(--text-muted); font-size: var(--font-size-xs); }
  .controls { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-sm); margin: var(--space-md) 0 var(--space-sm); }
  .controls .pill-bar { overflow: visible; }
  .check { display: inline-flex; align-items: center; gap: var(--space-xs); font-size: var(--font-size-xs); white-space: nowrap;
    color: var(--text-secondary); cursor: pointer; user-select: none; }
  .check[hidden], .controls-group[hidden], .segmented-control[hidden] { display: none; }
  .controls-group { display: contents; }
  .list { display: flex; flex-direction: column; gap: 0.125rem; }
  .row { border-top: 1px solid var(--border-color); }
  .row:first-child { border-top: none; }
  .head-row { display: grid; grid-template-columns: 1fr auto auto; gap: 0.25rem var(--space-sm); align-items: center;
    padding: var(--space-sm) var(--space-xs); cursor: pointer; border-radius: var(--radius-control);
    transition: background var(--duration-fast); }
  @media (hover: hover) { .head-row:hover { background: var(--bg-secondary); } }
  .head-row:focus-visible { outline: none; box-shadow: var(--focus-ring); }
  .title { display: flex; align-items: center; gap: var(--space-xs); font-size: var(--font-size-sm); min-width: 0; }
  .title-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .chev { flex: none; width: 0.75rem; height: 0.75rem; color: var(--text-muted); transition: transform var(--duration-normal); }
  .row.open .chev { transform: rotate(90deg); }
  .cost { font-variant-numeric: tabular-nums; font-size: var(--font-size-sm); font-weight: 600; }
  .go { width: 1.5rem; height: 1.5rem; }
  .go svg { width: var(--icon-size-sm); height: var(--icon-size-sm); }
  .bar { grid-column: 1 / -1; height: 0.1875rem; background: var(--bg-secondary); border-radius: var(--radius-round); overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--accent); transform-origin: left; transition: transform var(--duration-normal); }
  .sub { grid-column: 1 / -1; display: flex; align-items: center; gap: var(--space-xs); color: var(--text-muted);
    font-size: var(--font-size-2xs); overflow: hidden; white-space: nowrap; }
  .sub span:last-child { overflow: hidden; text-overflow: ellipsis; }
  /* A running thread: a still dot, never a pulse. */
  .dot { flex: none; display: inline-block; width: 0.375rem; height: 0.375rem; border-radius: var(--radius-round); background: var(--text-secondary); }
  .dot.waiting { background: var(--accent-yellow); }
  /* The per-model breakdown rolls open under its row. */
  .detail { display: grid; grid-template-rows: 0fr; transition: grid-template-rows var(--duration-normal) ease; }
  .row.open .detail { grid-template-rows: 1fr; }
  .detail > div { overflow: hidden; }
  .models { display: grid; grid-template-columns: 1fr auto auto; gap: 0.375rem var(--space-sm); align-items: center;
    padding: 0.125rem var(--space-xs) var(--space-sm) calc(var(--space-xs) + 0.75rem + var(--space-xs));
    font-size: var(--font-size-xs); font-variant-numeric: tabular-nums; color: var(--text-secondary); }
  .models .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .models .calls { color: var(--text-muted); }
  .models .share { grid-column: 1 / -1; height: 0.125rem; margin-top: -0.25rem; background: var(--bg-secondary); border-radius: var(--radius-round); overflow: hidden; }
  .models .share i { display: block; height: 100%; background: var(--text-muted); transform-origin: left; }
  .models .none { grid-column: 1 / -1; color: var(--text-muted); }
  .row.entering { animation: rise var(--duration-slow) both; animation-delay: calc(var(--i) * var(--duration-fast) / 3); }
  @keyframes rise { from { opacity: 0; transform: translateY(0.375rem); } }
  :root[data-motion="reduce"] .row.entering { animation: none; }
  #sentinel { height: 1px; }
  .empty { color: var(--text-muted); font-size: var(--font-size-sm); padding: var(--space-md) var(--space-xs); }
  /* Minimal widget window: the total and the top rows on a small card. */
  html[data-widget-mode="minimal"] body { width: 16rem; padding: var(--space-sm) var(--space-md); background: var(--bg-primary);
    border: 1px solid var(--border-color); border-radius: var(--radius-surface); box-sizing: border-box; }
  html[data-widget-mode="minimal"] .controls,
  html[data-widget-mode="minimal"] #sentinel,
  html[data-widget-mode="minimal"] #stamp,
  html[data-widget-mode="minimal"] .sub,
  html[data-widget-mode="minimal"] .detail,
  html[data-widget-mode="minimal"] .chev { display: none !important; }
  html[data-widget-mode="minimal"] .total { font-size: var(--font-size-lg); }
  html[data-widget-mode="minimal"] .list { margin-top: var(--space-xs); }
  html[data-widget-mode="minimal"] .head-row { padding: 0.375rem 0; }
  /* The window draws its controls over the top right corner here. */
  html[data-widget-mode="docked"] #stamp { display: none; }
</style>
</head>
<body>
  <div class="head">
    <div>
      <div class="meta" id="label">Today</div>
      <div class="total" id="total">…</div>
    </div>
    <div class="meta" id="stamp"></div>
  </div>
  <div class="controls">
    <div class="segmented-control" role="group" aria-label="Scope" id="scope" hidden>
      <button class="segmented-btn" id="sc-all">All threads</button>
      <button class="segmented-btn" id="f-this">This thread</button>
    </div>
    <div class="controls-group" id="all-controls">
      <div class="segmented-control" role="group" aria-label="Period">
        <button class="segmented-btn" id="b-today">Today</button>
        <button class="segmented-btn" id="b-all">All time</button>
        <button class="segmented-btn" id="b-flight">In flight</button>
      </div>
      <div class="segmented-control" role="group" aria-label="Sort by">
        <button class="segmented-btn" id="s-cost">Top cost</button>
        <button class="segmented-btn" id="s-latest">Latest</button>
      </div>
    </div>
    <label class="check" id="subs-wrap" hidden><input type="checkbox" id="f-subs"> Sub-threads</label>
  </div>
  <div class="list" id="list"></div>
  <div id="sentinel" aria-hidden="true"></div>
  <svg width="0" height="0" style="position:absolute">
    <symbol id="i-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></symbol>
    <symbol id="i-go" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7M9 7h8v8"/></symbol>
  </svg>
<script>
lucidos.ui.applyPreferences();
lucidos.ui.watchPreferences();
const PATH = 'artifacts/token-cost/threads-cost.json';
const PAGE = 20; // rows added each time the list end scrolls into view
let data = null, mode = 'today', shown = PAGE, rowCount = 0;
const usd = n => '$' + n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const short = m => (m || '').replace(/^claude-/, '').replace(/-preview$/, '');
let sort = 'cost', flight = false, active = new Map();
let thisOnly = false, focus = null;
let withSubs = false, subIds = new Set(), subsFor = null;
const opened = new Set();
const MINIMAL_ROWS = 3;
const minimal = () => document.documentElement.dataset.widgetMode === 'minimal';
// The host stamps the window mode after load, and changes it on a switch.
new MutationObserver(() => render(false)).observe(document.documentElement, { attributes: true, attributeFilter: ['data-widget-mode'] });
const icon = id => `<svg aria-hidden="true"><use href="#${id}"/></svg>`;
const ms = v => (typeof v === 'number' ? v : Date.parse(v || '') || 0);
function ago(t) {
  if (!t) return '';
  const m = Math.max(0, Math.round((Date.now() - t) / 60000));
  if (m < 1) return 'just now';
  if (m < 60) return m + ' min ago';
  const h = Math.round(m / 60);
  return h < 24 ? h + ' h ago' : Math.round(h / 24) + ' d ago';
}
function setBtn(id, on) { const b = document.getElementById(id); b.classList.toggle('active', on); b.setAttribute('aria-pressed', String(on)); }
function render(animate) {
  if (!data) return;
  // This thread has no period or sort: it shows the thread's whole spend, top cost first.
  const key = thisOnly ? 'all' : (mode === 'today' ? 'today' : 'all');
  const byId = pool(key);
  let rows = [...byId.values()];
  if (flight && !thisOnly) {
    for (const [id, t] of active) if (!byId.has(id)) {
      const base = find(id);
      rows.push(base ? { ...base } : { id, title: t.title || 'Untitled', all: 0, today: 0, calls: 0, models: {} });
    }
    rows = rows.filter(r => active.has(r.id));
    rows.forEach(r => { const t = active.get(r.id); r.status = t.status; if (!r.lastMs) r.lastMs = ms(t.last_activity); });
  } else if (mode === 'today' && !thisOnly) rows = rows.filter(r => r.today > 0);
  let subCount = 0;
  if (thisOnly) {
    if (focus && !rows.some(r => r.id === focus)) {
      const base = find(focus), t = active.get(focus);
      rows.push(base ? { ...base, lastMs: ms(base.last) } : { id: focus, title: titles.get(focus) || (t && t.title) || 'This thread', all: 0, today: 0, calls: 0, models: {}, lastMs: 0 });
    }
    const ids = new Set([focus]);
    if (withSubs && focus && subsFor === focus) {
      subCount = subIds.size;
      for (const id of subIds) {
        ids.add(id);
        // A sub-thread outside the period's pool still counts if the snapshot knows its spend.
        if (!rows.some(r => r.id === id)) { const base = find(id); if (base && base[key] > 0) rows.push({ ...base, lastMs: ms(base.last) }); }
      }
    }
    rows = rows.filter(r => ids.has(r.id));
  }
  rows.sort(sort === 'latest' && !thisOnly ? (a, b) => b.lastMs - a.lastMs : (a, b) => b[key] - a[key]);
  const sum = rows.reduce((n, r) => n + r[key], 0);
  document.getElementById('subs-wrap').hidden = !thisOnly;
  document.getElementById('all-controls').hidden = thisOnly;
  document.getElementById('f-subs').checked = withSubs;
  document.getElementById('label').textContent = thisOnly
    ? 'This thread' + (withSubs ? ` + ${subCount} sub-thread${subCount === 1 ? '' : 's'}` : '')
    : flight
    ? `In flight, ${rows.length} thread${rows.length === 1 ? '' : 's'}`
    : (mode === 'today' ? 'Today, all threads' : `All time, ${data.threads.toLocaleString()} threads`);
  document.getElementById('total').textContent = usd(flight || thisOnly ? sum : (mode === 'today' ? data.total_today + liveToday : data.total_all + liveAll));
  document.getElementById('stamp').textContent = 'Live';
  setBtn('b-today', mode === 'today'); setBtn('b-all', mode === 'all'); setBtn('b-flight', mode === 'flight');
  setBtn('s-cost', sort === 'cost'); setBtn('s-latest', sort === 'latest');
  setBtn('sc-all', !thisOnly); setBtn('f-this', thisOnly);
  const max = Math.max(0.0001, ...rows.map(r => r[key]));
  const list = document.getElementById('list');
  list.innerHTML = '';
  if (!rows.length) {
    const e = document.createElement('div'); e.className = 'empty';
    e.textContent = thisOnly ? (focus ? 'No spend recorded for this thread yet.' : 'Open a thread to see its cost.') : flight ? 'Nothing in flight right now.' : 'No threads yet.';
    list.appendChild(e);
  }
  rows.slice(0, minimal() ? MINIMAL_ROWS : shown).forEach((r, i) => list.appendChild(rowEl(r, i, key, max, animate)));
  rowCount = rows.length;
}
// One thread: its title, cost and bar. A click unfolds its spend per model;
// the arrow button opens the thread.
function rowEl(r, i, key, max, animate) {
  const el = document.createElement('div');
  el.className = 'row' + (opened.has(r.id) ? ' open' : '') + (animate ? ' entering' : '');
  el.style.setProperty('--i', i);
  const headRow = document.createElement('div'); headRow.className = 'head-row';
  headRow.tabIndex = 0; headRow.setAttribute('role', 'button');
  headRow.setAttribute('aria-expanded', String(opened.has(r.id)));
  const title = document.createElement('div'); title.className = 'title';
  title.insertAdjacentHTML('beforeend', `<svg class="chev" aria-hidden="true"><use href="#i-chev"/></svg>`);
  const text = document.createElement('span'); text.className = 'title-text'; text.textContent = r.title;
  title.appendChild(text);
  const cost = document.createElement('div'); cost.className = 'cost'; cost.textContent = usd(r[key]);
  const go = document.createElement('button'); go.className = 'icon-btn go'; go.type = 'button';
  go.setAttribute('aria-label', `Open ${r.title}`); go.dataset.tooltip = 'Open thread'; go.innerHTML = icon('i-go');
  go.addEventListener('click', e => { e.stopPropagation(); lucidos.ui.navigate('thread', { id: r.id }); });
  const bar = document.createElement('div'); bar.className = 'bar';
  const fill = document.createElement('i'); fill.style.transform = `scaleX(${Math.max(0.02, r[key] / max)})`; bar.appendChild(fill);
  const sub = document.createElement('div'); sub.className = 'sub';
  if (r.status) { const d = document.createElement('span'); d.className = 'dot' + (r.status === 'running' ? '' : ' waiting'); sub.appendChild(d); }
  const bits = [];
  if (r.status) bits.push(r.status === 'running' ? 'running' : 'waiting on you');
  const models = breakdown(r, key);
  if (models.length) bits.push(short(models[0].name) + (models.length > 1 ? ` +${models.length - 1}` : ''));
  bits.push(r.calls ? `${r.calls.toLocaleString()} calls` : 'no calls yet');
  if (!thisOnly && (sort === 'latest' || flight)) bits.push(ago(r.lastMs));
  if (key === 'today' && r.all > r.today) bits.push(`${usd(r.all)} all time`);
  const subText = document.createElement('span'); subText.textContent = bits.filter(Boolean).join(' · ');
  sub.appendChild(subText);
  headRow.append(title, cost, go, bar, sub);
  const detail = document.createElement('div'); detail.className = 'detail';
  const inner = document.createElement('div');
  const box = document.createElement('div'); box.className = 'models';
  if (!models.length) {
    const none = document.createElement('span'); none.className = 'none'; none.textContent = 'No priced calls in this period.';
    box.appendChild(none);
  }
  const top = Math.max(0.0001, ...models.map(m => m.cost));
  for (const m of models) {
    const name = document.createElement('span'); name.className = 'name'; name.textContent = short(m.name);
    const calls = document.createElement('span'); calls.className = 'calls'; calls.textContent = `${m.calls.toLocaleString()} calls`;
    const c = document.createElement('span'); c.textContent = m.cost < 0.005 ? '<$0.01' : usd(m.cost);
    const share = document.createElement('span'); share.className = 'share';
    const s = document.createElement('i'); s.style.transform = `scaleX(${Math.max(0.02, m.cost / top)})`; share.appendChild(s);
    box.append(name, calls, c, share);
  }
  inner.appendChild(box); detail.appendChild(inner);
  el.append(headRow, detail);
  // Toggled in place, so the roll runs; the next render keeps the state.
  const toggle = () => {
    const open = !opened.has(r.id);
    if (open) opened.add(r.id); else opened.delete(r.id);
    el.classList.toggle('open', open);
    headRow.setAttribute('aria-expanded', String(open));
  };
  headRow.addEventListener('click', toggle);
  headRow.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); } });
  return el;
}
document.getElementById('b-today').onclick = () => { mode = 'today'; flight = false; shown = PAGE; render(true); };
document.getElementById('b-all').onclick = () => { mode = 'all'; flight = false; shown = PAGE; render(true); };
// In flight is a period of its own: the running threads, each at its whole spend so far.
document.getElementById('b-flight').onclick = async () => { mode = 'flight'; flight = true; shown = PAGE; await loadActive(); render(true); };
document.getElementById('s-cost').onclick = () => { sort = 'cost'; shown = PAGE; render(true); };
document.getElementById('s-latest').onclick = () => { sort = 'latest'; shown = PAGE; render(true); };
document.getElementById('sc-all').onclick = () => { if (!thisOnly) return; thisOnly = false; shown = PAGE; render(true); };
document.getElementById('f-this').onclick = () => { if (thisOnly) return; thisOnly = true; shown = PAGE; render(true); if (withSubs) loadSubs(); };
document.getElementById('f-subs').onchange = e => { withSubs = e.target.checked; shown = PAGE; render(true); if (withSubs) loadSubs(); };
// Every descendant of the focused thread, walked level by level through
// threads.list({ parent }), which returns direct children only.
async function loadSubs() {
  const root = focus;
  if (!root) { subIds = new Set(); subsFor = null; dirty = true; return; }
  const found = new Set();
  let frontier = [root];
  for (let depth = 0; depth < 8 && frontier.length; depth++) {
    const next = [];
    await Promise.all(frontier.map(async id => {
      try {
        const kids = await lucidos.threads.list({ parent: id, limit: 1000 });
        for (const t of kids || []) {
          const cid = t.thread_id || t.id;
          if (!cid || cid === root || found.has(cid)) continue;
          found.add(cid); next.push(cid);
          if (t.title && !titles.get(cid)) titles.set(cid, t.title);
        }
      } catch (e) {}
    }));
    frontier = next;
  }
  if (focus === root) { subIds = found; subsFor = root; dirty = true; }
}
// New sub-threads spawn while you watch, so the tree is re-walked.
setInterval(() => { if (thisOnly && withSubs && !document.hidden) loadSubs(); }, 15000);
// Infinite scroll: when the list end comes into view, add the next page.
// Re-observing after a render makes the observer fire again if the end is
// still visible (a tall window), so it keeps filling until it can scroll.
const sentinel = document.getElementById('sentinel');
const io = new IntersectionObserver(entries => {
  if (!entries.some(e => e.isIntersecting) || minimal() || shown >= rowCount) return;
  shown += PAGE; render(false);
  io.unobserve(sentinel); io.observe(sentinel);
}, { rootMargin: '0px 0px 200px 0px' });
io.observe(sentinel);
async function loadActive() {
  try {
    const rows = await lucidos.threads.list({ active: true, limit: 1000 });
    active = new Map((rows || []).map(t => [t.thread_id || t.id, t]));
    for (const [id, t] of active) if (titles.has(id) && !titles.get(id) && t.title) titles.set(id, t.title);
    dirty = true;
  } catch (e) {}
}
setInterval(() => { if (flight && !document.hidden) loadActive(); }, 10000);
// ---- Live: price every new call on top of the snapshot ----------------
// The snapshot (rebuilt hourly by scripts/token-cost/thread_costs.py) holds
// totals up to `last_sequence` plus today's rate card per model. Calls after
// the cursor arrive over SSE (and a catch-up query on load) and are priced
// here with the same rules: served model wins when another model answered,
// long tier above its threshold, repeated Claude Code usage frames dropped.
let live = new Map(), seen = new Set(), lastUsage = new Map(), titles = new Map();
let liveToday = 0, liveAll = 0, dirty = false;
const undated = id => id.replace(/-\d{3,}(?:-\d+)*$/, '');
function servedAsSent(sent, served) {
  const bare = id => String(id || '').split('/').pop().replace(/\[1m\]$/, '').replace(/@/g, '-').toLowerCase();
  const a = bare(sent), b = bare(served);
  if (!b.startsWith(a)) return false;
  const rest = b.slice(a.length);
  return rest === '' || rest.startsWith(':') || /^-\d{3}/.test(rest);
}
function rateKey(m) {
  const R = data.rates || {};
  m = String(m || '').toLowerCase().replace(/@[^\[]*/, '').replace('[1m]', '');
  if (R[m]) return m;
  m = m.replace(/^(?:[a-z]{2,6}\.)?anthropic\./, '');
  if (!R[m]) m = m.replace(/^(?:[a-z0-9_-]+\/)+/, '');
  m = m.replace(/-v\d+(?::\d+)?$/, '');
  if (m.startsWith('claude-')) m = m.replace(/(\d)\.(\d)/g, '$1-$2');
  if (!R[m]) m = undated(m);
  return R[m] ? m : null;
}
function priceCall(p) {
  const asked = p.model || '';
  const model = p.served_model && !servedAsSent(asked, p.served_model) ? p.served_model : asked;
  const k = rateKey(model);
  if (!k) return null;
  let r = data.rates[k];
  const u = p.usage, i = u.input_tokens || 0, cr = u.cache_read_tokens || 0, cw = u.cache_creation_tokens || 0, o = u.output_tokens || 0;
  if (r.long && (r.long.inclusive ? i >= r.long.t : i > r.long.t)) r = r.long;
  return { model: k, cost: (Math.max(0, i - cr - cw) * r.in + cr * r.cr + cw * r.cw + o * r.out) / 1e6 };
}
function fold(seq, tid, p, at) {
  if (!data || !p || !p.usage || !tid) return;
  if (seq != null) { if (seq <= (data.last_sequence || 0) || seen.has(seq)) return; seen.add(seq); }
  if (p.producer === 'claude_code') {
    const sig = JSON.stringify(p.usage);
    if (lastUsage.get(tid) === sig) return;
    lastUsage.set(tid, sig);
  }
  const c = priceCall(p);
  if (!c) return;
  const e = live.get(tid) || { cost: 0, calls: 0, models: {}, last: 0 };
  e.cost += c.cost; e.calls += 1; e.last = Math.max(e.last, at || Date.now()); live.set(tid, e);
  const m = e.models[c.model] || (e.models[c.model] = { cost: 0, calls: 0 });
  m.cost += c.cost; m.calls += 1;
  liveToday += c.cost; liveAll += c.cost; dirty = true;
  if (!titles.has(tid) && !known(tid)) titles.set(tid, null);
}
// The period's spend per model, most expensive first.
function breakdown(r, key) {
  return Object.entries(r.models || {}).map(([name, v]) => ({ name, cost: v[key] || 0, calls: v.calls || 0 }))
    .filter(m => m.cost > 0).sort((a, b) => b.cost - a.cost);
}
const find = tid => data.top_all.find(r => r.id === tid) || data.top_today.find(r => r.id === tid);
const known = tid => !!find(tid);
function pool(key) {
  // Today: every thread with spend today. All time: the 300 most expensive plus
  // today's threads, so "Latest" also finds recent cheap threads.
  const src = key === 'today' ? data.top_today : [...data.top_all, ...data.top_today];
  const byId = new Map();
  for (const r of src) if (!byId.has(r.id)) byId.set(r.id, { ...r, lastMs: ms(r.last) });
  for (const [tid, e] of live) {
    let r = byId.get(tid);
    if (!r) {
      const base = find(tid);
      r = base ? { ...base, lastMs: ms(base.last) } : { id: tid, title: titles.get(tid) || (active.get(tid) || {}).title || 'New thread', all: 0, today: 0, calls: 0, models: {}, lastMs: 0 };
      byId.set(tid, r);
    }
    r.all += e.cost; r.today += e.cost; r.calls += e.calls; r.live = true;
    // New objects, so the snapshot's own models are never mutated across renders.
    r.models = { ...r.models };
    for (const [k, v] of Object.entries(e.models)) {
      const o = r.models[k] || { all: 0, today: 0, calls: 0 };
      r.models[k] = { all: o.all + v.cost, today: o.today + v.cost, calls: o.calls + v.calls };
    }
    if (e.last > r.lastMs) r.lastMs = e.last;
  }
  return byId;
}
async function fillTitles() {
  const missing = [...titles].filter(([, t]) => !t).map(([id]) => id);
  if (!missing.length) return;
  try {
    const rows = await lucidos.threads.list({ limit: 300 });
    for (const t of rows || []) { const id = t.thread_id || t.id; if (titles.has(id) && t.title) titles.set(id, t.title); }
    dirty = true;
  } catch (e) {}
}
async function catchUp() {
  const cursor = data.last_sequence || 0, rows = [];
  let before = null;
  for (let page = 0; page < 30; page++) {
    let got;
    try { got = await lucidos.events.query({ event_type: 'ContextCaptured', since: new Date(new Date(data.generated).getTime() - 300000).toISOString(), limit: 500, ...(before ? { before_event_id: before } : {}) }); }
    catch (e) { break; }
    if (!Array.isArray(got) || !got.length) break;
    let done = false;
    for (const r of got) { if (r.sequence != null && r.sequence <= cursor) { done = true; break; } rows.push(r); }
    if (done || got.length < 500) break;
    before = got[got.length - 1].id;
  }
  rows.reverse().forEach(r => fold(r.sequence, r.thread_id, r.payload, ms(r.created_at || r.created || r.timestamp)));
  fillTitles();
}
setInterval(() => { if (dirty) { dirty = false; render(false); } }, 1000);
setInterval(fillTitles, 30000);

async function load(animate) {
  try {
    const fresh = JSON.parse(await lucidos.data.read(PATH));
    const first = !data;
    data = fresh;
    // Drop live calls the new snapshot now covers, and rebuild the tail.
    live = new Map(); seen = new Set([...seen].filter(s => s > (data.last_sequence || 0))); liveToday = 0; liveAll = 0;
    render(animate);
    await catchUp();
    render(false);
    if (first) lucidos.ui.ready && lucidos.ui.ready();
  } catch (e) {
    if (!data) document.getElementById('total').textContent = 'No data yet';
    lucidos.ui.ready && lucidos.ui.ready();
  }
}
// Focused thread: the thread in the main pane, null on an empty compose.
(async () => {
  try {
    focus = await lucidos.ui.focusedThread();
  } catch (e) {
    return; // Not inside Lucidos: no thread to follow, so the filter stays hidden.
  }
  document.getElementById('scope').hidden = false;
  lucidos.ui.onFocusedThreadChange(id => { focus = id; if (thisOnly) { render(false); if (withSubs) loadSubs(); } });
  render(false);
})();
lucidos.sse.connect();
lucidos.sse.on('ContextCaptured', ev => {
  const p = ev && (ev.event || ev.payload || ev);
  fold(ev && (ev.seq ?? ev.sequence), ev && ev.thread_id, p);
});
['ArtifactUpdated', 'ArtifactCreated', 'DataFileWritten'].forEach(ev => lucidos.sse.on(ev, p => {
  const path = String((p && (p.path || p.file_path || (p.event && p.event.path))) || '');
  if (path.includes('threads-cost.json')) load(false);
}));
load(true);
</script>
