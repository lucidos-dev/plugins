<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thread cost</title>
<script src="/api/v1/sdk-prefs.js"></script>
<link rel="stylesheet" href="/api/v1/sdk-iframe.css">
<script src="/api/v1/sdk.js"></script>
<style>
  body { margin: 0; padding: var(--space-lg); color: var(--text-primary); background: transparent;
    display: grid; gap: var(--space-lg); cursor: pointer; box-sizing: border-box; }
  body:focus-visible { outline: none; box-shadow: var(--focus-ring); }
  .meta { color: var(--text-muted); font-size: var(--font-size-xs); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hero { display: grid; gap: var(--space-xs); min-width: 0; }
  .total { font-size: var(--font-size-3xl); font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.1; }
  .today { color: var(--text-secondary); font-size: var(--font-size-xs); font-variant-numeric: tabular-nums; }
  .today b { color: var(--accent); font-weight: 600; }
  /* Calls no price card covers: kept out of the total, so the total says it
     is incomplete. Yellow like Token Cost's own "not included" note. */
  .unpriced { color: var(--accent-yellow); font-size: var(--font-size-xs); font-variant-numeric: tabular-nums;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* Model mix: one stacked bar, each model its own fill. */
  .mix { display: grid; gap: var(--space-sm); min-width: 0; }
  .stack { display: flex; height: 0.5rem; border-radius: var(--radius-round); overflow: hidden; background: var(--bg-secondary); gap: 0.125rem; }
  .stack i { display: block; height: 100%; transition: flex-grow var(--duration-normal); }
  .legend { display: grid; gap: var(--space-xs); font-size: var(--font-size-xs); font-variant-numeric: tabular-nums; }
  .legend div { display: grid; grid-template-columns: auto 1fr auto; gap: var(--space-sm); align-items: center; min-width: 0; }
  .legend span:nth-child(2) { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text-secondary); }
  .sw { width: 0.5rem; height: 0.5rem; border-radius: var(--radius-round); }
  .c0 { background: var(--accent); }
  .c1 { background: var(--accent-green); }
  .c2 { background: var(--accent-yellow); }
  .c3 { background: var(--text-muted); }

  /* Biggest threads in the tree. */
  .subs { display: grid; gap: var(--space-sm); font-size: var(--font-size-xs); }
  .sub { display: grid; grid-template-columns: 1fr auto; gap: 0.25rem var(--space-sm); min-width: 0; font-variant-numeric: tabular-nums; }
  .sub span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text-secondary); }
  .sub .bar { grid-column: 1 / -1; height: 0.1875rem; background: var(--bg-secondary); border-radius: var(--radius-round); overflow: hidden; }
  .sub .bar i { display: block; height: 100%; background: var(--text-muted); transform-origin: left; transition: transform var(--duration-normal); }
  .sub.root .bar i { background: var(--accent); }
  /* One row per agent session of this thread, newest last. */
  .sessions .bar i { background: var(--accent-green); }

  /* Scope pill: this thread alone, or with its sub-threads. It never grows
     past its box: buttons shrink and ellipsize instead of spilling out.
     Centering is optical, not metric. Each label is trimmed to cap height and
     baseline (text-box), then flex centers that box. Line-height centering uses
     the font's ascent and descent, which differ per font, so the label sat high
     in one theme font and low in another. */
  .scope { display: inline-flex; justify-self: start; align-items: stretch; padding: 0.125rem; gap: 0.125rem; background: var(--bg-secondary);
    border-radius: var(--radius-round); font-size: var(--font-size-xs); width: max-content; max-width: 100%; min-width: 0; box-sizing: border-box;
    height: 2rem; flex: none; overflow: hidden; }
  .scope button { all: unset; box-sizing: border-box; display: flex; align-items: center; justify-content: center; flex: 0 1 auto; min-width: 0;
    height: 100%; cursor: pointer; padding: 0 var(--space-sm); border-radius: var(--radius-round);
    color: var(--text-muted); font-weight: 600; white-space: nowrap; transition: background var(--duration-fast), color var(--duration-fast); }
  .scope button > span { display: block; min-width: 0; text-box: trim-both cap alphabetic;
    overflow: clip; overflow-clip-margin: 0.4em; text-overflow: ellipsis; }
  /* Same weight pressed or not: a weight change would resize the pill on every tap. */
  .scope button[aria-pressed="true"] { background: var(--accent); color: var(--bg-primary); }
  .scope button:focus-visible { box-shadow: inset 0 0 0 0.125rem var(--text-primary); }
  :root[data-motion="reduce"] .scope button { transition: none; }

  /* ---- Layout rules that make overlap impossible ----
     1. Every child of body sits in its own grid cell (auto rows, or one named
        area each on medium). Nothing is positioned or given a negative margin.
     2. The head slot holds the scope pill OR the label. CSS shows exactly one.
     3. Every cell clips its own width (min-width: 0, ellipsis), so a long
        value cannot reach into the next column.
     4. On a fixed-height tile, fit() drops the lowest-value rows until the
        content fits, so nothing is cut in half at the bottom edge. */
  body > * { min-width: 0; }
  .total { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* Spend and call count wrap onto separate lines in a narrow hero column. */
  .today { white-space: normal; }
  .today b { white-space: nowrap; }
  body:has(> #scope:not([hidden])) > #label { display: none; }
  html[data-widget-size="small"] #scope { display: none; }
  html[data-widget-size="small"] body > #label { display: block; }
  [data-fit-cut] { display: none !important; }
  .empty { color: var(--text-muted); font-size: var(--font-size-sm); }
  [hidden] { display: none !important; }

  .enter { animation: rise var(--duration-slow) both; animation-delay: calc(var(--i, 0) * var(--duration-fast) / 2); }
  @keyframes rise { from { opacity: 0; transform: translateY(0.375rem); } }
  :root[data-motion="reduce"] .enter { animation: none; }
  :root[data-motion="reduce"] .stack i, :root[data-motion="reduce"] .sub .bar i { transition: none; }

  /* ---- Inline and Canvas: the card has a fixed height, so the body scrolls
     inside it, by wheel, trackpad or finger. Tiles keep fit() instead. ---- */
  html:not([data-widget-size]) body { height: 100vh; overflow-y: auto; overflow-x: hidden; align-content: start;
    -webkit-overflow-scrolling: touch; scrollbar-width: thin; scrollbar-color: var(--border-color) transparent; }

  /* ---- Dashboard sizes. ---- */
  html[data-widget-size] body { height: 100vh; overflow: hidden; align-content: start; }
  /* Small: one square cell. Label, total, mix bar, top model, one line of advice. */
  html[data-widget-size="small"] body { padding: var(--space-md); gap: var(--space-sm); align-content: space-between; }
  html[data-widget-size="small"] .total { font-size: var(--font-size-2xl); }
  html[data-widget-size="small"] .subs,
  html[data-widget-size="small"] .today { display: none; }
  /* The legend is sorted by cost, so its first row is the top model. */
  html[data-widget-size="small"] .legend div:nth-child(n+2) { display: none; }
  /* Medium: two cells wide. One named area per child:
     head across, total left, mix right. */
  html[data-widget-size="medium"] body { padding: var(--space-md) var(--space-lg); gap: var(--space-sm) var(--space-lg);
    grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr); grid-template-rows: auto 1fr;
    grid-template-areas: "head head" "hero mix"; align-content: stretch; }
  html[data-widget-size="medium"] #label,
  html[data-widget-size="medium"] #scope { grid-area: head; }
  html[data-widget-size="medium"] .hero { grid-area: hero; }
  html[data-widget-size="medium"] .mix { grid-area: mix; align-content: start; padding-top: var(--space-xs); }
  html[data-widget-size="medium"] .subs { display: none; }
  html[data-widget-size="medium"] .total { font-size: var(--font-size-2xl); }
  html[data-widget-size="medium"] .legend div:nth-child(n+3) { display: none; }
  /* Large: two by two. Everything, three subs; fit() trims the rest. */
  html[data-widget-size="large"] body { gap: var(--space-md); }
  html[data-widget-size="large"] .subs .sub:nth-child(n+4) { display: none; }
  html[data-widget-size="large"] .sessions .sub:nth-child(n+4) { display: none; }
  /* Preview: param preview=small|medium|large draws one tile box inline. 10rem cell, 0.75rem gap. */
  html.preview body { height: auto; width: 100%; max-width: 20.75rem; margin: 0 auto; outline: 1px dashed var(--border-color); outline-offset: -1px; overflow: hidden; }
  html.preview[data-widget-size="small"] body { max-width: 10rem; height: 10rem; }
  html.preview[data-widget-size="medium"] body { height: 10rem; }
  html.preview[data-widget-size="large"] body { height: 20.75rem; }
</style>
</head>
<body tabindex="0" role="link" aria-label="Open Token Cost">
  <div class="meta" id="label">This thread</div>
  <div class="scope" id="scope" role="group" aria-label="Cost scope">
    <button type="button" data-incl="0"><span>This thread</span></button>
    <button type="button" data-incl="1" id="scope-subs"><span>+ sub-threads</span></button>
  </div>
  <div class="hero">
    <div class="total" id="total">…</div>
    <div class="today" id="today"></div>
    <div class="unpriced" id="unpriced" hidden></div>
  </div>
  <div class="mix" id="mix" hidden>
    <div class="stack" id="stack"></div>
    <div class="legend" id="legend"></div>
  </div>
  <div class="subs sessions" id="sessions" hidden></div>
  <div class="subs" id="subs" hidden></div>
<script>
lucidos.ui.applyPreferences();
lucidos.ui.watchPreferences();
const PATH = 'artifacts/token-cost/threads-cost.json';
// The same snapshot without threads idle for a week: a fraction of the size.
const HEAD_PATH = 'artifacts/token-cost/threads-cost-head.json';
const usd = n => '$' + n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const short = m => (m || '').replace(/^claude-/, '').replace(/-preview$/, '').replace(/-(\d)-(\d)$/, ' $1.$2').replace(/-(\d)$/, ' $1');
const ms = v => (typeof v === 'number' ? v : Date.parse(v || '') || 0);
let headOnly = false;
let data = null, focus = null, subIds = new Set(), subsFor = null, visible = true, drawn = false;
let live = new Map(), seen = new Set(), lastUsage = new Map(), titles = new Map(), dirty = false, reloading = false;

// Tap anywhere opens the Token Cost app.
const open = () => lucidos.ui.navigate('app', { app_id: 'token-cost' });
document.body.addEventListener('click', open);
document.body.addEventListener('keydown', e => { if (e.target !== document.body) return; if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(); } });

// Include sub-threads: one saved choice, default on. Tapping the pill never opens Token Cost.
const INCL_KEY = 'thread-cost.include-subs';
let incl = (() => { try { return localStorage.getItem(INCL_KEY) !== '0'; } catch (e) { return true; } })();
document.getElementById('scope').addEventListener('click', e => {
  e.stopPropagation();
  const b = e.target.closest('button[data-incl]');
  if (!b) return;
  incl = b.dataset.incl === '1';
  try { localStorage.setItem(INCL_KEY, incl ? '1' : '0'); } catch (err) {}
  render();
});
document.getElementById('scope').addEventListener('keydown', e => e.stopPropagation());

// ---- Snapshot lookup -----------------------------------------------------
// Whether a snapshot holds the focused thread's whole sub-thread tree: only
// the head names the threads it is complete for, in `closed`.
const covers = snap => !focus || (snap.closed || []).includes(focus);
function find(tid, snap = data) {
  const top = snap.top_all.find(r => r.id === tid) || snap.top_today.find(r => r.id === tid);
  if (top) return top;
  const c = snap.rest && snap.rest[tid];
  if (!c) return undefined;
  const [title, all, today, calls, last, byModel, extra, sessionData] = c;
  const unpriced = typeof extra === "number" ? extra : 0;
  const sessions = Array.isArray(extra) ? extra : sessionData;
  const models = {};
  for (const [k, [a, t, n]] of Object.entries(byModel || {})) models[k] = { all: a, today: t, calls: n };
  return { id: tid, title: title || 'Untitled', all, today, calls, last, models, sessions, unpriced };
}
// A thread's spend per agent session, snapshot rows plus live calls. Row 0 is
// spend no capture named a session for, so the rows always sum to the total.
function sessionRows(base, e, all) {
  const rows = new Map();
  for (const [n, a, model] of (base && base.sessions) || []) if (n) rows.set(n, { n, all: a, models: model ? { [model]: a } : {} });
  for (const [n, v] of Object.entries((e && e.sessions) || {})) {
    const k = Number(n), o = rows.get(k) || { n: k, all: 0, models: {} };
    o.all += v.cost;
    for (const [m, c] of Object.entries(v.models)) o.models[m] = (o.models[m] || 0) + c;
    rows.set(k, o);
  }
  const named = [...rows.values()].sort((a, b) => a.n - b.n);
  const earlier = all - named.reduce((t, r) => t + r.all, 0);
  const out = earlier >= 0.005 ? [{ n: 0, all: earlier, models: {} }, ...named] : named;
  return out.map(r => ({ n: r.n, all: r.all, model: Object.keys(r.models).sort((a, b) => r.models[b] - r.models[a])[0] }));
}
// One thread's spend: snapshot plus calls priced live since it was built.
// `unpriced` counts the calls no card prices: in `calls`, kept out of the money.
function threadCost(tid) {
  const base = find(tid);
  const r = { id: tid, title: (base && base.title) || titles.get(tid) || 'Untitled', all: base ? base.all : 0, today: base ? base.today : 0,
    calls: base ? base.calls : 0, unpriced: (base && base.unpriced) || 0, models: {},
    ttl: { ...((data.ttl_unknown && data.ttl_unknown[tid]) || {}) } };
  for (const [k, v] of Object.entries((base && base.models) || {})) r.models[k] = { ...v };
  const e = live.get(tid);
  if (e) {
    r.all += e.cost; r.today += e.cost; r.calls += e.calls; r.unpriced += e.unpriced;
    for (const [k, n] of Object.entries(e.ttl || {})) r.ttl[k] = (r.ttl[k] || 0) + n;
    for (const [k, v] of Object.entries(e.models)) {
      const o = r.models[k] || { all: 0, today: 0, calls: 0 };
      r.models[k] = { all: o.all + v.cost, today: o.today + v.cost, calls: o.calls + v.calls };
    }
  }
  r.sessions = sessionRows(base, e, r.all);
  return r;
}

// Write a region only when its markup changed, so a re-render that changes
// nothing touches no nodes, and one that changes something swaps them once.
function setHTML(el, html) { if (el._html !== html) { el._html = html; el.innerHTML = html; } }
// Reuse the stack fills, so a scope switch tweens the widths instead of
// rebuilding the bar.
function setStack(el, parts, total) {
  while (el.children.length > parts.length) el.lastElementChild.remove();
  while (el.children.length < parts.length) el.appendChild(document.createElement('i'));
  parts.forEach((p, i) => { const n = el.children[i]; n.className = p.c; n.style.flexGrow = String(Math.max(p.cost / (total || 1), 0.01)); });
}
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

// ---- Render ----------------------------------------------------------------
function render() {
  // A thread the head lacks would read $0, so the last paint stands until the full file lands.
  if (!data || (headOnly && !covers(data))) return;
  const $ = id => document.getElementById(id);
  const anim = !drawn;
  if (!focus) {
    $('scope').hidden = true; $('label').hidden = false;
    $('label').textContent = 'No thread open';
    $('total').textContent = '—';
    $('today').textContent = '';
    $('unpriced').hidden = true;
    $('mix').hidden = true; $('subs').hidden = true; $('sessions').hidden = true;
    fit();
    return;
  }
  const known = subsFor === focus;
  const avail = known ? subIds.size : 0;
  const ids = [focus, ...(known && incl ? subIds : [])];
  const tree = ids.map(threadCost);
  const total = tree.reduce((n, r) => n + r.all, 0);
  const today = tree.reduce((n, r) => n + r.today, 0);
  const calls = tree.reduce((n, r) => n + r.calls, 0);
  const unpriced = tree.reduce((n, r) => n + r.unpriced, 0);
  const mm = {};
  for (const r of tree) for (const [k, v] of Object.entries(r.models)) {
    const o = mm[k] || (mm[k] = { name: k, cost: 0, calls: 0 }); o.cost += v.all || 0; o.calls += v.calls || 0;
  }
  const models = Object.values(mm).filter(m => m.cost > 0).sort((a, b) => b.cost - a.cost);
  const n = incl ? avail : 0;
  // Pill shows only when there is something to switch; the meta label then
  // drops out on medium and large, and the small tile keeps a short label.
  // Always shown, so the layout never shifts, and the choice can be set
  // before a thread has any sub-threads.
  const pill = true;
  $('scope').hidden = false;
  $('scope-subs').firstElementChild.textContent = known ? `+ ${avail} sub-thread${avail === 1 ? '' : 's'}` : '+ sub-threads';
  for (const b of $('scope').querySelectorAll('button')) b.setAttribute('aria-pressed', String((b.dataset.incl === '1') === incl));
  const small = document.documentElement.dataset.widgetSize === 'small';
  $('label').hidden = false; // CSS picks label or pill for the head slot, never both
  $('label').textContent = n ? (small ? `This thread +${n}` : `This thread + ${n} sub-thread${n === 1 ? '' : 's'}`) : 'This thread';
  $('total').textContent = usd(total);
  // Never dropped by fit(): without it the total reads as complete.
  const warnings = [];
  if (unpriced) warnings.push(`Not included: ${unpriced.toLocaleString()} unpriced call${unpriced === 1 ? '' : 's'}`);
  const ttl = {};
  for (const r of tree) for (const [k, n] of Object.entries(r.ttl)) { const why = ttlReason(k); ttl[why] = (ttl[why] || 0) + n; }
  const ttlCalls = Object.values(ttl).reduce((a, b) => a + b, 0);
  if (ttlCalls) warnings.push(`${ttlCalls.toLocaleString()} call${ttlCalls === 1 ? '' : 's'} at the base cache write rate, lifetime unknown (${Object.keys(ttl).join('; ')})`);
  if (data?.ttl_pricing !== 1) warnings.push('Snapshot predates cache lifetime pricing; totals may omit write premiums until its next refresh.');
  $('unpriced').hidden = !warnings.length;
  $('unpriced').textContent = warnings.join(' · ');
  // One line with an ellipsis on a small tile: the whole note stays on hover.
  $('unpriced').title = warnings.join(' · ');
  $('today').innerHTML = calls ? `<b>${usd(today)}</b> today<br>${calls.toLocaleString()} calls` : 'No calls yet';

  // Mix: up to four models by name. Fold only when two or more remain,
  // since "1 more" hides a name that fits in the same row.
  const shown = models.length <= 4 ? 4 : 3;
  const top = models.slice(0, shown), rest = models.slice(shown).reduce((s, m) => s + m.cost, 0);
  const parts = top.map((m, i) => ({ name: short(m.name), cost: m.cost, c: 'c' + i }));
  if (rest > 0) parts.push({ name: `${models.length - 3} more`, cost: rest, c: 'c3' });
  $('mix').hidden = !parts.length;
  setStack($('stack'), parts, total);
  setHTML($('legend'), parts.map(p => `<div><span class="sw ${p.c}"></span><span>${esc(p.name)}</span><span>${p.cost < 0.005 ? '<$0.01' : usd(p.cost)}</span></div>`).join(''));

  // Sessions: this thread's own spend per agent session, once it has had two.
  const own = tree[0].sessions.filter(s => s.n > 0).length > 1 ? tree[0].sessions : [];
  const most = Math.max(0.0001, ...own.map(s => s.all));
  $('sessions').hidden = !own.length;
  setHTML($('sessions'), own.map((s, i) =>
    `<div class="sub${anim ? ' enter' : ''}" style="--i:${i}"><span>${s.n ? `Session ${s.n}` : 'Earlier'}${s.model ? ` · ${esc(short(s.model))}` : ''}</span><span>${usd(s.all)}</span><span class="bar"><i style="transform:scaleX(${Math.max(0.02, s.all / most)})"></i></span></div>`).join(''));

  // Subs: only worth showing when the tree has more than the root.
  const ranked = tree.filter(r => r.all > 0).sort((a, b) => b.all - a.all);
  const max = Math.max(0.0001, ...ranked.map(r => r.all));
  $('subs').hidden = tree.length < 2;
  setHTML($('subs'), ranked.slice(0, 6).map((r, i) =>
    `<div class="sub${r.id === focus ? ' root' : ''}${anim ? ' enter' : ''}" style="--i:${i}"><span>${r.id === focus ? 'This thread' : esc(titles.get(r.id) || r.title)}</span><span>${usd(r.all)}</span><span class="bar"><i style="transform:scaleX(${Math.max(0.02, r.all / max)})"></i></span></div>`).join(''));

  drawn = true;
  fit();
}

// ---- Fit: a fixed-height tile never clips a row in half -------------------
// Drop the lowest-value visible rows, in this order, until the content fits.
// The total is never dropped.
function fit() {
  for (const n of document.querySelectorAll('[data-fit-cut]')) n.removeAttribute('data-fit-cut');
  if (!document.documentElement.dataset.widgetSize) return;
  const b = document.body, $$ = q => [...document.querySelectorAll(q)];
  const over = () => b.scrollHeight > b.clientHeight + 1;
  if (!over()) return;
  const cuts = [
    ...$$('#subs > .sub').reverse(),
    ...$$('#sessions > .sub').reverse(),
    ...$$('#legend > div').slice(1).reverse(),
    document.getElementById('today'),
    document.getElementById('subs'),
    document.getElementById('sessions'),
    document.getElementById('legend'),
  ];
  for (const n of cuts) {
    if (!n.getClientRects().length) continue; // already hidden at this size
    n.setAttribute('data-fit-cut', '');
    if (!over()) return;
  }
}
window.addEventListener('resize', fit);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);

// ---- Sub-thread tree, walked level by level --------------------------------
async function loadSubs() {
  const root = focus;
  if (!root) { subIds = new Set(); subsFor = null; dirty = true; return; }
  const found = new Set();
  let frontier = [root];
  for (let depth = 0; depth < 8 && frontier.length; depth++) {
    const next = [];
    await Promise.all(frontier.map(async id => {
      try {
        const kids = await lucidos.threads.list({ parent: id, limit: 1000 });
        for (const t of kids || []) {
          const cid = t.thread_id || t.id;
          if (!cid || cid === root || found.has(cid)) continue;
          found.add(cid); next.push(cid);
          if (t.title) titles.set(cid, t.title);
        }
      } catch (e) {}
    }));
    frontier = next;
  }
  if (focus === root) {
    subIds = found; subsFor = root;
    remember(root, found);
    render(); // paint now, not on the next 1 s tick
  }
}

// Last known sub-thread tree per thread, so a thread you open again paints
// its full scope at once and the walk only corrects it.
const SUBS_KEY = 'thread-cost.subs';
const subCache = (() => { try { return new Map(Object.entries(JSON.parse(localStorage.getItem(SUBS_KEY) || '{}'))); } catch (e) { return new Map(); } })();
function remember(root, ids) {
  const list = [...ids].map(id => [id, titles.get(id) || '']);
  subCache.delete(root); subCache.set(root, list);
  while (subCache.size > 40) subCache.delete(subCache.keys().next().value);
  try { localStorage.setItem(SUBS_KEY, JSON.stringify(Object.fromEntries(subCache))); } catch (e) {}
}
function adoptCached(root) {
  const c = root && subCache.get(root);
  if (c) {
    for (const [id, t] of c) if (t && !titles.has(id)) titles.set(id, t);
    subIds = new Set(c.map(([id]) => id)); subsFor = root;
  } else { subIds = new Set(); subsFor = null; }
}

// ---- Live pricing on top of the hourly snapshot ----------------------------
// Today's rates come from Lucidos's price table (lucidos.priceTable.get(), ADR
// 0525): the shipped cards merged with the workspace override. The snapshot
// carries the same rates from its own run, and stands in only while the
// table cannot be read.
let tableRates = null;
const localDay = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
/** Each model's card in force today, in the snapshot's compact shape. */
function ratesFromTable(table) {
  const day = localDay(new Date()), out = {};
  for (const [id, cards] of Object.entries((table && table.models) || {})) {
    let c = null;
    for (const card of cards || []) if (!card.from || card.from <= day) c = card;
    if (!c || typeof c.uncached_in !== 'number' || typeof c.out !== 'number') continue;
    const e = { in: c.uncached_in, cr: c.cache_read || 0, cw: c.cache_write || 0, out: c.out,
                cw1h: c.cache_write_1h ?? c.cache_write ?? 0, cw12h: c.cache_write_12h ?? c.cache_write ?? 0 };
    const lg = c.long;
    if (lg && lg.threshold_tokens) {
      e.long = { t: lg.threshold_tokens, inclusive: lg.inclusive === true, in: lg.uncached_in ?? e.in,
                 cr: lg.cache_read ?? e.cr, cw: lg.cache_write ?? e.cw, out: lg.out ?? e.out,
                 cw1h: lg.cache_write_1h ?? lg.cache_write ?? e.cw, cw12h: lg.cache_write_12h ?? lg.cache_write ?? e.cw };
    }
    if (c.flex) { const f = c.flex; e.flex = { in:f.uncached_in || 0, cr:f.cache_read || 0, cw:f.cache_write || 0, out:f.out || 0,
      cw1h:f.cache_write_1h ?? f.cache_write ?? 0, cw12h:f.cache_write_12h ?? f.cache_write ?? 0 }; }
    out[id] = e;
  }
  return out;
}
async function loadRates() {
  try {
    if (!lucidos.priceTable) return;
    tableRates = ratesFromTable(await lucidos.priceTable.get());
    dirty = true;
  } catch (e) { /* the snapshot's rates stand in */ }
}
const currentRates = () => tableRates || (data && data.rates) || {};
const undated = id => id.replace(/-\d{3,}(?:-\d+)*$/, '');
function servedAsSent(sent, served) {
  const bare = id => String(id || '').split('/').pop().replace(/\[1m\]$/, '').replace(/@/g, '-').toLowerCase();
  const a = bare(sent), b = bare(served);
  if (!b.startsWith(a)) return false;
  const rest = b.slice(a.length);
  return rest === '' || rest.startsWith(':') || /^-\d{3}/.test(rest);
}
function rateKey(m) {
  const R = currentRates();
  m = String(m || '').toLowerCase().replace(/@[^\[]*/, '').replace('[1m]', '');
  if (R[m]) return m;
  m = m.replace(/^(?:[a-z]{2,6}\.)?anthropic\./, '');
  if (!R[m]) m = m.replace(/^(?:[a-z0-9_-]+\/)+/, '');
  m = m.replace(/-v\d+(?::\d+)?$/, '');
  if (m.startsWith('claude-')) m = m.replace(/(\d)\.(\d)/g, '$1-$2');
  if (!R[m]) m = undated(m);
  return R[m] ? m : null;
}
function writeBundle(u) {
  const cw = u.cache_creation_tokens || 0;
  const names = [['30m', 'cache_creation_30m_tokens'], ['1h', 'cache_creation_1h_tokens'], ['12h', 'cache_creation_12h_tokens']];
  const reported = names.filter(([, k]) => u[k] != null);
  let parts = null;
  if (cw > 0 && !reported.length && ['5m','30m','1h','12h'].includes(u.cache_creation_requested_ttl)) {
    parts = { [u.cache_creation_requested_ttl]: cw };
  } else if (cw > 0 && reported.length) {
    const total = reported.reduce((n, [, k]) => n + u[k], 0);
    if (reported.every(([, k]) => u[k] >= 0) && total <= cw && (total === cw || u.cache_creation_1h_tokens != null)) {
      parts = Object.fromEntries(reported.map(([ttl, k]) => [ttl, u[k]]));
      if (total < cw) parts['5m'] = cw - total;
    }
  }
  return { cache_write_known: parts ? cw : 0, cache_write_1h: parts?.['1h'] || 0, cache_write_12h: parts?.['12h'] || 0 };
}

function priceCall(p) {
  const asked = p.model || '';
  const model = p.served_model && !servedAsSent(asked, p.served_model) ? p.served_model : asked;
  const k = rateKey(model);
  if (!k) return null;
  let r = currentRates()[k];
  const u = p.usage, i = u.input_tokens || 0, cr = u.cache_read_tokens || 0, cw = u.cache_creation_tokens || 0, o = u.output_tokens || 0;
  if (r.long && (r.long.inclusive ? i >= r.long.t : i > r.long.t)) r = r.long;
  else if (u.service_tier === 'flex' && r.flex) r = r.flex;
  // An old snapshot has no lifetime prices for its live tail. Wait for the
  // price table or its next refresh instead of using a missing premium as 0.
  if (cw && tableRates === null && data?.ttl_pricing !== 1) return null;
  // A write with no lifetime evidence prices at the base write rate, the
  // lowest a write costs, and is counted so the total can say so.
  const w = writeBundle(u), h = w.cache_write_1h, t = w.cache_write_12h;
  const hour = r.cw1h ?? r.cw, twelve = r.cw12h ?? r.cw;
  const write = (cw - h - t) * r.cw + h * hour + t * twelve;
  return { model: k, cost: (Math.max(0, i - cr - cw) * r.in + cr * r.cr + write + o * r.out) / 1e6,
           ttlUnknown: w.cache_write_known < cw };
}
// Why a call's cache lifetime is unknown, by the producer that made it.
function ttlReason(producer) {
  if (producer === 'codex') return 'Codex reports no lifetime split';
  if (producer === 'claude_code') return 'Claude Code before Lucidos 0.49.0';
  return 'calls before Lucidos 0.50.0 or on routes without the split';
}
const tracked = tid => tid === focus || subIds.has(tid);
function fold(seq, tid, p) {
  if (!data || !p || !p.usage || !tid) return;
  if (seq != null) { if (seq <= (data.last_sequence || 0) || seen.has(seq)) return; seen.add(seq); }
  if (p.producer === 'claude_code') {
    const sig = JSON.stringify(p.usage);
    const slot = `${tid}@${p.session ?? ''}`;
    if (lastUsage.get(slot) === sig) return;
    lastUsage.set(slot, sig);
  }
  const c = priceCall(p);
  const e = live.get(tid) || { cost: 0, calls: 0, unpriced: 0, ttl: {}, models: {} };
  live.set(tid, e);
  e.calls += 1;
  if (!c) { e.unpriced += 1; if (tracked(tid)) dirty = true; return; }
  e.cost += c.cost;
  if (c.ttlUnknown) e.ttl[p.producer || ''] = (e.ttl[p.producer || ''] || 0) + 1;
  const m = e.models[c.model] || (e.models[c.model] = { cost: 0, calls: 0 });
  m.cost += c.cost; m.calls += 1;
  if (p.session != null) {
    const ss = e.sessions || (e.sessions = {});
    const s = ss[p.session] || (ss[p.session] = { cost: 0, models: {} });
    s.cost += c.cost; s.models[c.model] = (s.models[c.model] || 0) + c.cost;
  }
  if (tracked(tid)) dirty = true;
}
async function catchUp() {
  const cursor = data.last_sequence || 0, rows = [];
  let before = null;
  for (let page = 0; page < 30; page++) {
    let got;
    try { got = await lucidos.events.query({ event_type: 'ContextCaptured', since: new Date(new Date(data.generated).getTime() - 300000).toISOString(), limit: 500, ...(before ? { before_event_id: before } : {}) }); }
    catch (e) { break; }
    if (!Array.isArray(got) || !got.length) break;
    let done = false;
    for (const r of got) { if (r.sequence != null && r.sequence <= cursor) { done = true; break; } rows.push(r); }
    if (done || got.length < 500) break;
    before = got[got.length - 1].id;
  }
  rows.reverse().forEach(r => fold(r.sequence, r.thread_id, r.payload));
}
let readied = false;
function signalReady() {
  if (readied) return;
  readied = true;
  lucidos.ui.ready && lucidos.ui.ready();
}
// First paint from the head file, when it holds the focused thread's whole
// tree. Otherwise the full read paints, as before.
async function paintHead() {
  try {
    const head = JSON.parse(await lucidos.data.read(HEAD_PATH));
    if (!covers(head)) return;
    data = head; headOnly = true;
    render();
    signalReady();
  } catch (e) { /* the full read paints */ }
}
async function load() {
  // Fetched again with each snapshot, so a new day picks its own cards.
  const ratesReady = loadRates();
  // First load paints the snapshot at once so the cover lifts fast. A RELOAD
  // (a fresh hourly snapshot landing while you watch) holds the repaint until
  // the live catch-up has re-folded the recent calls, so the figure never dips
  // to the snapshot-only value and back. `reloading` also parks the 1 s tick,
  // so a half-folded state is never painted mid-reload.
  const first = !drawn;
  reloading = true;
  if (first) await paintHead();
  try {
    data = JSON.parse(await lucidos.data.read(PATH));
    headOnly = false;
    // The live tally starts over, so `seen` and the frame dedupe start over
    // with it: the catch-up must fold again every call after the new cursor,
    // including those the old tally already held.
    live = new Map(); seen = new Set(); lastUsage = new Map();
    if (first) render();
  } catch (e) {
    if (!data) document.getElementById('total').textContent = 'No data yet';
  }
  // Lift the cover on the snapshot paint; the live catch-up refines it after.
  signalReady();
  await ratesReady;
  if (data) { try { await catchUp(); } catch (e) {} }
  reloading = false;
  if (data) render();
}

// ---- Wiring ----------------------------------------------------------------
let ticks = [];
function startTimers() {
  stopTimers();
  ticks.push(setInterval(() => { if (dirty && !reloading) { dirty = false; render(); } }, 1000));
  ticks.push(setInterval(loadSubs, 15000)); // new sub-threads spawn while you watch
}
function stopTimers() { ticks.forEach(clearInterval); ticks = []; }
if (lucidos.widget && lucidos.widget.onVisibility) lucidos.widget.onVisibility(v => {
  visible = v; if (v) { loadSubs(); startTimers(); render(); } else stopTimers();
});
if (lucidos.widget && lucidos.widget.onSize) lucidos.widget.onSize(() => render());

const PREVIEW = (() => { try { const v = (lucidos.params() || {}).preview; return ['small','medium','large'].includes(v) ? v : null; } catch (e) { return null; } })();
function pinPreview() {
  if (!PREVIEW) return;
  const el = document.documentElement;
  if (!el.classList.contains('preview')) el.classList.add('preview');
  if (el.dataset.widgetSize !== PREVIEW) el.dataset.widgetSize = PREVIEW;
}
pinPreview();
if (PREVIEW) new MutationObserver(pinPreview).observe(document.documentElement, { attributes: true, attributeFilter: ['data-widget-size', 'class'] });

(async () => {
  try { focus = await lucidos.ui.focusedThread(); } catch (e) { focus = null; }
  adoptCached(focus);
  try { lucidos.ui.onFocusedThreadChange(id => { focus = id; adoptCached(id); drawn = false; render(); loadSubs(); }); } catch (e) {}
  // Snapshot read and sub-thread walk run side by side, not one after the other.
  await Promise.all([load(), loadSubs()]);
  startTimers();
})();
lucidos.sse.connect();
lucidos.sse.on('ContextCaptured', ev => {
  const p = ev && (ev.event || ev.payload || ev);
  fold(ev && (ev.seq ?? ev.sequence), ev && ev.thread_id, p);
});
lucidos.sse.on('ArtifactUpdated', p => { if (p && p.artifact_path === 'token-cost/threads-cost.json') load(); });
lucidos.sse.on('ArtifactCreated', p => { if (p && p.artifact_path === 'token-cost/threads-cost.json') load(); });
// A price edit or the price check rewrites the override; take its prices.
lucidos.sse.on('DataFileWritten', d => { if (String((d && (d.path || (d.event && d.event.path))) || '').endsWith('config/model-prices.json')) loadRates(); });
</script>
