<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Super Slides</title>
<!--
  ════════════════════════════════════════════════════════════════════
  This app runs in an isolated iframe at an opaque origin. Behind a
  gateway the frame sends no device credential with a subresource, so a
  stylesheet link or script src pointing at one of the app's OWN files
  would answer 401 and the app would render unstyled or dead. Every one
  of them is therefore INLINED below.

  /api/v1/sdk*.js and /api/v1/sdk-iframe.css are exempt from the device
  gate and stay real external tags.

  ⚠ The inlined blocks are COPIES of the sibling source files, which are
  kept (tests/index.html loads drive.js and nav-logic.js directly, and
  knowhow/slides-format.md documents the layout). There is no build step:
  edit the source file AND the copy here, or the app and the tests drift.
  ════════════════════════════════════════════════════════════════════
-->
<style>
/* ═══════════ styles.css (inlined) ═══════════ */

@import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@300;400;500;600;700&family=Chakra+Petch:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Exo+2:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,600&family=JetBrains+Mono:wght@400;500&display=swap');

:root {
  --bg: #0a0a0f;
  --surface: #3a4770;
  --border: #4f5d8a;
  --card-border-neutral: #7a7a85;
  --text: #f0f0f5;
  --text-dim: #d0d4e4;
  --accent: #6a96e0;
  --accent-glow: rgba(106, 150, 224, 0.22);
  --green: #22c55e;
  --green-glow: rgba(34, 197, 94, 0.15);
  --amber: #f59e0b;
  --amber-glow: rgba(245, 158, 11, 0.15);
  --cyan: #06b6d4;
  --cyan-glow: rgba(6, 182, 212, 0.15);
  --rose: #f43f5e;
  --rose-glow: rgba(244, 63, 94, 0.15);
  --orange: #f97316;
  --orange-glow: rgba(249, 115, 22, 0.15);
  --purple: #a855f7;
  --purple-glow: rgba(168, 85, 247, 0.15);

  /* Layout constants */
  --slide-pad-top: 64px;
  --slide-pad-x: 72px;
  --slide-pad-bottom: 48px;
  --content-max-w: 1000px;
  --text-max-w: 800px;
  --section-gap: 32px;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

#app { height: 100vh; touch-action: manipulation; }

body {
  font-family: 'Exo 2', system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  overflow: hidden;
  height: 100vh;
  width: 100vw;
}

/* ══════════════════════════════════════
   Bottom bar — menu + nav hint
   ══════════════════════════════════════ */

.bottom-bar {
  position: fixed; bottom: 24px; left: 32px;
  display: flex; align-items: center; gap: 14px;
  z-index: 200;
}

.menu-wrapper { position: relative; }

.menu-btn {
  background: none;
  border: 1px solid transparent;
  color: var(--text-dim);
  font-size: 16px;
  cursor: pointer;
  padding: 3px 7px;
  border-radius: 6px;
  opacity: 0.4;
  transition: opacity 0.2s, border-color 0.2s, background 0.2s;
  line-height: 1;
}
.menu-btn:hover {
  opacity: 0.9;
  border-color: var(--border);
  background: rgba(255,255,255,0.04);
}

.menu-dropdown {
  display: none;
  position: absolute;
  bottom: calc(100% + 8px);
  left: 0;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 6px 0;
  min-width: 260px;
  box-shadow: 0 -4px 32px rgba(0,0,0,0.5);
  z-index: 300;
}
.menu-dropdown.open { display: block; }

.menu-label {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--text-dim);
  padding: 8px 16px 6px;
  opacity: 0.6;
}

.menu-item {
  padding: 10px 16px;
  font-size: 13px;
  color: var(--text);
  cursor: pointer;
  transition: background 0.15s;
  display: flex;
  align-items: center;
  gap: 10px;
}
.menu-item:hover {
  background: rgba(255,255,255,0.06);
}
.menu-item.active {
  color: var(--text);
  background: rgba(255,255,255,0.10);
}
.menu-item.active:hover {
  background: rgba(255,255,255,0.14);
}
.menu-item .menu-dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--accent);
  opacity: 0;
  flex-shrink: 0;
}
.menu-item.active .menu-dot { opacity: 1; }

.menu-separator {
  height: 1px;
  background: var(--border);
  margin: 6px 0;
  opacity: 0.5;
}

.menu-item-action {
  color: var(--text-dim);
  font-size: 12px;
}
.menu-item-action:hover {
  color: var(--text);
}
.menu-item-action .menu-dot-remote {
  width: auto; height: auto;
  background: none;
  opacity: 0.7;
  font-size: 11px;
  border-radius: 0;
}

.nav-hint {
  font-size: 12px; color: var(--text-dim); opacity: 0.5;
}

/* ══════════════════════════════════════
   Shell — progress & counter
   ══════════════════════════════════════ */

.progress {
  position: fixed; top: 0; left: 0; height: 3px;
  background: linear-gradient(90deg, var(--accent), var(--cyan));
  transition: width 0.4s ease; z-index: 100;
}
.counter {
  position: fixed; bottom: 24px; right: 32px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px; color: var(--text-dim); z-index: 100;
  cursor: pointer; padding: 3px 8px; border-radius: 6px;
  border: 1px solid transparent;
  transition: border-color 0.2s, background 0.2s, opacity 0.2s;
  opacity: 0.6;
  user-select: none;
}
.counter:hover {
  opacity: 1; border-color: var(--border);
  background: rgba(255,255,255,0.04);
}

.slide-picker {
  display: none;
  position: fixed; bottom: 52px; right: 32px;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 10px; padding: 6px 0;
  min-width: 200px; max-height: 60vh; overflow-y: auto;
  box-shadow: 0 -4px 32px rgba(0,0,0,0.5);
  z-index: 300;
}
.slide-picker.open { display: block; }

.slide-picker-item {
  padding: 8px 16px;
  font-size: 13px; color: var(--text-dim);
  cursor: pointer; display: flex; align-items: center; gap: 10px;
  transition: background 0.15s;
}
.slide-picker-item:hover { background: rgba(255,255,255,0.06); }
.slide-picker-item.active { color: var(--accent); }
.slide-picker-item .picker-num {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px; min-width: 20px; text-align: right;
  opacity: 0.5;
}
.slide-picker-item.active .picker-num { opacity: 1; }

.bg-dots {
  position: fixed; inset: 0; z-index: -1;
  background-image: radial-gradient(rgba(106,150,224,0.08) 1px, transparent 1px);
  background-size: 30px 30px;
}

/* ══════════════════════════════════════
   Deck & Slides
   ══════════════════════════════════════ */

.deck { position: relative; width: 100%; height: 100%; }

.slide {
  position: absolute; inset: 0;
  display: flex; flex-direction: column;
  justify-content: flex-start;
  align-items: center;
  padding: var(--slide-pad-top) var(--slide-pad-x) var(--slide-pad-bottom);
  opacity: 0;
  transition: opacity 0.4s ease-in;
  pointer-events: none;
}
.slide.active { opacity: 1; pointer-events: all; }
.slide.slide-hero { justify-content: center; }

/* ══════════════════════════════════════
   Typography
   ══════════════════════════════════════ */

h1 { font-family: 'Rajdhani', sans-serif; font-size: 52px; font-weight: 800; letter-spacing: -1.5px; line-height: 1.1; margin-bottom: 16px; }
h2 { font-family: 'Rajdhani', sans-serif; font-size: 38px; font-weight: 700; letter-spacing: -1px; line-height: 1.2; margin-bottom: 8px; }
h3 { font-family: 'Rajdhani', sans-serif; font-size: 22px; font-weight: 600; letter-spacing: -0.5px; margin-bottom: 8px; }
.subtitle {
  font-size: 20px; font-weight: 300; color: var(--text-dim); line-height: 1.5;
  max-width: var(--text-max-w);
}

/* ══════════════════════════════════════
   Tags
   ══════════════════════════════════════ */

.tag {
  font-family: 'Rajdhani', sans-serif;
  display: inline-block; padding: 6px 16px; border-radius: 20px;
  font-size: 12px; font-weight: 600; letter-spacing: 1px;
  text-transform: uppercase; margin-bottom: 16px;
}
.tag-accent { background: var(--accent-glow); color: var(--accent); border: 1px solid rgba(106,150,224,0.3); }
.tag-green { background: var(--green-glow); color: var(--green); border: 1px solid rgba(34,197,94,0.3); }
.tag-amber { background: var(--amber-glow); color: var(--amber); border: 1px solid rgba(245,158,11,0.3); }
.tag-cyan { background: var(--cyan-glow); color: var(--cyan); border: 1px solid rgba(6,182,212,0.3); }
.tag-orange { background: var(--orange-glow); color: var(--orange); border: 1px solid rgba(249,115,22,0.3); }
.tag-purple { background: var(--purple-glow); color: var(--purple); border: 1px solid rgba(168,85,247,0.3); }

.center { text-align: center; }

/* ══════════════════════════════════════
   Layout — Columns & Grids
   ══════════════════════════════════════ */

.columns {
  display: grid; grid-template-columns: 1fr 1fr; gap: 24px;
  width: 100%; max-width: var(--content-max-w); margin-top: var(--section-gap);
}
.three-col {
  display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 24px;
  width: 100%; max-width: var(--content-max-w); margin-top: var(--section-gap);
}
.four-col {
  display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 20px;
  width: 100%; max-width: var(--content-max-w); margin-top: var(--section-gap);
}

.group {
  display: flex; flex-direction: column; gap: 24px;
}

/* ══════════════════════════════════════
   Cards
   ══════════════════════════════════════ */

.card {
  background: var(--surface); border: 2px solid var(--card-border-neutral);
  border-radius: 16px; padding: 24px; text-align: left;
}
.card h3 { margin-bottom: 10px; color: #fff; }
.card p, .card li { font-size: 14px; color: var(--text-dim); line-height: 1.7; }
.card ul { list-style: none; padding: 0; }
.card ul li { padding: 5px 0; padding-left: 20px; position: relative; }
.card ul li::before { content: '→'; position: absolute; left: 0; color: var(--accent); font-weight: 600; }

/* Highlight variants keep neutral gray border at rest — color is reserved for focus state */
.card.highlight-accent,
.card.highlight-green,
.card.highlight-amber,
.card.highlight-cyan,
.card.highlight-rose,
.card.highlight-orange,
.card.highlight-purple { border-color: var(--card-border-neutral); box-shadow: none; }

/* ══════════════════════════════════════
   Card Focus Mode
   ══════════════════════════════════════ */

.card,
.insight,
.pipeline {
  transition: transform 0.35s cubic-bezier(0.33,0,0.2,1),
              opacity 0.35s ease,
              filter 0.35s ease,
              border-color 0.35s ease,
              box-shadow 0.35s ease;
}

.slide.has-card-focus .card {
  opacity: 0.2;
  filter: saturate(0.15) brightness(0.55);
  transform: scale(0.97);
  border-color: var(--card-border-neutral);
  box-shadow: none;
}

.slide.has-card-focus .card.card-focused {
  opacity: 1;
  filter: none;
  transform: scale(1.06);
  z-index: 10;
  position: relative;
  border-color: var(--accent) !important;
  box-shadow: 0 0 0 2px var(--accent),
              0 0 80px rgba(106,150,224,0.38),
              0 0 180px rgba(106,150,224,0.22),
              0 0 280px rgba(106,150,224,0.12),
              0 8px 32px rgba(0,0,0,0.3) !important;
}

.slide.has-card-focus.insight-focused .card {
  opacity: 1;
  filter: none;
  transform: scale(1);
  transition: transform 0.35s cubic-bezier(0.33,0,0.2,1),
              opacity 0.9s ease,
              filter 0.9s ease,
              border-color 0.35s ease,
              box-shadow 0.35s ease;
}

.slide.has-card-focus.insight-focused .pipeline {
  opacity: 1;
  filter: none;
  transition: opacity 0.9s ease, filter 0.9s ease;
}

.slide.has-card-focus .insight {
  opacity: 0.12;
  filter: saturate(0.15);
}

.slide.has-card-focus .insight.card-focused {
  opacity: 1;
  filter: none;
  transform: scale(1.06);
  z-index: 20;
  position: relative;
  border-color: var(--accent) !important;
  box-shadow: 0 0 0 2px var(--accent),
              0 0 30px rgba(106,150,224,0.35),
              0 0 60px rgba(106,150,224,0.2),
              0 0 120px rgba(106,150,224,0.1),
              0 8px 32px rgba(0,0,0,0.4) !important;
  /* Hand transform solely to the keyframe animation — a competing
     transform transition (inherited from the base rule) causes jank. */
  transition: opacity 0.9s ease,
              filter 0.9s ease,
              border-color 0.35s ease,
              box-shadow 0.35s ease;
  animation: insight-pop 0.55s cubic-bezier(0.33, 0, 0.2, 1);
}

/* The "wave" — when the insight lands as the focused (last) card it grows past
   its resting focus size and springs back to settle. A pronounced overshoot so
   it reads as a deliberate pulse, not just a scale-in. Transform-only, one shot.
   Resting focus size is scale(1.06), so the animation ends there. */
@keyframes insight-pop {
  0%   { transform: scale(0.97); opacity: 0.3; }
  45%  { transform: scale(1.14); }
  72%  { transform: scale(1.03); }
  100% { transform: scale(1.06); }
}

/* The insight only pulses when it BECOMES the focused card — i.e. when you
   arrow → onto it as the last highlighted thing on the slide. That pulse is the
   `insight-pop` animation above, which is keyed to `.insight.card-focused`, so
   it fires on focus and only on focus. Arrowing ← back to the second-last card
   removes `.card-focused`, so the insight drops to its dimmed/hidden state and
   stays perfectly still — no entrance pulse, no flash-through.

   There is deliberately NO slide-entrance pulse (`.slide.active .insight`): a
   pulse tied to the slide appearing fired on every visit, including going back,
   which is exactly the "it waves at me while it's supposed to be quiet" bug. */

@media (prefers-reduced-motion: reduce) {
  .slide.has-card-focus .insight.card-focused {
    animation: none;
  }
}

.slide.has-card-focus .pipeline {
  opacity: 0.12;
  filter: saturate(0.15);
}

/* ══════════════════════════════════════
   Takeaway Focus Mode
   ══════════════════════════════════════ */

.takeaway-item {
  transition: transform 0.35s cubic-bezier(0.33,0,0.2,1),
              opacity 0.35s ease,
              filter 0.35s ease,
              border-color 0.35s ease,
              box-shadow 0.35s ease;
  border-radius: 12px;
  padding: 16px 20px;
  border: 1px solid transparent;
}

.slide.has-card-focus .takeaway-item {
  opacity: 0.15;
  filter: saturate(0.15) brightness(0.55);
  transform: scale(0.97);
}

.slide.has-card-focus .takeaway-item.card-focused {
  opacity: 1;
  filter: none;
  transform: scale(1.04);
  z-index: 10;
  position: relative;
  background: rgba(106,150,224,0.04);
  border-color: var(--accent);
  box-shadow: 0 0 0 1px var(--accent),
              0 0 40px var(--accent-glow),
              0 0 80px rgba(106,150,224,0.08),
              0 8px 32px rgba(0,0,0,0.3);
}

/* ══════════════════════════════════════
   Components
   ══════════════════════════════════════ */

.icon-large { font-size: 28px; margin-bottom: 12px; display: block; }

.team-badge { display: flex; align-items: center; gap: 12px; margin-bottom: 28px; }
.team-badge .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 10px var(--accent); }
.team-badge span { font-size: 14px; font-weight: 500; color: var(--text-dim); letter-spacing: 1px; text-transform: uppercase; }

.insight {
  border: 1px solid rgba(106,150,224,0.3);
  background: rgba(106,150,224,0.05);
  border-radius: 12px; padding: 20px 28px;
  max-width: var(--text-max-w); margin-top: 24px; text-align: center;
}
.insight p { font-size: 16px; line-height: 1.6; color: var(--text-dim); }
.insight strong { color: var(--text); }
.insight em { color: var(--accent); font-style: normal; font-weight: 600; }
.insight.insight-purple { border-color: rgba(168,85,247,0.3); background: rgba(168,85,247,0.05); }
.insight.insight-green { border-color: rgba(34,197,94,0.3); background: rgba(34,197,94,0.05); }
.insight.insight-orange { border-color: rgba(249,115,22,0.3); background: rgba(249,115,22,0.05); }
.insight.insight-cyan { border-color: rgba(6,182,212,0.3); background: rgba(6,182,212,0.05); }

.pipeline {
  display: flex; align-items: stretch; gap: 0;
  width: 100%; max-width: var(--content-max-w); margin-top: var(--section-gap);
}
.pipeline-step {
  flex: 1; padding: 20px 14px; text-align: center;
  position: relative; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 6px;
  background: var(--surface); border: 1px solid var(--border);
}
.pipeline-step:first-child { border-radius: 12px 0 0 12px; }
.pipeline-step:last-child { border-radius: 0 12px 12px 0; }
.pipeline-step:not(:last-child)::after {
  content: '▸'; position: absolute; right: -8px; top: 50%;
  transform: translateY(-50%); font-size: 16px;
  color: var(--accent); z-index: 2; font-weight: 800;
}
.pipeline-step .step-icon { font-size: 24px; }
.pipeline-step .step-label { font-family: 'Rajdhani', sans-serif; font-size: 13px; font-weight: 600; color: var(--text); }
.pipeline-step .step-owner { font-size: 11px; font-weight: 600; letter-spacing: 0.5px; }
.pipeline-step .step-sub { font-size: 11px; color: var(--text-dim); line-height: 1.15; }

.skill-chips {
  display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px;
}
.skill-chip {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px; padding: 4px 10px; border-radius: 6px;
  background: rgba(255,255,255,0.04); border: 1px solid var(--border);
  color: var(--text-dim);
}
.card.highlight-orange .skill-chip { color: var(--orange); border-color: rgba(249,115,22,0.25); background: rgba(249,115,22,0.05); }
.card.highlight-cyan .skill-chip { color: var(--cyan); border-color: rgba(6,182,212,0.25); background: rgba(6,182,212,0.05); }
.card.highlight-green .skill-chip { color: var(--green); border-color: rgba(34,197,94,0.25); background: rgba(34,197,94,0.05); }
.card.highlight-accent .skill-chip { color: var(--accent); border-color: rgba(106,150,224,0.25); background: rgba(106,150,224,0.05); }
.card.highlight-rose .skill-chip { color: var(--rose); border-color: rgba(244,63,94,0.25); background: rgba(244,63,94,0.05); }

.owner-human { color: var(--cyan); }
.owner-claude { color: var(--orange); }
.owner-machine { color: var(--green); }
.owner-hybrid { color: var(--purple); }

.vs-label {
  font-size: 14px; font-weight: 700; letter-spacing: 2px;
  text-transform: uppercase; color: var(--text-dim); margin-bottom: 8px;
}

.es-flow {
  display: flex; align-items: center; gap: 8px;
  font-family: 'JetBrains Mono', monospace; font-size: 12px;
  color: var(--text-dim); margin-top: 12px; flex-wrap: wrap;
}
.es-event {
  background: rgba(168,85,247,0.1); border: 1px solid rgba(168,85,247,0.3);
  border-radius: 6px; padding: 4px 10px; color: var(--purple); font-weight: 500;
}
.es-arrow { color: var(--purple); }

.takeaway-list {
  max-width: var(--text-max-w);
  width: 100%;
  margin-top: var(--section-gap);
  text-align: left;
}
.takeaway-item {
  display: flex; gap: 16px; align-items: baseline;
  margin-bottom: 20px;
}
.takeaway-item:last-child { margin-bottom: 0; }
.takeaway-num {
  font-family: 'Rajdhani', sans-serif;
  font-size: 28px; color: var(--accent); font-weight: 800; flex-shrink: 0;
  min-width: 24px; text-align: right;
}
.takeaway-item h3 { margin-bottom: 4px; }
.takeaway-item p { color: var(--text-dim); font-size: 15px; line-height: 1.6; }

.tree {
  font-family: 'JetBrains Mono', monospace;
  font-size: 14px;
  line-height: 1.05;
  white-space: pre;
  color: #33ff33;
  background: #000000;
  border: 1px solid #1a3a1a;
  border-radius: 12px;
  padding: 24px 32px;
  text-align: left;
  max-width: 520px;
  width: 100%;
  box-shadow: 0 0 30px rgba(0, 255, 0, 0.05), inset 0 0 60px rgba(0, 0, 0, 0.3);
}
.tree .dir { color: #5cf; font-weight: 600; }
.tree .file { color: #ccc; }
.tree .highlight { color: #33ff33; font-weight: 600; text-shadow: 0 0 6px rgba(51, 255, 51, 0.25); }
.tree .exec { color: #33ff33; font-weight: 500; }
.tree .config { color: #f6f; }
.tree .comment { color: #336633; }

.slide-header {
  width: 100%;
  min-height: 190px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  flex-shrink: 0;
}

.arch-diagram {
  width: 100%; max-width: var(--content-max-w); margin-top: var(--section-gap);
}

/* ══════════════════════════════════════
   Title Scroller
   ══════════════════════════════════════ */

.persistent-title {
  font-family: 'Rajdhani', sans-serif;
  font-size: 16px; font-weight: 600; letter-spacing: 4px;
  text-transform: uppercase; color: #A8C4E0; margin-bottom: 40px;
}

.title-scroller {
  position: fixed;
  inset: 0;
  z-index: 10;
  pointer-events: none;
  transition: opacity 0.6s ease;
}
.title-scroller.hidden { opacity: 0; pointer-events: none; }

.title-scroller .persistent-title {
  position: absolute;
  top: 64px;
  left: 0; right: 0;
  text-align: center;
  margin-bottom: 0;
}

.title-scroller .persistent-subtitle {
  position: absolute;
  bottom: 130px;
  left: 0; right: 0;
  text-align: center;
  font-size: 18px;
  font-weight: 300;
  letter-spacing: 1px;
  color: #A8C4E0;
  margin: 0;
  opacity: 0.85;
  line-height: 1.5;
}

.title-scroller .team-badge {
  position: absolute;
  bottom: 48px;
  left: 50%;
  transform: translateX(-50%);
  margin-bottom: 0;
}

.title-viewport {
  position: absolute;
  inset: 0;
  overflow: hidden;
  contain: layout style;
}

.title-item {
  font-family: 'Rajdhani', sans-serif;
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  text-align: center;
  font-weight: 800;
  letter-spacing: -1.5px;
  line-height: 1.15;
  padding: 0 80px;
  white-space: normal;
  transform-origin: center center;
  will-change: transform, opacity;
  backface-visibility: hidden;
  contain: layout style;
  transition:
    transform 0.75s cubic-bezier(0.33, 0, 0.2, 1),
    opacity 0.6s ease;
}

.title-item[data-title="0"] { font-size: 60px; }
.title-item[data-title="1"] { font-size: 56px; }
.title-item[data-title="2"] { font-size: 38px; }

.title-item[data-title="2"] {
  font-weight: 500;
  font-style: italic;
  letter-spacing: -0.5px;
  line-height: 1.3;
}

.floating-asterisk {
  position: absolute;
  z-index: 12;
  font-size: 28px;
  font-weight: 800;
  color: var(--amber);
  opacity: 0;
  pointer-events: none;
  will-change: transform, opacity;
  backface-visibility: hidden;
}

.floating-asterisk.pulse {
  animation: asterisk-pulse 0.8s ease forwards;
}

@keyframes asterisk-pulse {
  0%   { opacity: 0; transform: scale(1); text-shadow: none; }
  15%  { opacity: 1; transform: scale(1.6); text-shadow: 0 0 20px rgba(245,158,11,0.6), 0 0 40px rgba(245,158,11,0.3); }
  40%  { opacity: 1; transform: scale(0.9); text-shadow: 0 0 10px rgba(245,158,11,0.3); }
  65%  { opacity: 1; transform: scale(1.15); text-shadow: 0 0 15px rgba(245,158,11,0.4); }
  100% { opacity: 1; transform: scale(1); text-shadow: 0 0 8px rgba(245,158,11,0.2); }
}

.results-may-vary {
  color: var(--amber);
  font-size: 13px;
  font-style: italic;
  position: absolute;
  left: 0; right: 0;
  text-align: center;
  opacity: 0;
  z-index: 11;
  pointer-events: none;
  transition: none;
  will-change: transform, opacity;
  backface-visibility: hidden;
}

/* ══════════════════════════════════════
   Section Indicator
   ══════════════════════════════════════ */

.section-indicator {
  position: fixed;
  top: 16px;
  right: 32px;
  display: flex;
  gap: 6px;
  z-index: 100;
  align-items: center;
}

.section-pip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 11px;
  border-radius: 999px;
  cursor: pointer;
  transition: all 0.35s ease;
  opacity: 0.35;
  border: 1px solid transparent;
  line-height: 1;
  box-sizing: border-box;
}

.section-pip:hover {
  opacity: 0.7;
}

.section-pip.active {
  opacity: 1;
  background: rgba(255,255,255,0.04);
  border-color: var(--sec-color);
  box-shadow: 0 0 20px color-mix(in srgb, var(--sec-color) 20%, transparent);
}

.pip-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--sec-color);
  transition: transform 0.3s ease, box-shadow 0.3s ease;
  flex-shrink: 0;
}

.section-pip.active .pip-dot {
  transform: scale(1.3);
  box-shadow: 0 0 8px var(--sec-color);
}

.pip-label {
  font-family: 'Rajdhani', sans-serif;
  font-size: 11px;
  font-weight: 500;
  color: var(--text-dim);
  letter-spacing: 0.5px;
  white-space: nowrap;
  transition: color 0.3s ease;
}

.section-pip.active .pip-label {
  color: var(--text);
}

/* ══════════════════════════════════════
   Picker Section Groups
   ══════════════════════════════════════ */

.picker-section {
  padding: 2px 0;
}

.picker-section:not(:first-child) {
  border-top: 1px solid var(--border);
  margin-top: 2px;
}

.picker-section-label {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  padding: 8px 16px 4px;
  opacity: 0.7;
}

/* ══════════════════════════════════════
   Loading State
   ══════════════════════════════════════ */

.ss-loading {
  position: fixed;
  inset: 0;
  z-index: 9998;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 20px;
  background: var(--bg);
}

.ss-loading p {
  font-size: 14px;
  color: var(--text-dim);
  letter-spacing: 0.5px;
}

.ss-loading-spinner {
  width: 32px;
  height: 32px;
  border: 3px solid rgba(99, 102, 241, 0.15);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: ss-spin 0.8s linear infinite;
}

@keyframes ss-spin {
  to { transform: rotate(360deg); }
}

/* ══════════════════════════════════════
   Error Overlay
   ══════════════════════════════════════ */

.ss-error-overlay {
  position: fixed;
  inset: 0;
  z-index: 9999;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--bg);
  padding: 40px;
}

.ss-error-box {
  max-width: 560px;
  width: 100%;
  background: var(--surface);
  border: 1px solid rgba(244, 63, 94, 0.35);
  border-radius: 16px;
  padding: 36px 40px;
  box-shadow: 0 0 60px rgba(244, 63, 94, 0.08), 0 8px 32px rgba(0, 0, 0, 0.4);
  text-align: left;
}

.ss-error-box .ss-error-icon {
  font-size: 32px;
  margin-bottom: 16px;
  display: block;
}

.ss-error-box h2 {
  font-size: 22px;
  font-weight: 700;
  color: var(--rose);
  margin-bottom: 12px;
  letter-spacing: -0.3px;
}

.ss-error-box .ss-error-message {
  font-size: 14px;
  color: var(--text-dim);
  line-height: 1.65;
  margin-bottom: 20px;
}

.ss-error-box .ss-error-detail {
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  color: var(--rose);
  background: rgba(244, 63, 94, 0.06);
  border: 1px solid rgba(244, 63, 94, 0.15);
  border-radius: 8px;
  padding: 14px 18px;
  line-height: 1.6;
  white-space: pre-wrap;
  word-break: break-word;
  max-height: 180px;
  overflow-y: auto;
}

.ss-error-box .ss-error-source {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  color: var(--text-dim);
  opacity: 0.5;
  margin-top: 16px;
}

/* ══════════════════════════════════════
   Inline Editing
   ══════════════════════════════════════ */

.ss-editable {
  cursor: text;
  border-radius: 4px;
  position: relative;
  /* NOTE: No transition here — it would override element-specific transitions
     (e.g. title-item transform/opacity animations). Hover feedback is instant. */
}

/* Hover hint — editing requires long-press (touch) or double-click (desktop) */
body:not(.ss-editing-disabled) .ss-editable:hover {
  background: rgba(99, 102, 241, 0.08);
  box-shadow: 0 0 0 1px rgba(99, 102, 241, 0.2);
}

/* Allow clicking editable elements inside the title scroller — but ONLY when visible.
   Without :not(.hidden), invisible title items steal clicks from slide content below. */
body:not(.ss-editing-disabled) .title-scroller:not(.hidden) .ss-editable {
  pointer-events: auto;
  cursor: text;
}

.ss-editable.ss-editing {
  background: rgba(99, 102, 241, 0.12);
  box-shadow: 0 0 0 2px var(--accent);
  outline: none;
  cursor: text;
  border-radius: 4px;
  padding: 1px 3px;
  margin: -1px -3px;
  min-width: 20px;
}

.ss-editable.ss-saved {
  animation: ss-save-flash 0.8s ease;
}

@keyframes ss-save-flash {
  0%   { box-shadow: 0 0 0 2px var(--green); background: rgba(34, 197, 94, 0.15); }
  100% { box-shadow: none; background: transparent; }
}

/* Disable hover effects and text selection in fullscreen */
body.ss-editing-disabled .ss-editable {
  cursor: default;
}

body.ss-editing-disabled .deck {
  -webkit-user-select: none;
  user-select: none;
}

/* Inline render error (for unknown node types) */

.ss-render-error {
  display: inline-block;
  background: rgba(244, 63, 94, 0.08);
  border: 1px dashed rgba(244, 63, 94, 0.35);
  border-radius: 8px;
  padding: 10px 16px;
  margin: 4px 0;
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  color: var(--rose);
  opacity: 0.85;
}

/* ══════════════════════════════════════
   Semantic Utility Classes
   ══════════════════════════════════════ */

/* Colors — !important so utilities always override component defaults (e.g. .card p) */
.c-accent { color: var(--accent) !important; }
.c-green { color: var(--green) !important; }
.c-amber { color: var(--amber) !important; }
.c-cyan { color: var(--cyan) !important; }
.c-rose { color: var(--rose) !important; }
.c-orange { color: var(--orange) !important; }
.c-purple { color: var(--purple) !important; }
.c-white { color: #fff !important; }
.c-dim { color: var(--text-dim) !important; }
.c-text { color: var(--text) !important; }

/* Text alignment */
.ta-center { text-align: center; }
.ta-left { text-align: left; }
.ta-right { text-align: right; }

/* Font weight */
.fw-300 { font-weight: 300; }
.fw-400 { font-weight: 400; }
.fw-500 { font-weight: 500; }
.fw-600 { font-weight: 600; }
.fw-700 { font-weight: 700; }
.fw-800 { font-weight: 800; }

/* Font family */
.font-mono { font-family: 'JetBrains Mono', monospace; }

/* Font sizes */
.sz-xs { font-size: 11px; }
.sz-sm { font-size: 13px; }
.sz-md { font-size: 15px; }
.sz-lg { font-size: 18px; }
.sz-xl { font-size: 22px; }
.sz-2xl { font-size: 28px; }
.sz-3xl { font-size: 38px; }
.sz-4xl { font-size: 42px; }
.sz-5xl { font-size: 52px; }

/* Margins */
.mt-xs { margin-top: 4px; }
.mt-sm { margin-top: 8px; }
.mt-md { margin-top: 16px; }
.mt-lg { margin-top: 24px; }
.mt-xl { margin-top: 32px; }
.mt-2xl { margin-top: 40px; }

.mb-xs { margin-bottom: 4px; }
.mb-sm { margin-bottom: 8px; }
.mb-md { margin-bottom: 16px; }
.mb-lg { margin-bottom: 24px; }
.mb-xl { margin-bottom: 32px; }

/* Gap overrides on grid/flex containers */
.gap-xs { gap: 6px; }
.gap-sm { gap: 12px; }
.gap-md { gap: 20px; }
.gap-lg { gap: 24px; }
.gap-xl { gap: 32px; }

/* Line heights */
.leading-tight { line-height: 1.3; }
.leading-normal { line-height: 1.6; }
.leading-relaxed { line-height: 1.8; }
.leading-loose { line-height: 2.0; }
.leading-double { line-height: 2.2; }

/* Heading sub */
.heading-sub { font-size: 14px; font-weight: 400; }

/* ══════════════════════════════════════
   Stat Block
   ══════════════════════════════════════ */

.stat-block { text-align: center; padding: 4px 0; }
.stat-value { font-family: 'Rajdhani', sans-serif; font-size: 42px; font-weight: 700; padding: 4px 0; }
.stat-label { color: var(--text-dim); margin-bottom: 12px; }
.stat-sublabel { font-size: 13px; }
.stat-sublabel strong { color: var(--text); }

.stat-amber .stat-value { color: var(--amber); }
.stat-cyan .stat-value { color: var(--cyan); }
.stat-accent .stat-value { color: var(--accent); }
.stat-green .stat-value { color: var(--green); }
.stat-orange .stat-value { color: var(--orange); }
.stat-purple .stat-value { color: var(--purple); }
.stat-rose .stat-value { color: var(--rose); }

/* ══════════════════════════════════════
   Spacer
   ══════════════════════════════════════ */

.spacer-xs { height: 4px; }
.spacer-sm { height: 8px; }
.spacer-md { height: 16px; }
.spacer-lg { height: 24px; }
.spacer-xl { height: 32px; }
.spacer-2xl { height: 48px; }

/* ══════════════════════════════════════
   Align items (for columns, groups)
   ══════════════════════════════════════ */

.align-start { align-items: start; }
.align-center { align-items: center; }
.align-end { align-items: end; }
.align-stretch { align-items: stretch; }

/* ══════════════════════════════════════
   Remote Modal
   ══════════════════════════════════════ */

#ssRemoteModal,
#ssDriveModal {
  position: fixed;
  inset: 0;
  z-index: 10000;
  display: flex;
  align-items: center;
  justify-content: center;
  /* When the visible viewport shrinks (iOS keyboard up), the JS pins this
     container to visualViewport and the card may be taller than the remaining
     space. Allow it to scroll, and center via auto-margins so the top is never
     clipped (a known flexbox issue with align-items:center + overflow). */
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 24px;
}

.remote-modal-backdrop {
  position: absolute;
  inset: 0;
  background: rgba(0, 0, 0, 0.7);
  backdrop-filter: blur(4px);
}

.remote-modal-card {
  position: relative;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 28px 32px;
  max-width: 400px;
  width: 100%;
  margin: auto;
  box-shadow: 0 8px 48px rgba(0, 0, 0, 0.5);
}

.remote-modal-card h3 {
  font-size: 18px;
  font-weight: 700;
  color: var(--text);
  margin-bottom: 8px;
}

.remote-modal-hint {
  font-size: 13px;
  color: var(--text-dim);
  line-height: 1.5;
  margin-bottom: 16px;
}

.remote-modal-url {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  color: var(--accent);
  background: rgba(99, 102, 241, 0.06);
  border: 1px solid rgba(99, 102, 241, 0.2);
  border-radius: 8px;
  padding: 10px 14px;
  word-break: break-all;
  line-height: 1.5;
  margin-bottom: 20px;
}

.remote-modal-actions {
  display: flex;
  gap: 10px;
}

.remote-modal-btn {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 12px 16px;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: rgba(255, 255, 255, 0.04);
  color: var(--text);
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  transition: background 0.15s, border-color 0.15s;
}

.remote-modal-btn:hover {
  background: rgba(255, 255, 255, 0.08);
  border-color: var(--accent);
}

.remote-modal-btn:active {
  transform: scale(0.97);
}

.remote-modal-btn-icon {
  font-size: 16px;
}

/* ── Google Drive modals ── */
.ss-drive-card { max-width: 440px; }

.ss-drive-list {
  max-height: 240px;
  overflow-y: auto;
  border: 1px solid var(--border);
  border-radius: 10px;
  margin-bottom: 16px;
}

.ss-drive-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 11px 14px;
  cursor: pointer;
  border-bottom: 1px solid var(--border);
  transition: background 0.12s;
}
.ss-drive-item:last-child { border-bottom: none; }
.ss-drive-item:hover { background: rgba(255, 255, 255, 0.05); }

.ss-drive-item-name {
  font-size: 14px;
  color: var(--text);
  font-weight: 500;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.ss-drive-item-time {
  font-size: 11px;
  color: var(--text-dim);
  flex-shrink: 0;
}

.ss-drive-loading, .ss-drive-empty {
  padding: 22px 14px;
  text-align: center;
  font-size: 13px;
  color: var(--text-dim);
}
.ss-drive-err { color: #e0a0a0; white-space: pre-wrap; line-height: 1.5; }

.ss-drive-or {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--text-dim);
  text-align: center;
  margin: 6px 0 12px;
  opacity: 0.7;
}

.ss-drive-linkrow { display: flex; gap: 8px; }

.ss-drive-input {
  flex: 1;
  min-width: 0;
  padding: 10px 12px;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: rgba(255, 255, 255, 0.04);
  color: var(--text);
  font-size: 13px;
  font-family: inherit;
}
.ss-drive-input:focus {
  outline: none;
  border-color: var(--accent);
}
.ss-drive-input::placeholder { color: var(--text-dim); opacity: 0.7; }

.ss-drive-go { flex: 0 0 auto; }

.ss-drive-sharebtns { margin-bottom: 14px; }
.ss-drive-sharebtns .remote-modal-btn { width: 100%; }

/* ── Drive folder browser ── */
.ss-drive-crumbs {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 4px;
  font-size: 12px;
  color: var(--text-dim);
  margin-bottom: 10px;
}
.ss-drive-crumb,
.ss-crumb {
  cursor: pointer;
  padding: 2px 4px;
  border-radius: 5px;
  color: var(--accent);
}
.ss-drive-crumb:hover,
.ss-crumb:hover { background: rgba(255, 255, 255, 0.06); }
.ss-drive-crumb-sep,
.ss-crumb-sep { opacity: 0.5; }

.ss-drive-browser {
  max-height: 320px;
  overflow-y: auto;
  border: 1px solid var(--border);
  border-radius: 10px;
}
.ss-drive-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  border-bottom: 1px solid var(--border);
  cursor: pointer;
}
.ss-drive-row:last-child { border-bottom: none; }
.ss-drive-row:hover { background: rgba(255, 255, 255, 0.05); }
.ss-drive-row-icon { flex: 0 0 auto; font-size: 15px; }
.ss-drive-row-name {
  flex: 1;
  min-width: 0;
  font-size: 13px;
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.ss-drive-row-chev { flex: 0 0 auto; color: var(--text-dim); opacity: 0.7; }
.ss-drive-row-time { flex: 0 0 auto; font-size: 11px; color: var(--text-dim); }
.ss-drive-file .ss-drive-row-name { color: var(--text); }

.ss-drive-actionsbar { margin-top: 12px; display: flex; flex-direction: column; gap: 8px; }
.ss-drive-savehere { width: 100%; }
.ss-drive-savehere strong { font-weight: 600; }
/* Default (pin) + New folder side by side */
.ss-drive-folderactions { display: flex; gap: 8px; }
.ss-drive-folderactions .ss-drive-pin,
.ss-drive-folderactions .ss-drive-newfolder { flex: 1 1 0; }
/* Inline new-folder form (replaces the actions row while typing) */
.ss-drive-newfolderform { display: flex; flex-direction: column; gap: 10px; }
.ss-drive-naming-label { font-size: 13px; color: var(--text-dim); }
.ss-drive-naming-row { display: flex; gap: 8px; align-items: center; }
.ss-drive-newfolderform .ss-drive-input { flex: 1 1 auto; }
.ss-drive-newfolderform .remote-modal-btn { flex: 0 0 auto; }

/* While naming a new folder: collapse the tall body (folder list, crumbs, the
   trailing Cancel footer) and pin the card to the top of the screen, so the
   input sits high above the on-screen keyboard. The app is in an iframe where
   the keyboard does NOT shrink visualViewport, so reflow-around-keyboard is
   impossible — collapse + top-anchor is the robust fix and avoids scroll jank. */
.ss-drive-card.ss-drive-naming { margin-top: 0; align-self: flex-start; }
.ss-drive-card.ss-drive-naming .ss-drive-crumbs,
.ss-drive-card.ss-drive-naming .ss-drive-browser,
.ss-drive-card.ss-drive-naming > .remote-modal-actions { display: none; }

.ss-drive-hint-inline {
  font-size: 12px;
  color: var(--text-dim);
  text-align: center;
  padding: 4px 0;
  opacity: 0.8;
}

/* ══════════════════════════════════════
   Mobile Responsive
   ══════════════════════════════════════ */

@media (max-width: 600px) {
  :root {
    --slide-pad-top: 36px;
    --slide-pad-x: 16px;
    --slide-pad-bottom: 48px;
    --content-max-w: 100%;
    --text-max-w: 100%;
    --section-gap: 14px;
  }

  /* Allow slides to scroll when content overflows */
  .slide {
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    justify-content: flex-start !important;
  }

  /* Shrink the Drive folder list on phones so the modal's foot (incl. the
     inline "new folder" input) stays within the keyboard-reduced viewport. */
  .ss-drive-browser { max-height: 40vh; }
  .remote-modal-card { padding: 20px; }

  /* Typography — aggressive scaling for ~393px screens */
  h1 { font-size: 22px; letter-spacing: -0.5px; margin-bottom: 8px; }

  </div>
  <span class="nav-hint">↑↓ slides · ←→ cards · click to navigate</span>
</div>

<!-- Presentation renders here -->
<div id="app">
  <div class="ss-loading">
    <div class="ss-loading-spinner"></div>
    <p>Loading presentations…</p>
  </div>
</div>

<!-- The SDK is exempt from the device gate, so it stays a real external
     tag — and it must load BEFORE the inlined app scripts, which call
     lucidos.* at evaluation time (SS.appState starts its read immediately). -->
<script src="/api/v1/sdk.js"></script>
<script>
// Force full reload when restored from bfcache (Safari/iOS PWA)
window.addEventListener('pageshow', function(e) {
  if (e.persisted) location.reload();
});
</script>
<script>
/* ═══════════ components.js (inlined) ═══════════ */
/* ══════════════════════════════════════════════
   Super Slides — Reusable Components
   ══════════════════════════════════════════════
   Pure functions returning HTML strings.
   
   RULE: .slides files contain ZERO CSS.
   All styling is handled here and in styles.css.
   Semantic props (mt, mb, align, color, size, etc.)
   map to utility classes.
   ══════════════════════════════════════════════ */

const SS = {};

/* ══════════════════════════════════════════════
   Workspace-scoped app state (SS.appState)
   ══════════════════════════════════════════════
   The app runs in an isolated iframe at an opaque origin, so
   `localStorage` throws SecurityError — and an unguarded throw
   takes the rest of the script with it. Everything that used to
   live there and is a WORKSPACE fact rather than a device fact
   now lives in one JSON document, read and written over the SDK
   bridge:

     artifacts/super-slides/state.json
       presentationId   ← ss-pres
       slideIndex       ← ss-slide
       cardIndex        ← ss-card
       driveFileMap     ← ss-drive-map
       driveLastFolder  ← ss-drive-last-folder

   Two consequences every caller has to respect:

   1. The read is ASYNCHRONOUS where localStorage was synchronous.
      `get()` answers from an in-memory mirror that is empty until
      the document lands, so render a sane default first and apply
      the restored value inside `ready().then(…)`.
   2. Writes are DEBOUNCED. A data write makes a git commit, and
      slide navigation persists on every step.

   `ss-mode` deliberately did NOT move here — it is a per-device
   fact (presenter on the laptop, remote on the phone). See init.js
   and remote-mode.js.
   ══════════════════════════════════════════════ */

SS.appState = (function () {
  const PATH = 'artifacts/super-slides/state.json';
  const WRITE_DEBOUNCE_MS = 1500;

  let state = {};        // in-memory mirror — always readable synchronously
  let loadPromise = null;
  let writeTimer = null;
  let writing = false;
  let dirty = false;

  // Resolves once the document has been read (or has been established as
  // absent). Safe to call repeatedly — the read happens once.
  function ready() {
    if (loadPromise) return loadPromise;
    loadPromise = (async () => {
      try {
        const parsed = JSON.parse(await lucidos.data.read(PATH));
        if (parsed && typeof parsed === 'object') state = parsed;
      } catch (e) {
        // No document yet (404), malformed, or no SDK — start empty.
        state = {};
      }
      return state;
    })();
    return loadPromise;
  }

  function get(key, fallback) {
    return Object.prototype.hasOwnProperty.call(state, key) ? state[key] : fallback;
  }

  function set(key, value) {
    // Cheap no-op guard for scalars; objects are always re-persisted.
    if (value === null || typeof value !== 'object') {
      if (state[key] === value) return;
    }
    state[key] = value;
    dirty = true;
    if (writeTimer) clearTimeout(writeTimer);
    writeTimer = setTimeout(flush, WRITE_DEBOUNCE_MS);
  }

  async function flush() {
    if (writeTimer) { clearTimeout(writeTimer); writeTimer = null; }
    // A write already in flight will pick up the newer state when it settles.
    if (!dirty || writing) return;
    if (!window.lucidos || !lucidos.data) return;
    dirty = false;
    writing = true;
    try {
      await lucidos.data.write(PATH, JSON.stringify(state, null, 2));
    } catch (e) {
      console.warn('[SS] state write failed:', e);
    } finally {
      writing = false;
      if (dirty) writeTimer = setTimeout(flush, WRITE_DEBOUNCE_MS);
    }
  }

  // Best-effort: don't drop a debounced write when the page goes away.
  window.addEventListener('pagehide', () => { flush(); });
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden') flush();
  });

  // Start the read immediately — every caller's first paint races it.
  if (window.lucidos && lucidos.data) ready();

  return { ready, get, set, flush, PATH };
})();

// ── Custom component registry ──

SS._customComponents = {};

SS.registerComponent = (name, renderFn) => {
  SS._customComponents[name] = renderFn;
};

// ── Utility: build class list from semantic props ──

SS._classes = (base, node) => {
  const c = Array.isArray(base) ? [...base] : [base];
  if (node.mt) c.push('mt-' + node.mt);
  if (node.mb) c.push('mb-' + node.mb);
  if (node.align) c.push('align-' + node.align);
  if (node.gap) c.push('gap-' + node.gap);
  return c.filter(Boolean).join(' ');
};

// ── Editable wrapper: wraps text in a span with edit data attrs ──

SS._editable = (text, path, prop) => {
  if (!path) return text;
  return `<span class="ss-editable" data-ss-path="${path}" data-ss-prop="${prop}">${text}</span>`;
};

// ── Tags ──

SS.tag = (text, color, path) => {
  const editAttr = path ? ` data-ss-path="${path}" data-ss-prop="text"` : '';
  const editCls = path ? ' ss-editable' : '';
  return `<span class="tag tag-${color}${editCls}"${editAttr}>${text}</span>`;
};

// ── Slide header (tag + h2 + subtitle) ──

SS.slideHeader = (tagHtml, title, subtitle, path) => {
  const titleAttr = path ? ` data-ss-path="${path}" data-ss-prop="title"` : '';
  const titleCls = path ? ' ss-editable' : '';
  const subAttr = path ? ` data-ss-path="${path}" data-ss-prop="subtitle"` : '';
  const subCls = path ? ' ss-editable' : '';
  return `<div class="slide-header">
    ${tagHtml}
    <h2 class="${titleCls}"${titleAttr}>${title}</h2>
    <p class="subtitle${subCls}"${subAttr}>${subtitle}</p>
  </div>`;
};

// ── Cards ──

SS.card = (content, node = {}) => {
  const classes = ['card'];
  if (node.highlight) classes.push('highlight-' + node.highlight);
  if (node.className) classes.push(node.className);
  if (node.mt) classes.push('mt-' + node.mt);
  if (node.mb) classes.push('mb-' + node.mb);
  if (node.align) classes.push('ta-' + node.align);
  return `<div class="${classes.join(' ')}">${content}</div>`;
};

// ── Layout ──

SS.columns = (items, node = {}) =>
  `<div class="${SS._classes('columns', node)}">${items.join('')}</div>`;

SS.threeCol = (items, node = {}) =>
  `<div class="${SS._classes('three-col', node)}">${items.join('')}</div>`;

SS.fourCol = (items, node = {}) =>
  `<div class="${SS._classes('four-col', node)}">${items.join('')}</div>`;

// ── Insight ──

SS.insight = (content, color, path) => {
  const editAttr = path ? ` data-ss-path="${path}" data-ss-prop="text"` : '';
  const editCls = path ? ' ss-editable' : '';
  return `<div class="insight${color ? ' insight-' + color : ''}"><p class="${editCls}"${editAttr}>${content}</p></div>`;
};

// ── Icon ──

SS.icon = (emoji) =>
  `<span class="icon-large">${emoji}</span>`;

// ── Unordered list ──

SS.list = (items, path) => {
  if (path) {
    return `<ul>${items.map((item, i) =>
      `<li class="ss-editable" data-ss-path="${path}" data-ss-prop="items[${i}]">${item}</li>`
    ).join('')}</ul>`;
  }
  return `<ul>${items.map(i => `<li>${i}</li>`).join('')}</ul>`;
};

// ── Skill chips ──

SS.skillChips = (chips, path) => {
  if (path) {
    return `<div class="skill-chips">${chips.map((c, i) =>
      `<span class="skill-chip ss-editable" data-ss-path="${path}" data-ss-prop="chips[${i}]">${c}</span>`
    ).join('')}</div>`;
  }
  return `<div class="skill-chips">${chips.map(c => `<span class="skill-chip">${c}</span>`).join('')}</div>`;
};

// ── Pipeline ──

SS.pipeline = (steps) =>
  `<div class="pipeline">${steps.join('')}</div>`;

SS.pipelineStep = (icon, label, ownerClass, ownerLabel, sub, path) =>
  `<div class="pipeline-step">
    <span class="step-icon">${SS._editable(icon, path, 'icon')}</span>
    <span class="step-label">${SS._editable(label, path, 'label')}</span>
    <span class="step-owner ${ownerClass}">${SS._editable(ownerLabel, path, 'ownerLabel')}</span>
    <span class="step-sub">${SS._editable(sub, path, 'sub')}</span>
  </div>`;

// ── Takeaways ──

SS.takeawayList = (items) =>
  `<div class="takeaway-list">${items.join('')}</div>`;

SS.takeawayItem = (num, title, body, path) =>
  `<div class="takeaway-item">
    <span class="takeaway-num">${SS._editable(num, path, 'num')}</span>
    <div><h3>${SS._editable(title, path, 'title')}</h3><p>${SS._editable(body, path, 'body')}</p></div>
  </div>`;

// ── Event Sourcing flow ──

SS.esFlow = (events, path) => {
  if (path) {
    return `<div class="es-flow">${events.map((e, i) =>
      (i > 0 ? '<span class="es-arrow">→</span>' : '') +
      `<span class="es-event ss-editable" data-ss-path="${path}" data-ss-prop="events[${i}]">${e}</span>`
    ).join('')}</div>`;
  }
  return `<div class="es-flow">${events.map((e, i) =>
    (i > 0 ? '<span class="es-arrow">→</span>' : '') +
    `<span class="es-event">${e}</span>`
  ).join('')}</div>`;
};

// ── Tree / code block ──

SS.tree = (content) =>
  `<div class="tree">${content}</div>`;

// ── Team badge ──

SS.teamBadge = (text, path) => {
  const inner = SS._editable(text, path, 'text');
  return `<div class="team-badge"><div class="dot"></div><span>${inner}</span></div>`;
};

// ── VS label ──

SS.vsLabel = (text, path, color) => {
  const editAttr = path ? ` data-ss-path="${path}" data-ss-prop="text"` : '';
  const editCls = path ? ' ss-editable' : '';
  const colorCls = color ? ` c-${color}` : '';
  return `<p class="vs-label${colorCls}${editCls}"${editAttr}>${text}</p>`;
};

// ── Arch diagram (SVG wrapper) ──

SS.archDiagram = (svgContent) =>
  `<div class="arch-diagram">${svgContent}</div>`;

// ── Heading ──

SS.heading = (node, path) => {
  const tag = `h${node.level || 2}`;
  const classes = [];
  if (node.color) classes.push('c-' + node.color);
  if (node.size) classes.push('sz-' + node.size);
  if (node.mt) classes.push('mt-' + node.mt);
  if (node.mb) classes.push('mb-' + node.mb);
  const cls = classes.length ? ` class="${classes.join(' ')}"` : '';

  let content;
  if (node.sub) {
    // Wrap text and sub separately for independent editing
    content = SS._editable(node.text || '', path, 'text');
    content += ` <span class="heading-sub${node.subColor ? ' c-' + node.subColor : ''}">${SS._editable(node.sub, path, 'sub')}</span>`;
  } else if (path) {
    // No sub — make the whole heading editable
    content = node.text || '';
    // Add editable attrs to the heading tag itself
    const editCls = classes.length ? classes.join(' ') + ' ss-editable' : 'ss-editable';
    return `<${tag} class="${editCls}" data-ss-path="${path}" data-ss-prop="text">${content}</${tag}>`;
  } else {
    content = node.text || '';
  }

  return `<${tag}${cls}>${content}</${tag}>`;
};

// ── Text ──

SS.text = (node, path) => {
  const classes = [];
  if (node.color) classes.push('c-' + node.color);
  if (node.align) classes.push('ta-' + node.align);
  if (node.size) classes.push('sz-' + node.size);
  if (node.font === 'mono') classes.push('font-mono');
  if (node.weight) classes.push('fw-' + node.weight);
  if (node.mt) classes.push('mt-' + node.mt);
  if (node.mb) classes.push('mb-' + node.mb);
  if (node.leading) classes.push('leading-' + node.leading);
  if (path) classes.push('ss-editable');
  const cls = classes.length ? ` class="${classes.join(' ')}"` : '';
  const editAttr = path ? ` data-ss-path="${path}" data-ss-prop="text"` : '';
  return `<p${cls}${editAttr}>${node.text || ''}</p>`;
};

// ── Stat ──

SS.stat = (node, path) => {
  const colorCls = node.color ? ' stat-' + node.color : '';
  let html = `<div class="stat-block${colorCls}">`;
  html += `<p class="stat-value${path ? ' ss-editable' : ''}"${path ? ` data-ss-path="${path}" data-ss-prop="value"` : ''}>${node.value}</p>`;
  if (node.label) html += `<p class="stat-label${path ? ' ss-editable' : ''}"${path ? ` data-ss-path="${path}" data-ss-prop="label"` : ''}>${node.label}</p>`;
  if (node.sublabel) html += `<p class="stat-sublabel${path ? ' ss-editable' : ''}"${path ? ` data-ss-path="${path}" data-ss-prop="sublabel"` : ''}>${node.sublabel}</p>`;
  html += '</div>';
  return html;
};

// ── Spacer ──

SS.spacer = (size) =>
  `<div class="spacer spacer-${size || 'md'}"></div>`;

// ── Node renderer (walks JSON trees → HTML) ──
// path: JSON path string for this node (e.g. "sections[0].slides[1].content[2]")

SS.renderNode = (node, path) => {
  if (!node) return '';

  // Check custom registry first
  if (SS._customComponents[node.type]) {
    return SS._customComponents[node.type](node, path);
  }

  const children = (node.children || []).map((child, i) =>
    SS.renderNode(child, path ? `${path}.children[${i}]` : null)
  );

  switch (node.type) {
    case 'slideHeader':
      return SS.slideHeader(
        SS.tag(node.tag.text, node.tag.color, path ? `${path}.tag` : null),
        node.title, node.subtitle, path
      );
    case 'card':
      return SS.card(children.join(''), node);
    case 'columns':
      return SS.columns(children, node);
    case 'threeCol':
      return SS.threeCol(children, node);
    case 'fourCol':
      return SS.fourCol(children, node);
    case 'insight':
      return SS.insight(node.text, node.color, path);
    case 'icon':
      return SS.icon(node.emoji);
    case 'list':
      return SS.list(node.items, path);
    case 'skillChips':
      return SS.skillChips(node.chips, path);
    case 'pipeline':
      return SS.pipeline(children);
    case 'pipelineStep':
      return SS.pipelineStep(node.icon, node.label, node.ownerClass, node.ownerLabel, node.sub, path);
    case 'takeawayList':
      return SS.takeawayList(children);
    case 'takeawayItem':
      return SS.takeawayItem(node.num, node.title, node.body, path);
    case 'esFlow':
      return SS.esFlow(node.events, path);
    case 'tree':
      return SS.tree(node.content);
    case 'teamBadge':
      return SS.teamBadge(node.text, path);
    case 'vsLabel':
      return SS.vsLabel(node.text, path, node.color);
    case 'archDiagram':
      return SS.archDiagram(node.content);
    case 'group': {
      const cls = SS._classes('group', node);
      return `<div class="${cls}">${children.join('')}</div>`;
    }

    // Semantic components
    case 'heading':
      return SS.heading(node, path);
    case 'text':
      return SS.text(node, path);
    case 'stat':
      return SS.stat(node, path);
    case 'spacer':
      return SS.spacer(node.size);
    case 'include':
      return node._resolved || `<!-- include not loaded: ${node.src} -->`;

    // Escape hatch — should be rare
    case 'html':
      return node.content;

    default:
      console.warn('Unknown node type:', node.type);
      return `<div class="ss-render-error">Unknown node type: <strong>${node.type || '(empty)'}</strong></div>`;
  }
};

// ── Error display ──

SS.showError = (title, message, detail, source) => {
  const app = document.getElementById('app');
  const overlay = document.createElement('div');
  overlay.className = 'ss-error-overlay';
  overlay.innerHTML = `
    <div class="ss-error-box">
      <span class="ss-error-icon">⚠</span>
      <h2>${title}</h2>
      <p class="ss-error-message">${message}</p>
      ${detail ? `<pre class="ss-error-detail">${detail}</pre>` : ''}
      ${source ? `<p class="ss-error-source">${source}</p>` : ''}
    </div>`;
  (app || document.body).appendChild(overlay);
};

// ── Presentation registry ──

window._superSlidesRegistry = [];

SS.registerPresentation = (presentation) => {
  window._superSlidesRegistry.push(presentation);
};

// ── Resolve include nodes (async, called during load) ──

SS._resolveIncludes = async (data, baseDir) => {
  const promises = [];

  function walk(nodes) {
    if (!nodes) return;
    for (let i = 0; i < nodes.length; i++) {
      const node = nodes[i];
      if (node.type === 'include' && node.src) {
        const idx = i;
        const arr = nodes;
        promises.push(
          lucidos.data.read(`${baseDir}/${node.src}`)
            .then(html => { arr[idx]._resolved = html; })
            .catch(() => { arr[idx]._resolved = `<!-- include not found: ${node.src} -->`; })
        );
      }
      if (node.children) walk(node.children);
    }
  }

  if (data.sections) {
    data.sections.forEach(sec => sec.slides.forEach(s => walk(s.content)));
  } else if (data.slides) {
    data.slides.forEach(s => walk(s.content));
  }

  await Promise.all(promises);
};

// ── Load custom components & styles for a presentation ──

SS._loadCustomAssets = async (presId, baseDir) => {
  // Clean up previous custom assets
  document.querySelectorAll('style[data-ss-custom]').forEach(el => el.remove());
  SS._customComponents = {};

  const presDir = `${baseDir}/${presId}`;

  // Load custom styles
  try {
    const css = await lucidos.data.read(`${presDir}/styles.css`);
    const el = document.createElement('style');
    el.dataset.ssCustom = presId;
    el.textContent = css;
    document.head.appendChild(el);
  } catch (e) { /* no custom styles */ }

  // Load custom components
  try {
    const js = await lucidos.data.read(`${presDir}/components.js`);
    new Function(js)();
  } catch (e) { /* no custom components */ }
};

// ── Load a JSON presentation file ──

SS.loadPresentation = async (path) => {
  let raw;
  try {
    raw = await lucidos.data.read(path);
  } catch (err) {
    SS.showError(
      'Failed to Load',
      `Could not read presentation file.`,
      err.message,
      path
    );
    throw err;
  }

  let data;
  try {
    data = JSON.parse(raw);
  } catch (err) {
    const match = err.message.match(/position (\d+)/);
    let detail = err.message;
    if (match) {
      const pos = parseInt(match[1]);
      const snippet = raw.substring(Math.max(0, pos - 60), pos + 60);
      const arrow = ' '.repeat(Math.min(60, pos)) + '^^^';
      detail = err.message + '\n\n' + snippet + '\n' + arrow;
    }
    SS.showError(
      'Invalid JSON',
      'The presentation file contains malformed JSON.',
      detail,
      path
    );
    throw err;
  }

  // Resolve base directory for includes and custom assets
  const baseDir = path.substring(0, path.lastIndexOf('/'));

  // Artifact path for editing — already in SDK format
  const sourceFile = path;

  // Resolve include nodes
  await SS._resolveIncludes(data, `${baseDir}/${data.id}`);

  // Load custom components & styles
  await SS._loadCustomAssets(data.id, baseDir);

  // Build flat slide list with JSON path threading
  let flatSlides = [];
  let sections = null;

  if (data.sections && data.sections.length) {
    sections = [];
    data.sections.forEach((sec, secIdx) => {
      const startIndex = flatSlides.length;
      const rendered = sec.slides.map((s, slideIdx) => ({
        html: s.content ? s.content.map((n, i) =>
          SS.renderNode(n, `sections[${secIdx}].slides[${slideIdx}].content[${i}]`)
        ).join('') : '',
        hero: s.hero || false,
        title: s.title || undefined,
        notes: s.notes || '',
        cardNotes: Array.isArray(s.cardNotes) ? s.cardNotes.slice() : undefined,
        path: `sections[${secIdx}].slides[${slideIdx}]`,
      }));
      flatSlides.push(...rendered);
      sections.push({
        title: sec.title,
        color: sec.color || 'accent',
        startIndex,
        endIndex: flatSlides.length - 1,
        count: rendered.length,
      });
    });
  } else if (data.slides) {
    flatSlides = data.slides.map((s, slideIdx) => ({
      html: s.content ? s.content.map((n, i) =>
        SS.renderNode(n, `slides[${slideIdx}].content[${i}]`)
      ).join('') : '',
      hero: s.hero || false,
      title: s.title || undefined,
      notes: s.notes || '',
      cardNotes: Array.isArray(s.cardNotes) ? s.cardNotes.slice() : undefined,
      path: `slides[${slideIdx}]`,
    }));
  }

  const pres = {
    id: data.id,
    title: data.title,
    subtitle: data.subtitle,
    titleScroller: data.titleScroller,
    slides: flatSlides,
    sections: sections,
    sourceFile: sourceFile,
    rawData: data,
    sourceUrl: path,
  };

  SS.registerPresentation(pres);
  return pres;
};
</script>
<script>
/* ═══════════ editing.js (inlined) ═══════════ */
/* ══════════════════════════════════════════════════════
   Super Slides — Inline Editing
   ══════════════════════════════════════════════════════
   Click any text to edit it. Changes are saved back
   to the .slides JSON file directly via the Lucidos SDK.
   Disabled in fullscreen mode.

   Composite elements (containing spans, br, etc.) are
   NOT editable as a whole. Instead, each text-bearing
   child becomes its own editable node. On save, the
   entire composite's innerHTML is reconstructed and
   persisted.
   ══════════════════════════════════════════════════════ */

SS.initEditing = function () {
  let activeEditor = null;
  let isFullscreen = false;

  // Detect fullscreen (native + pseudo) on the frame's OWN document.
  //
  // This used to reach into `window.parent.document`. The app runs in an
  // isolated iframe at an opaque origin, so reading the host realm throws —
  // and the throw killed the rest of this module, taking inline editing with
  // it. Everything below now works against the local document.
  //
  // MIGRATION REVIEW: two of the old checks genuinely needed the HOST
  // document and have no local equivalent, so fullscreen driven by the host
  // shell is no longer detected and editing stays enabled during it:
  //   1. `parentDoc.documentElement[data-pseudo-fullscreen]` — the host sets
  //      that attribute on its own <html> (the iOS / no-Fullscreen-API path).
  //      It is never present on the frame's <html>.
  //   2. `parentDoc.fullscreenElement` — when the host calls
  //      requestFullscreen() on the iframe ELEMENT, the frame's own
  //      document.fullscreenElement stays null and no fullscreenchange fires
  //      here.
  // Needs a host→frame fullscreen signal (an SDK affordance or a postMessage
  // the shell already sends) rather than a workaround invented in the app.
  // The local checks below still cover the case the app can see: the app
  // putting its OWN content into native fullscreen.
  function checkFullscreen() {
    isFullscreen = !!(
      document.fullscreenElement ||
      document.webkitFullscreenElement ||
      document.documentElement.hasAttribute('data-pseudo-fullscreen')
    );
    document.body.classList.toggle('ss-editing-disabled', isFullscreen);
  }

  document.addEventListener('fullscreenchange', checkFullscreen);
  document.addEventListener('webkitfullscreenchange', checkFullscreen);
  // Kept pointed at the local <html>: nothing sets the attribute there today
  // (see the MIGRATION REVIEW note above), but this picks it up for free the
  // day a pseudo-fullscreen signal reaches the frame.
  new MutationObserver(checkFullscreen).observe(document.documentElement, {
    attributes: true, attributeFilter: ['data-pseudo-fullscreen']
  });
  checkFullscreen();

  // ── Activation: long-press (touch) / single click (desktop) ──

  let longPressTimer = null;
  let longPressTarget = null;
  let longPressReady = null; // Set to element when long-press detected, activated on touchend
  let longPressTouchX = 0, longPressTouchY = 0;
  let lastTouchTime = 0; // Suppress synthetic click after touch interactions
  const LONG_PRESS_MOVE_THRESHOLD = 15; // px — ignore micro-jitter during hold

  document.addEventListener('touchstart', (e) => {
    if (isFullscreen) return;
    const el = e.target.closest('.ss-editable');
    if (!el || el === activeEditor) return;
    longPressTarget = el;
    longPressReady = null;
    longPressTouchX = e.touches[0].clientX;
    longPressTouchY = e.touches[0].clientY;
    longPressTimer = setTimeout(() => {
      if (longPressTarget === el) {
        // Mark as ready — actual activation happens on touchend
        // so iOS treats focus() as a user gesture and opens the keyboard
        longPressReady = el;
        longPressTarget = null;
      }
    }, 500);
  }, { passive: true, capture: true });

  document.addEventListener('touchmove', (e) => {
    if (!longPressTarget && !longPressReady) return;
    const dx = e.touches[0].clientX - longPressTouchX;
    const dy = e.touches[0].clientY - longPressTouchY;
    if (Math.abs(dx) > LONG_PRESS_MOVE_THRESHOLD || Math.abs(dy) > LONG_PRESS_MOVE_THRESHOLD) {
      clearTimeout(longPressTimer);
      longPressTarget = null;
      longPressReady = null;
    }
  }, { passive: true });

  document.addEventListener('touchend', (e) => {
    clearTimeout(longPressTimer);
    lastTouchTime = Date.now();
    if (longPressReady) {
      // Activate now — touchend is a user gesture, so iOS will open the keyboard
      e.preventDefault();
      e.stopPropagation();
      const el = longPressReady;
      longPressReady = null;
      longPressTarget = null;
      activateEditor(el);
      return;
    }
    // If actively editing, suppress touchend from reaching nav
    if (e.target.closest('.ss-editing')) {
      e.stopPropagation();
    }
    longPressTarget = null;
  }, { capture: true });

  // Desktop: single click to edit (suppressed on touch devices — use long-press)
  document.addEventListener('click', (e) => {
    if (isFullscreen) return;
    // Ignore synthetic clicks fired after touch events (within 500ms)
    if (Date.now() - lastTouchTime < 500) return;
    const el = e.target.closest('.ss-editable');
    if (!el || el === activeEditor) return;
    e.stopPropagation();
    e.preventDefault();
    activateEditor(el);
  }, true);

  // Check if element contains complex HTML that shouldn't be edited as a single block.
  // Only simple formatting (strong, em, code) is allowed for whole-element editing.
  function hasComplexHtml(el) {
    const children = el.querySelectorAll('*');
    for (const child of children) {
      const tag = child.tagName.toLowerCase();
      if (tag !== 'strong' && tag !== 'em' && tag !== 'code') return true;
    }
    return false;
  }

  // Walk up through (possibly nested) composite parents to find the root
  // composite — the one that actually has data-ss-path and data-ss-prop.
  function findRootComposite(el) {
    let parent = el.closest('[data-ss-composite]');
    while (parent) {
      if (parent.dataset.ssPath && parent.dataset.ssProp) return parent;
      parent = parent.parentElement?.closest('[data-ss-composite]');
    }
    return null;
  }

  function activateEditor(el) {
    // Close any existing editor first
    if (activeEditor) commitEdit(activeEditor);

    let path = el.dataset.ssPath;   // may be "" for root-level fields (e.g. subtitle)
    let prop = el.dataset.ssProp;

    // Check if this is a fragment inside a composite element
    const compositeParent = findRootComposite(el);

    // An element is directly editable if it carries its own prop. The path may
    // be an empty string for root-level fields (e.g. subtitle), so test the
    // attribute's PRESENCE — not truthiness — to avoid misrouting an empty path
    // into the composite-fragment branch (which bails when no composite exists).
    const hasOwnTarget = prop !== undefined && path !== undefined;

    if (!hasOwnTarget) {
      // No target on this element — must be a fragment child of a composite
      if (compositeParent) {
        path = compositeParent.dataset.ssPath;
        prop = compositeParent.dataset.ssProp;
      } else {
        return; // No target and no composite parent — can't edit
      }
    } else if (hasComplexHtml(el)) {
      // Element has its own path but contains complex HTML —
      // it should have been set up as a composite. Don't edit as a whole.
      return;
    }

    // Store resolved path/prop and original content
    el.dataset.ssResPath = path;
    el.dataset.ssResProp = prop;
    el.dataset.ssOriginal = el.innerHTML;
    el.dataset.ssOriginalText = el.innerText;

    if (compositeParent) {
      el.dataset.ssIsFragment = 'true';
    }

    // Make contenteditable
    el.contentEditable = 'true';
    el.classList.add('ss-editing');
    el.focus();
    activeEditor = el;

    // Select all text
    const range = document.createRange();
    range.selectNodeContents(el);
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);

    // Handle keyboard
    el.addEventListener('keydown', onEditorKey);
    el.addEventListener('blur', onEditorBlur);
  }

  function onEditorKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      e.target.blur(); // triggers commit via blur
    } else if (e.key === 'Escape') {
      e.preventDefault();
      cancelEdit(e.target);
    }
    // Stop arrow keys from navigating slides while editing
    if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', ' '].includes(e.key)) {
      e.stopPropagation();
    }
  }

  function onEditorBlur(e) {
    const el = e.target;
    // Small delay to let click-on-another-editable work
    setTimeout(() => {
      if (el === activeEditor) {
        commitEdit(el);
      }
    }, 100);
  }

  function cancelEdit(el) {
    if (el.dataset.ssOriginal !== undefined) {
      el.innerHTML = el.dataset.ssOriginal;
    }
    cleanupEditor(el);
  }

  function cleanupEditor(el) {
    el.contentEditable = 'false';
    el.classList.remove('ss-editing');
    el.removeEventListener('keydown', onEditorKey);
    el.removeEventListener('blur', onEditorBlur);
    delete el.dataset.ssOriginal;
    delete el.dataset.ssOriginalText;
    delete el.dataset.ssResPath;
    delete el.dataset.ssResProp;
    delete el.dataset.ssIsFragment;
    if (activeEditor === el) activeEditor = null;
  }

  function commitEdit(el) {
    const path = el.dataset.ssResPath;
    const prop = el.dataset.ssResProp;
    const originalText = el.dataset.ssOriginalText;
    const newText = el.innerText;
    const isFragment = el.dataset.ssIsFragment === 'true';
    const compositeParent = isFragment ? findRootComposite(el) : null;

    cleanupEditor(el);

    // No change — skip
    if (newText === originalText) return;

    // If a fragment was emptied, remove its surrounding element entirely
    if (isFragment && newText.trim() === '') {
      el.remove();
      // Also clean up any orphaned <br> tags that were adjacent separators
      if (compositeParent) {
        // Remove leading/trailing <br>s and consecutive <br>s
        const kids = Array.from(compositeParent.childNodes);
        for (let i = kids.length - 1; i >= 0; i--) {
          const k = kids[i];
          if (k.nodeName === 'BR') {
            const prev = kids[i - 1];
            const next = kids[i + 1];
            // Remove if first, last, or next to another BR
            if (!prev || !next || prev.nodeName === 'BR' || next.nodeName === 'BR') {
              k.remove();
            }
          }
        }
      }
    }

    // Build the full JSON path. Root-level fields (e.g. subtitle) carry an
    // empty path, so the prop alone is the full path.
    const fullPath = path ? `${path}.${prop}` : prop;

    // Determine the value to save
    let newValue;
    if (compositeParent) {
      // Fragment edit: save the entire composite parent's innerHTML,
      // but strip any editing artifacts we added (classes, attributes)
      const clone = compositeParent.cloneNode(true);
      clone.querySelectorAll('.ss-editable, .ss-editing, .ss-saved').forEach(c => {
        c.classList.remove('ss-editable', 'ss-editing', 'ss-saved');
        c.removeAttribute('contenteditable');
      });
      // Clean up empty class attributes left behind
      clone.querySelectorAll('[class=""]').forEach(c => c.removeAttribute('class'));
      newValue = clone.innerHTML;
    } else {
      // Simple element: save the plain text
      newValue = newText;
    }

    // Flash save indicator
    el.classList.add('ss-saved');
    setTimeout(() => el.classList.remove('ss-saved'), 800);

    // Get current presentation info
    const pres = SS._currentPres;
    if (!pres || !pres.sourceFile) {
      console.warn('No source file for current presentation');
      if (window.lucidos && lucidos.ui && lucidos.ui.toast) {
        lucidos.ui.toast('Couldn’t save — no source file for this deck', 'error', { key: 'ss-edit-save' });
      }
      return;
    }

    // Save via Lucidos events API
    saveEdit(pres.sourceFile, fullPath, newValue);
  }

  // Toast helper — guarded so editing still works if the SDK toast is absent.
  // A stable key collapses rapid successive edits into one in-place toast
  // instead of a stack of "Saved" banners.
  const SAVE_TOAST_KEY = 'ss-edit-save';
  function editToast(msg, type, opts) {
    if (window.lucidos && lucidos.ui && lucidos.ui.toast) {
      lucidos.ui.toast(msg, type || 'info', opts);
    }
  }

  async function saveEdit(sourceFile, jsonPath, newValue) {
    try {
      await lucidos.data.edit(sourceFile, [
        { json_path: jsonPath, json_value: newValue }
      ]);
      console.log(`[SS Edit] Saved: ${jsonPath} = "${String(newValue).substring(0, 50)}..."`);
      editToast('Saved', 'success', { key: SAVE_TOAST_KEY, durationMs: 1500 });
    } catch (err) {
      console.error('[SS Edit] Failed to save:', err);
      const detail = (err && (err.message || err)) || 'unknown error';
      editToast(`Couldn’t save edit: ${detail}`, 'error', { key: SAVE_TOAST_KEY });
    }
  }

  // ── Composite element setup ──
  // After each render, find elements with complex HTML (spans, br, etc.)
  // and set them up as composites: the parent becomes non-editable, and
  // each text-bearing child becomes its own editable node.

  function setupCompositeEditables() {
    document.querySelectorAll('.ss-editable').forEach(el => {
      if (hasComplexHtml(el)) {
        // Remove editable from the parent — it shouldn't be edited as a whole
        el.classList.remove('ss-editable');
        // Mark as composite so children can find their path/prop
        el.setAttribute('data-ss-composite', '');
        // Make each text-bearing child individually editable
        makeChildrenEditable(el);
      }
    });
    // Also process any new composites that haven't had children wired up yet
    // (e.g. after a presentation switch that re-rendered the DOM)
    document.querySelectorAll('[data-ss-composite]').forEach(el => {
      if (!el.querySelector('.ss-editable')) {
        makeChildrenEditable(el);
      }
    });
  }

  function makeChildrenEditable(composite) {
    // First pass: wrap bare text nodes in <span> so they become elements
    const childNodes = Array.from(composite.childNodes);
    for (const node of childNodes) {
      if (node.nodeType === Node.TEXT_NODE && node.textContent.trim().length > 0) {
        const wrapper = document.createElement('span');
        wrapper.textContent = node.textContent;
        node.replaceWith(wrapper);
      }
    }
    // Second pass: make all element children (except <br>) editable
    for (const child of composite.children) {
      const tag = child.tagName.toLowerCase();
      if (tag === 'br') continue;
      if (child.textContent.trim().length > 0) {
        child.classList.add('ss-editable');
      }
    }
  }

  // Run on structural DOM changes (presentation load/switch) and initial load.
  // Only watches childList — attribute changes (class toggles, styles) are ignored.
  let compositeTimer = null;
  new MutationObserver((mutations) => {
    // Only process if actual nodes were added (not just class/attr changes)
    const hasNewNodes = mutations.some(m => m.addedNodes.length > 0);
    if (!hasNewNodes) return;
    if (compositeTimer) clearTimeout(compositeTimer);
    compositeTimer = setTimeout(() => {
      compositeTimer = null;
      setupCompositeEditables();
    }, 150);
  }).observe(document.getElementById('app') || document.body, {
    childList: true, subtree: true
  });
  setupCompositeEditables();

  // ── Public API ──

  SS.isEditing = () => activeEditor !== null;
  SS.cancelEditing = () => { if (activeEditor) cancelEdit(activeEditor); };
};
</script>
<script>
/* ═══════════ drive.js (inlined) ═══════════ */
/* ══════════════════════════════════════════════════════
   Super Slides — Google Drive integration
   ══════════════════════════════════════════════════════
   Save / Open / Share .slides decks via Google Drive.

   Auth: every call goes through the `google-drive` entry in
   data/config/apis.json via lucidos.proxy('google-drive').fetch(). The engine
   forwards server-side and attaches the connected Google account's
   access token, so no credential is ever read, held or sent from this
   iframe — and mixed-content / CORS never enter into it. The app rides
   whatever Google account this workspace has connected (via the OAuth
   account settings / connect_oauth_account).

   Scope note: a workspace connected with only `drive.file` can
   save, re-open, and share files THIS app created — which covers
   "save my decks, send a colleague a link". Two-way collaboration
   where you also OPEN a colleague's deck needs either broader Drive
   scope or a shared folder both sides save into (see the plugin's
   setup instructions). Open-from-Drive lists this app's own files;
   "Open by link" lets you pull any deck you have access to by ID/URL.
   ══════════════════════════════════════════════════════ */

SS.drive = (function () {
  // Paths, not absolute URLs: every call below goes through the `google-drive`
  // engine proxy, which owns the base URL and injects the access token
  // server-side. The credential never enters this iframe.
  const DRIVE = '/drive/v3';
  const UPLOAD = '/upload/drive/v3';
  const MAP_KEY = 'driveFileMap'; // { [presId]: driveFileId }

  // Workspace state document (SS.appState, defined in components.js). The app
  // frame has no localStorage, so the deck→file map and the last-used folder
  // live there. The test page loads drive.js WITHOUT components.js, so tolerate
  // the store being absent.
  function store() { return SS.appState || null; }

  /* ── local id ↔ Drive file id map ── */
  function loadMap() {
    const s = store();
    const m = s && s.get(MAP_KEY, null);
    return (m && typeof m === 'object') ? m : {};
  }
  function rememberFile(presId, fileId) {
    const s = store();
    if (!s) return;
    const m = Object.assign({}, loadMap());
    m[presId] = fileId;
    s.set(MAP_KEY, m);
  }
  function knownFileId(presId) { return loadMap()[presId] || null; }

  /* ── transport ──
     Every Drive call goes through the `google-drive` proxy entry in
     data/config/apis.json. The engine forwards server-side and attaches the
     connected Google account's access token, so no token is read, held or
     sent from here. `path` is Drive-relative, e.g. `${DRIVE}/files/<id>`. */
  async function driveFetch(path, init) {
    if (!window.lucidos || !lucidos.proxy) {
      throw new Error('Lucidos SDK not available');
    }
    let res;
    try {
      res = await lucidos.proxy('google-drive').fetch(path, init);
    } catch (err) {
      throw new Error('Could not reach Google Drive: ' + (err && (err.message || err)));
    }
    if (res.status === 404) {
      // Two different 404s arrive here and they need different advice.
      // Drive's own 404 ("no such file") carries a JSON error body. The
      // engine's 404 ("proxy 'google-drive' is not configured") is plain
      // text, and means the workspace never got the apis.json entry.
      const peek = res.clone();
      let body = '';
      try { body = await peek.text(); } catch (e) { /* ignore */ }
      if (!body || body.indexOf('"error"') === -1) {
        throw new Error(
          'Google Drive is not set up in this workspace. It needs a ' +
