          "`google-drive` entry in data/config/apis.json and a connected " +
          'Google account. Ask Lucidos to "set up Super Slides Drive access" ' +
          'and it will wire both.'
        );
      }
    }
    if (res.status === 502) {
      // The proxy entry exists but its auth layer could not mint a header,
      // which is what an absent or unauthorized Google account looks like.
      throw new Error(
        'No Google account is connected to this workspace. ' +
        'Connect one in Settings → Accounts (or ask Lucidos to "connect my ' +
        'Google account"), then try again.'
      );
    }
    if (!res.ok) {
      let detail = '';
      try { const j = await res.json(); detail = j.error && j.error.message ? j.error.message : ''; }
      catch (e) { /* non-JSON body */ }
      const e = new Error(`Drive API ${res.status}${detail ? ': ' + detail : ''}`);
      e.status = res.status;
      throw e;
    }
    return res;
  }

  /* ── core operations ── */

  // Resolve the exact bytes to upload for `pres`. The SOURCE OF TRUTH is the
  // on-disk .slides file: inline text edits (editing.js) and notes/card-note
  // edits (remote-mode.js) patch the file via lucidos.data.edit() but do NOT
  // mutate pres.rawData. Uploading rawData would therefore ship the snapshot
  // captured at load time, missing every edit made since — the "Drive has my
  // pre-edit content even though it said it saved" bug. So we re-read the file,
  // keep pres.rawData in sync (it's the only in-memory consumer), and return
  // both the parsed object and its pretty-printed JSON. Falls back to the
  // in-memory rawData snapshot when there's no sourceFile or the disk
  // read/parse fails, so saving never hard-breaks.
  async function resolveSaveContent(pres) {
    if (!pres) throw new Error('No presentation data to save');
    let data = pres.rawData;
    if (pres.sourceFile && window.lucidos && lucidos.data && lucidos.data.read) {
      try {
        data = JSON.parse(await lucidos.data.read(pres.sourceFile));
        pres.rawData = data; // keep the in-memory snapshot consistent
      } catch (e) {
        data = pres.rawData; // disk read/parse failed — fall back to memory
      }
    }
    if (!data) throw new Error('No presentation data to save');
    return { data, content: JSON.stringify(data, null, 2) };
  }

  // Upload (create or update) a deck's .slides JSON. `pres` is a registry entry;
  // the content uploaded is the CURRENT on-disk file (see resolveSaveContent),
  // not the load-time rawData snapshot.
  //   opts.fileId    — explicit target file. If the key is PRESENT (even null),
  //                    it overrides the remembered map: pass `null` to force a
  //                    fresh CREATE (this is how "Save a copy" makes a new file).
  //   opts.folderId  — parent folder for a CREATE (ignored when updating in place).
  // After a successful save the deck→file map is updated so subsequent saves
  // land on the same file.
  async function save(pres, opts) {
    opts = opts || {};
    const { data, content } = await resolveSaveContent(pres);
    const presId = pres.id || data.id || 'untitled';
    const targetId = ('fileId' in opts) ? opts.fileId : knownFileId(presId);

    const metadata = {
      name: `${presId}.slides`,
      mimeType: 'application/json',
      appProperties: { superSlides: '1', presId: presId },
    };
    if (!targetId && opts.folderId) metadata.parents = [opts.folderId];

    const boundary = 'ssdrive' + Math.random().toString(36).slice(2);
    const metaPart = targetId ? { appProperties: metadata.appProperties } : metadata;
    const body =
      `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n` +
      JSON.stringify(metaPart) +
      `\r\n--${boundary}\r\nContent-Type: application/json\r\n\r\n` +
      content +
      `\r\n--${boundary}--`;

    const base = targetId ? `${UPLOAD}/files/${targetId}` : `${UPLOAD}/files`;
    const url = `${base}?uploadType=multipart&supportsAllDrives=true&fields=id,name,webViewLink,parents`;

    const res = await driveFetch(url, {
      method: targetId ? 'PATCH' : 'POST',
      headers: { 'Content-Type': `multipart/related; boundary=${boundary}` },
      body,
    });
    const file = await res.json();
    rememberFile(presId, file.id);
    return file; // { id, name, webViewLink, parents }
  }

  // The folder ids a file currently lives in.
  async function getParents(fileId) {
    const res = await driveFetch(`${DRIVE}/files/${fileId}?fields=parents&supportsAllDrives=true`);
    const j = await res.json();
    return j.parents || [];
  }

  // Relocate a file to a new folder (Drive add/remove parents).
  async function moveFile(fileId, newParentId) {
    const prev = (await getParents(fileId)).join(',');
    const url = `${DRIVE}/files/${fileId}?addParents=${encodeURIComponent(newParentId)}` +
      (prev ? `&removeParents=${encodeURIComponent(prev)}` : '') +
      `&supportsAllDrives=true&fields=id,parents`;
    await driveFetch(url, { method: 'PATCH' });
  }

  // Create a subfolder inside parentId (a real folder id, a shared-drive id, or
  // 'root' for My Drive). Returns the new folder { id, name, driveId, parents }.
  async function createFolder(parentId, name) {
    const metadata = {
      name: name,
      mimeType: 'application/vnd.google-apps.folder',
      parents: [parentId],
    };
    const url = `${DRIVE}/files?supportsAllDrives=true&fields=id,name,driveId,parents`;
    const res = await driveFetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(metadata),
    });
    return res.json();
  }

  // List .slides decks this app created in Drive.
  async function list() {
    const q = encodeURIComponent(
      "appProperties has { key='superSlides' and value='1' } and trashed = false"
    );
    const fields = encodeURIComponent('files(id,name,modifiedTime,webViewLink,appProperties)');
    const res = await driveFetch(
      `${DRIVE}/files?q=${q}&fields=${fields}&orderBy=modifiedTime desc&pageSize=100`
    );
    const j = await res.json();
    return j.files || [];
  }

  // Find the Drive file id for a deck by its durable presId tag (appProperties.presId),
  // which save() writes on every upload. This survives the case where the deck→file
  // map in the workspace state document was never populated — preventing duplicate
  // same-named files. Returns the most-recently-modified match, or null.
  async function findByPresId(presId) {
    // Drive query values are single-quoted; only search for query-safe ids.
    if (!presId || /['\\]/.test(presId)) return null;
    const q = encodeURIComponent(
      `appProperties has { key='presId' and value='${presId}' } and ` +
      "appProperties has { key='superSlides' and value='1' } and trashed = false"
    );
    const fields = encodeURIComponent('files(id,modifiedTime)');
    const res = await driveFetch(
      `${DRIVE}/files?q=${q}&fields=${fields}&orderBy=modifiedTime desc&pageSize=1` +
      '&supportsAllDrives=true&includeItemsFromAllDrives=true&corpora=allDrives'
    );
    const files = (await res.json()).files || [];
    return files.length ? files[0].id : null;
  }

  /* ── folder browsing (full drive scope) ── */

  // List subfolders of a parent. parentId can be a real folder id, or one of
  // the virtual roots: 'root' (My Drive) / 'sharedWithMe'. Shared-drive roots
  // are listed via listSharedDrives().
  async function listFolders(parentId) {
    let q;
    if (parentId === 'sharedWithMe') {
      q = "mimeType='application/vnd.google-apps.folder' and sharedWithMe and trashed=false";
    } else {
      q = `'${parentId}' in parents and mimeType='application/vnd.google-apps.folder' and trashed=false`;
    }
    const params = new URLSearchParams({
      q,
      fields: 'files(id,name,driveId)',
      orderBy: 'name',
      pageSize: '200',
      supportsAllDrives: 'true',
      includeItemsFromAllDrives: 'true',
      corpora: parentId === 'sharedWithMe' ? 'user' : 'allDrives',
    });
    const res = await driveFetch(`${DRIVE}/files?${params.toString()}`);
    return (await res.json()).files || [];
  }

  // List the user's shared drives (Team Drives).
  async function listSharedDrives() {
    const res = await driveFetch(`${DRIVE}/drives?pageSize=100&fields=drives(id,name)`);
    return (await res.json()).drives || [];
  }

  // List .slides decks inside a specific folder (any app — full scope).
  async function listInFolder(folderId) {
    const q = `'${folderId}' in parents and trashed=false and ` +
      "(name contains '.slides' or mimeType='application/json')";
    const params = new URLSearchParams({
      q,
      fields: 'files(id,name,modifiedTime,webViewLink,appProperties)',
      orderBy: 'modifiedTime desc',
      pageSize: '200',
      supportsAllDrives: 'true',
      includeItemsFromAllDrives: 'true',
      corpora: 'allDrives',
    });
    const res = await driveFetch(`${DRIVE}/files?${params.toString()}`);
    return (await res.json()).files || [];
  }

  /* ── folder ancestry (for an honest breadcrumb) ──
     Given a folder id, walk the Drive parents chain up to its top-level root
     (My Drive or a shared drive) and return the path as
     [{id,name}, …] outermost-first, INCLUDING the folder itself. Used to seed
     the browser's breadcrumb so a deep pinned/last folder shows its real path
     (e.g. "Jobs - P&T › 04 Area - Job Seekers › 03 User Acquisition") instead
     of looking like it sits directly under Drive. */
  let _rootId = null;
  async function myDriveRootId() {
    if (_rootId) return _rootId;
    try {
      const r = await driveFetch(`${DRIVE}/files/root?fields=id`);
      _rootId = (await r.json()).id || null;
    } catch (e) { _rootId = null; }
    return _rootId;
  }
  async function folderMeta(fileId) {
    const res = await driveFetch(
      `${DRIVE}/files/${fileId}?fields=id,name,parents,driveId&supportsAllDrives=true`
    );
    return res.json();
  }
  async function sharedDriveName(driveId) {
    try {
      const res = await driveFetch(`${DRIVE}/drives/${driveId}?fields=id,name`);
      return (await res.json()).name || 'Shared drive';
    } catch (e) { return 'Shared drive'; }
  }
  async function ancestry(folderId) {
    const rootId = await myDriveRootId();
    const chain = [];
    let cur = folderId;
    let driveId = null;
    const seen = new Set();
    for (let i = 0; i < 25 && cur && !seen.has(cur); i++) {
      seen.add(cur);
      let md;
      try { md = await folderMeta(cur); } catch (e) { break; }
      chain.unshift({ id: md.id, name: md.name });
      if (md.driveId) driveId = md.driveId;
      const parent = md.parents && md.parents[0];
      if (!parent) break;                       // top of My Drive
      if (rootId && parent === rootId) break;    // parent is My Drive root
      if (driveId && parent === driveId) break;  // parent is shared-drive root
      cur = parent;
    }
    // Prepend the container root so the breadcrumb is navigable.
    if (driveId) chain.unshift({ id: driveId, name: await sharedDriveName(driveId) });
    else chain.unshift({ id: 'root', name: 'My Drive' });
    return chain;
  }

  /* ── last-used folder memory ── */
  const LAST_FOLDER_KEY = 'driveLastFolder'; // { id, name }
  function rememberFolder(id, name, path) {
    const s = store();
    if (!s) return;
    const entry = { id, name };
    if (Array.isArray(path) && path.length) entry.path = path;
    s.set(LAST_FOLDER_KEY, entry);
  }
  function lastFolder() {
    const s = store();
    const f = s && s.get(LAST_FOLDER_KEY, null);
    return (f && typeof f === 'object') ? f : null;
  }

  /* ── pinned default folder (workspace config) ──
     Stored in artifacts/super-slides/drive-config.json so it persists across
     devices/sessions (unlike the per-browser last-used folder). When set, the
     folder browser opens here by default. */
  const PINNED_PATH = 'artifacts/super-slides/drive-config.json';
  let _pinned;        // cached value: { id, name } | null
  let _pinnedLoaded = false;

  async function loadPinned() {
    if (_pinnedLoaded) return _pinned;
    try {
      const raw = await lucidos.data.read(PINNED_PATH);
      const cfg = JSON.parse(raw);
      _pinned = (cfg && cfg.pinnedFolder && cfg.pinnedFolder.id) ? cfg.pinnedFolder : null;
    } catch (e) { _pinned = null; }
    _pinnedLoaded = true;
    return _pinned;
  }
  function pinnedFolder() { return _pinned || null; }
  async function setPinned(id, name, path) {
    if (id) {
      _pinned = { id, name: name || id };
      if (Array.isArray(path) && path.length) _pinned.path = path;
    } else {
      _pinned = null;
    }
    _pinnedLoaded = true;
    try { await lucidos.data.write(PINNED_PATH, JSON.stringify({ pinnedFolder: _pinned }, null, 2)); }
    catch (e) { /* best-effort */ }
    return _pinned;
  }

  // Download a file's JSON content by Drive file id.
  async function download(fileId) {
    const res = await driveFetch(`${DRIVE}/files/${fileId}?alt=media`);
    return res.text();
  }

  // Get a file's metadata (used to derive a name when opening by link).
  async function meta(fileId) {
    const res = await driveFetch(
      `${DRIVE}/files/${fileId}?fields=id,name,webViewLink,appProperties`
    );
    return res.json();
  }

  // Make a file shareable. mode: 'link' (anyone with link, reader) or
  // 'user' (share with a specific email as writer). Returns webViewLink.
  async function share(fileId, mode, email) {
    const permission = mode === 'user'
      ? { role: 'writer', type: 'user', emailAddress: email }
      : { role: 'reader', type: 'anyone' };
    await driveFetch(`${DRIVE}/files/${fileId}/permissions?sendNotificationEmail=${mode === 'user'}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(permission),
    });
    const m = await meta(fileId);
    return m.webViewLink;
  }

  /* ── helpers ── */

  // Pull a Drive file id out of a share URL or accept a bare id.
  function parseFileId(input) {
    if (!input) return null;
    const s = input.trim();
    let m = s.match(/\/d\/([a-zA-Z0-9_-]+)/);          // .../file/d/<id>/...
    if (m) return m[1];
    m = s.match(/[?&]id=([a-zA-Z0-9_-]+)/);            // ...?id=<id>
    if (m) return m[1];
    if (/^[a-zA-Z0-9_-]{20,}$/.test(s)) return s;      // bare id
    return null;
  }

  // Import downloaded deck JSON into the workspace, register + show it.
  async function importDeck(rawJson, fallbackName, sourceFileId) {
    let data;
    try { data = JSON.parse(rawJson); }
    catch (e) { throw new Error('That Drive file is not a valid .slides JSON document.'); }
    const id = data.id || (fallbackName || 'imported').replace(/\.slides$/, '');
    data.id = id;
    // Remember which Drive file this deck came from so a later Save updates it
    // in place (PATCH) instead of creating a same-named duplicate (POST).
    if (sourceFileId) rememberFile(id, sourceFileId);
    const path = `artifacts/presentations/${id}.slides`;
    await lucidos.data.write(path, JSON.stringify(data, null, 2));
    // If already registered, drop the stale copy so we re-load fresh.
    const reg = window._superSlidesRegistry || [];
    const existingIdx = reg.findIndex(p => p.id === id);
    if (existingIdx >= 0) reg.splice(existingIdx, 1);
    const pres = await SS.loadPresentation(path);
    if (SS._rebuildMenuAndShow) SS._rebuildMenuAndShow(pres.id);
    return pres;
  }

  function toast(msg, type, opts) {
    if (window.lucidos && lucidos.ui && lucidos.ui.toast) lucidos.ui.toast(msg, type || 'info', opts);
  }

  return {
    save, resolveSaveContent, list, download, meta, share, parseFileId, importDeck, findByPresId,
    knownFileId, toast,
    getParents, moveFile, createFolder, listFolders, listSharedDrives, listInFolder, ancestry,
    rememberFolder, lastFolder, loadPinned, pinnedFolder, setPinned,
  };
})();

/* ══════════════════════════════════════════════════════
   Drive UI — modals (matches the speaker-remote modal style)
   ══════════════════════════════════════════════════════ */

SS.driveUI = (function () {
  // Keep the modal inside the region NOT covered by the on-screen keyboard.
  // On iOS Safari a position:fixed element is sized to the LAYOUT viewport, so
  // a centered modal stays put while the keyboard overlays the bottom — hiding
  // any input near the foot of the card (e.g. the inline "new folder" field).
  // The visualViewport API reports the actually-visible area; we pin the modal
  // container to it so its contents reflow above the keyboard.
  let _vvSync = null;
  function unbindViewport() {
    const vv = window.visualViewport;
    if (_vvSync && vv) {
      vv.removeEventListener('resize', _vvSync);
      vv.removeEventListener('scroll', _vvSync);
    }
    _vvSync = null;
  }
  function bindViewport(m) {
    const vv = window.visualViewport;
    if (!vv) return;
    const sync = () => {
      m.style.top = vv.offsetTop + 'px';
      m.style.left = vv.offsetLeft + 'px';
      m.style.width = vv.width + 'px';
      m.style.height = vv.height + 'px';
      m.style.right = 'auto';
      m.style.bottom = 'auto';
    };
    _vvSync = sync;
    vv.addEventListener('resize', sync);
    vv.addEventListener('scroll', sync);
    sync();
  }

  function closeModal() {
    const ex = document.getElementById('ssDriveModal');
    if (ex) ex.remove();
    unbindViewport();
  }

  function modal(innerHtml) {
    closeModal();
    const m = document.createElement('div');
    m.id = 'ssDriveModal';
    m.innerHTML =
      `<div class="remote-modal-backdrop"></div>
       <div class="remote-modal-card ss-drive-card">${innerHtml}</div>`;
    document.body.appendChild(m);
    m.querySelector('.remote-modal-backdrop').addEventListener('click', closeModal);
    bindViewport(m);
    return m;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c =>
      ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  /* ── A blocking spinner modal shown while a Drive upload is in flight. ── */
  function busyCard(message) {
    return modal(
      `<div class="ss-drive-busy">
         <div class="ss-loading-spinner"></div>
         <div class="ss-drive-busy-msg">${escapeHtml(message)}</div>
       </div>`
    );
  }

  /* ══════════════════════════════════════════════════
     Folder browser — navigate My Drive / Shared with me /
     shared drives. Used by both Save (pick a destination
     folder) and Open (pick a .slides file in a folder).
     ══════════════════════════════════════════════════ */

  const ROOTS = [
    { id: 'root',         name: 'My Drive',       icon: '📁' },
    { id: 'sharedWithMe', name: 'Shared with me', icon: '👥' },
    { id: '__drives__',   name: 'Shared drives',  icon: '🗂' },
  ];

  // stack entries: { id, name }. The first entry is a virtual root.
  function folderBrowser(mode) {
    // Open at the pinned default folder when set; else the last-used folder;
    // else the roots list. Seed with a single-entry stack for an immediate
    // render, then asynchronously expand to the folder's true ancestry so the
    // breadcrumb shows the real path (e.g. "Jobs - P&T › 04 Area … › 03 UA")
    // instead of making a deep folder look like it sits directly under Drive.
    const pinned = SS.drive.pinnedFolder();
    const fromPinned = !!pinned;
    const last = pinned || SS.drive.lastFolder();
    // When this folder was pinned/saved we stored its FULL path, so we already
    // know the breadcrumb — seed the stack with it and render once (complete
    // crumbs + folder list together, no async ancestry walk, no second render).
    // Legacy entries that only saved {id,name} fall back to a single-entry stack
    // whose ancestry is derived lazily below and then persisted for next time.
    const knownPath = last && Array.isArray(last.path) && last.path.length ? last.path : null;
    let stack = knownPath
      ? knownPath.map(s => ({ id: s.id, name: s.name }))
      : (last ? [{ id: last.id, name: last.name }] : [{ id: '__roots__', name: 'Drive' }]);

    const m = modal(
      `<h3>${mode === 'save' ? 'Save to Google Drive' : 'Open from Google Drive'}</h3>
       <div class="ss-drive-crumbs" id="ssCrumbs"></div>
       <div class="ss-drive-browser" id="ssBrowser"><div class="ss-drive-loading">Loading…</div></div>
       <div class="ss-drive-actionsbar" id="ssActionsBar"></div>
       <div class="remote-modal-actions" style="margin-top:16px">
         <button class="remote-modal-btn" data-action="close">Cancel</button>
       </div>`
    );
    m.querySelector('[data-action="close"]').addEventListener('click', closeModal);

    const browserEl = m.querySelector('#ssBrowser');
    const crumbsEl = m.querySelector('#ssCrumbs');
    const actionsEl = m.querySelector('#ssActionsBar');

    function renderCrumbs() {
      const parts = [`<span class="ss-crumb" data-i="-1">Drive</span>`];
      stack.forEach((s, i) => {
        if (s.id === '__roots__') return;
        parts.push('<span class="ss-crumb-sep">›</span>');
        parts.push(`<span class="ss-crumb" data-i="${i}">${escapeHtml(s.name)}</span>`);
      });
      crumbsEl.innerHTML = parts.join('');
      crumbsEl.querySelectorAll('.ss-crumb').forEach(el => {
        el.addEventListener('click', () => {
          const i = parseInt(el.dataset.i, 10);
          stack = i < 0 ? [{ id: '__roots__', name: 'Drive' }] : stack.slice(0, i + 1);
          render();
        });
      });
    }

    function here() { return stack[stack.length - 1]; }
    // The full navigable path to the current folder, for persisting as a known
    // breadcrumb (drops the virtual roots entry). Reused on next open so we
    // skip the ancestry walk entirely.
    function pathHere() {
      return stack.filter(s => s.id !== '__roots__').map(s => ({ id: s.id, name: s.name }));
    }

    function renderActions() {
      const card = actionsEl.closest('.ss-drive-card');
      if (card) card.classList.remove('ss-drive-naming');
      const loc = here();
      const inRealFolder = loc.id !== '__roots__' &&
        loc.id !== '__drives__' && loc.id !== 'sharedWithMe';
      const canSaveHere = mode === 'save' && inRealFolder;

      const pinned = SS.drive.pinnedFolder();
      const isPinned = pinned && pinned.id === loc.id;
      const pinBtn = inRealFolder
        ? `<button class="remote-modal-btn ss-drive-pin" id="ssPinHere" title="${isPinned
              ? 'This is your default folder — click to unpin'
              : 'Open the browser here by default'}">${isPinned ? 'Default ✓' : 'Pin as default'}</button>`
        : '';

      const newFolderBtn = inRealFolder
        ? `<button class="remote-modal-btn ss-drive-newfolder" id="ssNewFolder" title="Create a folder here">
             <span class="remote-modal-btn-icon">＋</span> New folder
           </button>`
        : '';

      const saveBtn = canSaveHere
        ? `<button class="remote-modal-btn ss-drive-savehere" id="ssSaveHere">
             <span class="remote-modal-btn-icon">⬆</span> Save here: <strong>${escapeHtml(loc.name)}</strong>
           </button>`
        : (mode === 'save'
            ? `<div class="ss-drive-hint-inline">Open a folder to save into it.</div>`
            : '');

      const folderRow = (pinBtn || newFolderBtn)
        ? `<div class="ss-drive-folderactions">${pinBtn}${newFolderBtn}</div>`
        : '';

      actionsEl.innerHTML = saveBtn + folderRow;

      if (canSaveHere) {
        actionsEl.querySelector('#ssSaveHere').addEventListener('click', () => doSave(loc, pathHere()));
      }
      if (inRealFolder) {
        actionsEl.querySelector('#ssPinHere').addEventListener('click', async () => {
          if (isPinned) {
            await SS.drive.setPinned(null);
            SS.drive.toast('Default folder cleared', 'info');
          } else {
            await SS.drive.setPinned(loc.id, loc.name, pathHere());
            SS.drive.toast(`“${loc.name}” pinned as default`, 'success');
          }
          renderActions();
        });
        actionsEl.querySelector('#ssNewFolder').addEventListener('click', () => newFolderPrompt(loc));
      }
    }

    // Inline "new folder" form rendered into the actions bar. Creating a folder
    // pushes it onto the stack and navigates in; cancel restores the actions.
    function newFolderPrompt(parent) {
      // The app lives in an iframe, where the on-screen keyboard does NOT shrink
      // visualViewport — so we can't reflow around it. Instead, collapse the card
      // (the tall folder list is hidden via .ss-drive-naming) and anchor it to the
      // top of the screen, so the input sits high above the keyboard. No scroll
      // tricks needed → no jank.
      const card = actionsEl.closest('.ss-drive-card');
      if (card) card.classList.add('ss-drive-naming');
      actionsEl.innerHTML =
        `<div class="ss-drive-newfolderform">
           <div class="ss-drive-naming-label">New folder in “${escapeHtml(parent.name)}”</div>
           <div class="ss-drive-naming-row">
             <input class="ss-drive-input" id="ssNewFolderName" placeholder="Folder name" autocomplete="off" autocapitalize="words" />
             <button class="remote-modal-btn ss-drive-go" id="ssNewFolderCreate">Create</button>
             <button class="remote-modal-btn" id="ssNewFolderCancel">Cancel</button>
           </div>
         </div>`;
      const input = actionsEl.querySelector('#ssNewFolderName');
      // focus() runs synchronously inside this click handler (a user gesture),
      // so iOS reliably opens the keyboard.
      input.focus();
      actionsEl.querySelector('#ssNewFolderCancel').addEventListener('click', renderActions);
      const create = async () => {
        const name = (input.value || '').trim();
        if (!name) { SS.drive.toast('Enter a folder name', 'warning'); return; }
        const btn = actionsEl.querySelector('#ssNewFolderCreate');
        btn.disabled = true; btn.textContent = 'Creating…';
        try {
          const folder = await SS.drive.createFolder(parent.id, name);
          SS.drive.toast(`Created “${folder.name}”`, 'success');
          stack.push({ id: folder.id, name: folder.name });
          render(); // navigate into the new (empty) folder
        } catch (err) {
          btn.disabled = false; btn.textContent = 'Create';
          SS.drive.toast(err.message, 'error');
        }
      };
      actionsEl.querySelector('#ssNewFolderCreate').addEventListener('click', create);
      input.addEventListener('keydown', (e) => { if (e.key === 'Enter') create(); });
    }

    async function render() {
      renderCrumbs();
      renderActions();
      browserEl.innerHTML = '<div class="ss-drive-loading">Loading…</div>';
      const loc = here();
      try {
        let rows = '';
        if (loc.id === '__roots__') {
          rows = ROOTS.map(r =>
            `<div class="ss-drive-row ss-drive-folder" data-id="${r.id}" data-name="${escapeHtml(r.name)}">
               <span class="ss-drive-row-icon">${r.icon}</span>
               <span class="ss-drive-row-name">${escapeHtml(r.name)}</span>
               <span class="ss-drive-row-chev">›</span>
             </div>`).join('');
        } else if (loc.id === '__drives__') {
          const drives = await SS.drive.listSharedDrives();
          rows = drives.length
            ? drives.map(d =>
                `<div class="ss-drive-row ss-drive-folder" data-id="${d.id}" data-name="${escapeHtml(d.name)}">
                   <span class="ss-drive-row-icon">🗂</span>
                   <span class="ss-drive-row-name">${escapeHtml(d.name)}</span>
                   <span class="ss-drive-row-chev">›</span>
                 </div>`).join('')
            : '<div class="ss-drive-empty">No shared drives.</div>';
        } else {
          const folders = await SS.drive.listFolders(loc.id);
          rows += folders.map(f =>
            `<div class="ss-drive-row ss-drive-folder" data-id="${f.id}" data-name="${escapeHtml(f.name)}">
               <span class="ss-drive-row-icon">📁</span>
               <span class="ss-drive-row-name">${escapeHtml(f.name)}</span>
               <span class="ss-drive-row-chev">›</span>
             </div>`).join('');
          if (mode === 'open') {
            const files = await SS.drive.listInFolder(loc.id);
            rows += files.map(f =>
              `<div class="ss-drive-row ss-drive-file" data-fid="${f.id}" data-name="${escapeHtml(f.name)}">
                 <span class="ss-drive-row-icon">📄</span>
                 <span class="ss-drive-row-name">${escapeHtml(f.name.replace(/\.slides$/, ''))}</span>
                 <span class="ss-drive-row-time">${timeAgo(f.modifiedTime)}</span>
               </div>`).join('');
          }
          if (!rows) {
            rows = `<div class="ss-drive-empty">${mode === 'open'
              ? 'No folders or decks here.' : 'No subfolders here.'}</div>`;
          }
        }
        browserEl.innerHTML = rows;
        browserEl.querySelectorAll('.ss-drive-folder').forEach(el => {
          el.addEventListener('click', () => {
            stack.push({ id: el.dataset.id, name: el.dataset.name });
            render();
          });
        });
        browserEl.querySelectorAll('.ss-drive-file').forEach(el => {
          el.addEventListener('click', () => pickFile(el.dataset.fid, el.dataset.name));
        });
      } catch (err) {
        browserEl.innerHTML = `<div class="ss-drive-empty ss-drive-err">${escapeHtml(err.message)}</div>`;
      }
    }

    render();

    // Legacy fallback only: we opened at a folder but only knew its id+name (no
    // stored path). Derive the true ancestry so the breadcrumb is honest and
    // every parent is clickable, refresh just the crumbs (the folder itself is
    // unchanged — a full render() here would re-fetch the same list = double
    // load), then persist the resolved path so the next open is instant.
    if (!knownPath) {
      (async () => {
        if (!last || !last.id) return;
        try {
          const path = await SS.drive.ancestry(last.id);
          if (!path || !path.length) return;
          // Only adopt it if we're still showing that same starting folder
          // (user hasn't navigated away during the async fetch).
          if (stack.length === 1 && stack[0].id === last.id) {
            stack = path.map(s => ({ id: s.id, name: s.name }));
            renderCrumbs();
            const persistPath = stack.filter(s => s.id !== '__roots__');
            if (fromPinned) SS.drive.setPinned(last.id, last.name, persistPath);
            else SS.drive.rememberFolder(last.id, last.name, persistPath);
          }
        } catch (e) { /* keep the single-entry stack on failure */ }
      })();
    }

    return m;
  }

  // Save the current deck into the chosen folder, prompting copy/move when the
  // deck already lives in a different Drive folder.
  async function doSave(folder, path) {
    const pres = SS._currentPres;
    if (!pres) { SS.drive.toast('No presentation open', 'warning'); return; }
    SS.drive.rememberFolder(folder.id, folder.name, path);

    let existingId = SS.drive.knownFileId(pres.id);
    // No local mapping (e.g. a different browser/device, or never saved here):
    // fall back to the durable presId tag in Drive so we update the real file
    // in place instead of creating a same-named duplicate.
    if (!existingId) {
      try {
        existingId = await SS.drive.findByPresId(pres.id);
      } catch (e) { /* network/permission issue — treat as not found */ }
    }
    // If this deck is already a Drive file, find out whether it's elsewhere.
    if (existingId) {
      let parents = [];
      try { parents = await SS.drive.getParents(existingId); } catch (e) { /* treat as unknown */ }
      const elsewhere = parents.length && !parents.includes(folder.id);
      if (elsewhere) {
        const choice = await copyOrMovePrompt(folder.name);
        if (choice === 'cancel') return;
        busyCard('Saving to Google Drive…');
        try {
          if (choice === 'move') {
            await SS.drive.moveFile(existingId, folder.id);
            const file = await SS.drive.save(pres, { fileId: existingId }); // update content in place
            return finishSave(pres, file, `Moved to “${folder.name}” and saved`);
          }
          // copy → force a brand-new file in the target folder
          const file = await SS.drive.save(pres, { fileId: null, folderId: folder.id });
          return finishSave(pres, file, `Saved a copy in “${folder.name}”`);
        } catch (err) { return errorCard('Save failed', err.message); }
      }
    }

    busyCard('Saving to Google Drive…');
    try {
      const file = await SS.drive.save(pres, existingId ? { fileId: existingId } : { folderId: folder.id });
      finishSave(pres, file, `“${pres.title || file.name}” saved to “${folder.name}”`);
    } catch (err) {
      errorCard('Save failed', err.message);
    }
  }

  function finishSave(pres, file, heading) {
    shareResult(file.id, file.webViewLink, heading);
  }

  // Themed yes/no/cancel for the relocate case.
  function copyOrMovePrompt(folderName) {
    return new Promise((resolve) => {
      const m = modal(
        `<h3>This deck is already in Drive</h3>
         <p class="remote-modal-hint">It currently lives in a different folder. Save into
            “${escapeHtml(folderName)}” as a copy, or move the existing file there?</p>
         <div class="remote-modal-actions" style="margin-top:16px; gap:8px">
           <button class="remote-modal-btn" data-c="copy"><span class="remote-modal-btn-icon">📑</span> Save a copy</button>
           <button class="remote-modal-btn ss-drive-go" data-c="move"><span class="remote-modal-btn-icon">➡</span> Move it here</button>
         </div>
         <div class="remote-modal-actions" style="margin-top:8px">
           <button class="remote-modal-btn" data-c="cancel">Cancel</button>
         </div>`
      );
      m.querySelectorAll('[data-c]').forEach(b =>
        b.addEventListener('click', () => resolve(b.dataset.c)));
    });
  }

  /* ── Save / Open entry points ──
     Both await SS.appState so the deck→file map and the last-used folder
     (workspace state, read asynchronously) are populated before the browser
     opens — otherwise a save could create a duplicate Drive file. */
  async function saveCurrent() {
    const pres = SS._currentPres;
    if (!pres) { SS.drive.toast('No presentation open', 'warning'); return; }
    await SS.appState.ready();
    await SS.drive.loadPinned();
    folderBrowser('save');
  }

  async function openPicker() {
    await SS.appState.ready();
    await SS.drive.loadPinned();
    folderBrowser('open');
  }

  async function pickFile(fileId, name) {
    const openKey = 'ss-drive-open';
    SS.drive.toast('Opening from Drive…', 'info', { key: openKey, dismissable: false });
    closeModal();
    try {
      const raw = await SS.drive.download(fileId);
      const pres = await SS.drive.importDeck(raw, name, fileId);
      SS.drive.toast(`Opened “${pres.title || name}”`, 'success', { key: openKey, durationMs: 2500, dismissable: true });
    } catch (err) {
      SS.drive.toast(`Couldn’t open “${name}”`, 'error', { key: openKey, dismissable: true });
      errorCard('Open failed', err.message);
    }
  }

  /* ── Share current deck ── */
  async function shareCurrent() {
    const pres = SS._currentPres;
    if (!pres) { SS.drive.toast('No presentation open', 'warning'); return; }
    // Ensure it's saved first (need a Drive file id to share).
    let fileId = SS.drive.knownFileId(pres.id);
    let link = null;
    try {
      if (!fileId) {
        SS.drive.toast('Saving to Drive first…');
        const file = await SS.drive.save(pres);
        fileId = file.id; link = file.webViewLink;
      }
      shareResult(fileId, link, `Share “${pres.title || pres.id}”`);
    } catch (err) {
      errorCard('Share failed', err.message);
    }
  }

  // The result card with copy-link + "share with email" controls.
  function shareResult(fileId, webViewLink, heading) {
    const m = modal(
      `<h3>${escapeHtml(heading)}</h3>
       <p class="remote-modal-hint">Saved to Google Drive. Get a view link, or share with edit access by email.</p>
       <div class="ss-drive-sharebtns">
         <button class="remote-modal-btn" id="ssDriveLinkBtn">
           <span class="remote-modal-btn-icon">🔗</span> Get view link
         </button>
       </div>
       <div class="remote-modal-url" id="ssDriveUrl" style="display:${webViewLink ? 'block' : 'none'}">${escapeHtml(webViewLink || '')}</div>
       <div class="ss-drive-or">share with edit access</div>
       <div class="ss-drive-linkrow">
         <input class="ss-drive-input" id="ssDriveEmail" type="email" placeholder="colleague@example.com" />
         <button class="remote-modal-btn ss-drive-go" id="ssDriveEmailBtn">Invite</button>
       </div>
       <div class="remote-modal-actions" style="margin-top:16px">
         <button class="remote-modal-btn" data-action="close">Done</button>
       </div>`
    );
    m.querySelector('[data-action="close"]').addEventListener('click', closeModal);

    const urlEl = m.querySelector('#ssDriveUrl');

    m.querySelector('#ssDriveLinkBtn').addEventListener('click', async (e) => {
      const btn = e.currentTarget;
      btn.disabled = true;
      btn.innerHTML = '<span class="remote-modal-btn-icon">…</span> Creating link';
      try {
        const link = await SS.drive.share(fileId, 'link');
        urlEl.textContent = link;
        urlEl.style.display = 'block';
        btn.innerHTML = '<span class="remote-modal-btn-icon">📋</span> Copy link';
        btn.disabled = false;
        btn.onclick = () => {
          navigator.clipboard.writeText(link).then(() => {
            btn.innerHTML = '<span class="remote-modal-btn-icon">✓</span> Copied!';
            SS.drive.toast('Link copied', 'success');
          });
        };
      } catch (err) {
        btn.disabled = false;
        btn.innerHTML = '<span class="remote-modal-btn-icon">🔗</span> Get view link';
        SS.drive.toast(err.message, 'error');
      }
    });

    m.querySelector('#ssDriveEmailBtn').addEventListener('click', async () => {
      const emailEl = m.querySelector('#ssDriveEmail');
      const email = (emailEl.value || '').trim();
      if (!email || !/^[^@]+@[^@]+\.[^@]+$/.test(email)) {
        SS.drive.toast('Enter a valid email', 'warning'); return;
      }
      try {
        await SS.drive.share(fileId, 'user', email);
        SS.drive.toast(`Shared with ${email}`, 'success');
        emailEl.value = '';
      } catch (err) {
        SS.drive.toast(err.message, 'error');
      }
    });
  }

  function errorCard(title, detail) {
    const m = modal(
      `<h3>${escapeHtml(title)}</h3>
       <p class="remote-modal-hint" style="white-space:pre-wrap">${escapeHtml(detail || '')}</p>
       <div class="remote-modal-actions" style="margin-top:16px">
         <button class="remote-modal-btn" data-action="close">Close</button>
       </div>`
    );
    m.querySelector('[data-action="close"]').addEventListener('click', closeModal);
  }

  function timeAgo(iso) {
    if (window.lucidos && lucidos.utils && lucidos.utils.timeAgo) {
      try { return lucidos.utils.timeAgo(iso); } catch (e) { /* fall through */ }
    }
    return new Date(iso).toLocaleDateString();
  }

  return { saveCurrent, openPicker, shareCurrent, close: closeModal };
})();
</script>
<script>
/* ═══════════ nav-logic.js (inlined) ═══════════ */
/* ══════════════════════════════════════════════════════
   Super Slides — Navigation logic (pure)
   ══════════════════════════════════════════════════════
   The arrow-key traversal rules, extracted as a pure
   function with NO DOM and NO timers so engine.js and the
   test suite share one source of truth.

   `arrowNav(state, direction)` returns an ACTION descriptor
   describing what a Left/Right press should do; the caller
   (engine.js) dispatches it against the live DOM/state, and
   the test (test-nav.js) applies it against a tiny model to
   assert the back/forward sequence is a perfect mirror.

   The invariant this guarantees: pressing Right K times then
   Left K times returns to the exact starting (slide, card).
   The historical bug — Left jumped whole slides once no card
   was focused, instead of entering the previous slide at its
   last card — violated that invariant intermittently.
   ══════════════════════════════════════════════════════ */

/* Attach to the existing SS namespace — DO NOT re-declare it.
   components.js declares `const SS = {}` (a top-level lexical binding) and
   loads before this file in index.html. A `var SS = …` here would collide
   with that lexical binding (a var whose name already has a lexical
   declaration in the same global scope is a SyntaxError), so this whole
   file would silently fail to execute and SS.navLogic would never exist —
   breaking every Left/Right keypress. The tests don't load components.js,
   so they never saw the clash. Just reference SS; it is always defined by
   the time this script runs (components.js in the app, an inline shim in
   tests/index.html). */
SS.navLogic = {
  /**
   * Compute the action for an arrow press.
   *
   * state:
   *   current            — current slide index
   *   slideCount         — total slides
   *   focusedCardIndex   — focused card on current slide, or -1 for none
   *   cardCount          — focusable count on the CURRENT slide
   *                        (>= 2 means "multi-card": cards are walkable)
   *   prevSlideCardCount — focusable count on slide (current-1); only
   *                        consulted by Left when crossing a boundary
   * direction: 'right' | 'left'
   *
   * Returns one of:
   *   { type: 'focusCard', index }       — focus a card on the current slide
   *   { type: 'clearCardFocus' }         — drop focus, stay on the slide
   *   { type: 'goTo', index }            — navigate to a slide (no card)
   *   { type: 'goToFocusLast', index, lastCard }
   *                                      — navigate back a slide AND enter it
   *                                        at its last card (Left boundary cross)
   *   { type: 'none' }                   — nothing to do (already at an edge)
   *
   * `goTo`/`goToFocusLast` indices may be out of range; the dispatcher's
   * goTo() guards bounds, mirroring the original inline handler exactly.
   */
  arrowNav: function (state, direction) {
    var current = state.current;
    var focused = state.focusedCardIndex;
    var cardCount = state.cardCount || 0;
    var prevCount = state.prevSlideCardCount || 0;
    var multi = cardCount >= 2;

    if (direction === 'right') {
      // Expand the current slide card-by-card, then fall through to the
      // next slide once the last card is focused.
      if (multi) {
        if (focused === -1) return { type: 'focusCard', index: 0 };
        if (focused < cardCount - 1) return { type: 'focusCard', index: focused + 1 };
        return { type: 'goTo', index: current + 1 };
      }
      return { type: 'goTo', index: current + 1 };
    }

    // direction === 'left' — the exact inverse of Right.
    // 1. Step back through this slide's cards while one is focused.
    if (multi && focused > 0) return { type: 'focusCard', index: focused - 1 };
    // 2. Reverse of the -1 → 0 step: drop focus but stay on the slide.
    if (multi && focused === 0) return { type: 'clearCardFocus' };
    // 3. No card focused (or single/no-card slide): cross to the previous
    //    slide. Enter it at its LAST card when it has cards to walk — this is
    //    the mirror of how Right EXITS a slide via its last card, and the fix
    //    for the "sometimes traverses cards, sometimes jumps a whole slide"
    //    bug. Without it, backward card traversal stopped after one boundary.
    var target = current - 1;
    if (target < 0) return { type: 'none' };
    if (prevCount >= 2) return { type: 'goToFocusLast', index: target, lastCard: prevCount - 1 };
    return { type: 'goTo', index: target };
  },
};
</script>
<script>
/* ═══════════ engine.js (inlined) ═══════════ */
/* ══════════════════════════════════════════════════════
   Super Slides — Engine
   ══════════════════════════════════════════════════════
   Reads from the presentation registry, renders the
   active presentation, and drives all navigation +
   title-scroller + card-focus logic.
   ══════════════════════════════════════════════════════ */

SS.initEngine = function() {
  const registry = window._superSlidesRegistry || [];
  if (!registry.length) {
    SS.showError(
      'No Presentations',
      'The engine started but no presentations were registered. Check that your <code>.slides</code> files loaded correctly.',
      null,
      'engine.js → initEngine()'
    );
    return;
  }

  const app = document.getElementById('app');
  const menuItems = document.getElementById('menuItems');
  const menuBtn = document.getElementById('menuBtn');
  const menuDropdown = document.getElementById('menuDropdown');

  let currentPres = null;
  let slides = [];
  let current = 0;
  let focusedCardIndex = -1;
  let stateSeq = 0;

  // The resume position lives in the workspace state document (SS.appState) —
  // localStorage throws in the isolated app frame. That read is ASYNCHRONOUS,
  // so persistence stays off until the saved position has been applied:
  // writing before then would overwrite the very position we're restoring.
  // See restoreSavedPosition() in the Init section.
  let persistEnabled = false;

  function persistPosition() {
    if (!persistEnabled) return;
    if (currentPres && currentPres.id) SS.appState.set('presentationId', currentPres.id);
    SS.appState.set('slideIndex', current);
    SS.appState.set('cardIndex', focusedCardIndex);
  }

  // DOM refs populated after render
  let deck, progress, counter, scroller, titleItems, disclaimer, slidePicker, sectionIndicator;

  /* ══════════════════════════════════════
     Menu
     ══════════════════════════════════════ */

  function buildMenu() {
    const items = registry.map((p, i) =>
      `<div class="menu-item${i === 0 ? ' active' : ''}" data-pres="${i}">
        <span class="menu-dot"></span>
        ${p.title}
      </div>`
    ).join('');
    menuItems.innerHTML = items + `
      <div class="menu-separator"></div>
      <div class="menu-item menu-item-action" data-action="drive-save">
        <span class="menu-dot menu-dot-remote">⬆</span>
        Save to Drive
      </div>
      <div class="menu-item menu-item-action" data-action="drive-open">
        <span class="menu-dot menu-dot-remote">📂</span>
        Open from Drive
      </div>
      <div class="menu-separator"></div>
      <div class="menu-item menu-item-action" data-action="remote-mode">
        <span class="menu-dot menu-dot-remote">📱</span>
        Remote mode
      </div>
      <div class="menu-item menu-item-action" data-action="remote">
        <span class="menu-dot menu-dot-remote">⌘</span>
        Open speaker remote
      </div>`;
  }

  // Rebuild the presentation list (after a Drive import adds a deck) and
  // switch to the given presentation id. Exposed for SS.drive.importDeck.
  SS._rebuildMenuAndShow = function (presId) {
    buildMenu();
    const idx = registry.findIndex(p => p.id === presId);
    if (idx >= 0) {
      loadPresentation(registry[idx]);
      menuItems.querySelectorAll('.menu-item').forEach((el, i) => {
        if (el.dataset.action) return;
        el.classList.toggle('active', i === idx);
      });
    }
  };

  function showRemoteModal(url) {
    // Remove existing modal if any
    const existing = document.getElementById('ssRemoteModal');
    if (existing) existing.remove();

    const modal = document.createElement('div');
    modal.id = 'ssRemoteModal';
    modal.innerHTML = `
      <div class="remote-modal-backdrop"></div>
      <div class="remote-modal-card">
        <h3>Open Speaker Remote</h3>
        <p class="remote-modal-hint">Copy the link and open it in Safari, or use Share to send it to another app.</p>
        <div class="remote-modal-url">${url}</div>
        <div class="remote-modal-actions">
          <button class="remote-modal-btn" data-action="copy">
            <span class="remote-modal-btn-icon">📋</span> Copy Link
          </button>
          ${navigator.share ? `<button class="remote-modal-btn" data-action="share">
            <span class="remote-modal-btn-icon">↗</span> Share
          </button>` : ''}
        </div>
      </div>
    `;
    document.body.appendChild(modal);

    // Close on backdrop click
    modal.querySelector('.remote-modal-backdrop').addEventListener('click', () => modal.remove());

    // Copy
    const copyBtn = modal.querySelector('[data-action="copy"]');
    if (copyBtn) copyBtn.addEventListener('click', () => {
      navigator.clipboard.writeText(url).then(() => {
        copyBtn.innerHTML = '<span class="remote-modal-btn-icon">✓</span> Copied!';
        setTimeout(() => modal.remove(), 1200);
      });
    });

    // Share (fallback — still available if user wants it)
    const shareBtn = modal.querySelector('[data-action="share"]');
    if (shareBtn) shareBtn.addEventListener('click', () => {
      navigator.share({ title: 'Speaker Remote', url }).catch(() => {});
      modal.remove();
    });
  }

  // Counter (slide-picker) virker perfekt med ÉN click-handler via
  // document-delegering: toggle-på-knapp + close-on-outside i samme
  // listener, med `return` mellom for å hindre at de slår hverandre ut.
  // Speil det mønsteret her — ikke to separate listeners (stopPropagation
  // stopper bare bubbling, ikke andre handlere på samme element, så en
  // close-listener etter en toggle-listener vil alltid vinne).
  // Direct listener on the wrapper itself — iOS Safari sometimes swallows
  // synthetic click events that bubble to document when the original tap
  // lands on padding (halo) rather than a clickable element. Attaching
  // directly to the wrapper bypasses that quirk completely.
  const menuWrapper = document.querySelector('.menu-wrapper');
  if (menuWrapper) {
    // Use pointerup so we react on touch-release without waiting for the
    // synthetic click. Fall back to click for browsers without pointer
    // events. Dedupe via a 400ms guard so both don't fire the toggle.
    let lastToggle = 0;
    function toggleMenu(e) {
      if (e.target.closest('#menuDropdown')) return; // let menu-item handler decide
      const now = Date.now();
      if (now - lastToggle < 400) { e.preventDefault(); return; }
      lastToggle = now;
      e.preventDefault();
      e.stopPropagation();
      menuDropdown.classList.toggle('open');
      if (slidePicker) slidePicker.classList.remove('open');
    }
    menuWrapper.addEventListener('pointerup', toggleMenu);
    menuWrapper.addEventListener('click', toggleMenu);
  }

  // Outside-click closer (separate from the toggle so they can't race).
  document.addEventListener('click', (e) => {
    if (e.target.closest('#menuBtn, .menu-wrapper, #menuDropdown')) return;
    menuDropdown.classList.remove('open');
  });

  menuItems.addEventListener('click', (e) => {
    const item = e.target.closest('.menu-item');
    if (!item) return;
    if (item.dataset.action === 'drive-save') {
      if (SS.driveUI) SS.driveUI.saveCurrent();
      menuDropdown.classList.remove('open');
      return;
    }
    if (item.dataset.action === 'drive-open') {
      if (SS.driveUI) SS.driveUI.openPicker();
      menuDropdown.classList.remove('open');
      return;
    }
    if (item.dataset.action === 'remote-mode') {
      if (SS.toggleRemoteMode) SS.toggleRemoteMode();
      menuDropdown.classList.remove('open');
      return;
    }
    if (item.dataset.action === 'remote') {
      const remoteUrl = new URL('remote.html', location.href).href;
      const isIOSPwa = /iP(hone|ad|od)/.test(navigator.userAgent) && navigator.standalone;
      if (isIOSPwa) {
        showRemoteModal(remoteUrl);
      } else {
        window.open(remoteUrl, '_blank');
      }
      menuDropdown.classList.remove('open');
      return;
    }
    const idx = parseInt(item.dataset.pres);
    if (registry[idx] && registry[idx] !== currentPres) {
      loadPresentation(registry[idx]);
      menuItems.querySelectorAll('.menu-item').forEach((el, i) => {
        if (el.dataset.action) return;
        el.classList.toggle('active', i === idx);
      });
    }
    menuDropdown.classList.remove('open');
  });

  /* ══════════════════════════════════════
     Render presentation
     ══════════════════════════════════════ */

  function loadPresentation(pres, startSlide) {
    currentPres = pres;
    SS._currentPres = pres;
    startSlide = (startSlide && startSlide > 0 && startSlide < pres.slides.length) ? startSlide : 0;
    current = startSlide;
    focusedCardIndex = -1;

    // Persist active presentation by ID (index is non-deterministic due to parallel loading)
    persistPosition();

    // Clear timers from previous presentation
    clearAllTimers();

    let html = '<div class="bg-dots"></div>';
    html += '<div class="progress" id="ssProgress"></div>';
    html += '<div class="counter" id="ssCounter"></div>';
    html += '<div class="slide-picker" id="ssSlidePicker"></div>';

    // Section indicator (only for presentations with sections)
    if (pres.sections) {
      html += '<div class="section-indicator" id="ssSectionIndicator"></div>';
    }

    // Title scroller
    const ts = pres.titleScroller;
    if (ts) {
      html += `<div class="title-scroller" id="ssTitleScroller">
        <p class="persistent-title ss-editable" data-ss-path="titleScroller" data-ss-prop="persistentTitle">${ts.persistentTitle}</p>
        ${pres.subtitle ? `<p class="persistent-subtitle ss-editable" data-ss-path="" data-ss-prop="subtitle">${pres.subtitle}</p>` : ''}
        <div class="title-viewport">
          ${ts.titles.map((t, i) => {
            return `<div class="title-item ss-editable" data-title="${i}" data-ss-path="titleScroller.titles[${i}]" data-ss-prop="text">${t.text}</div>`;
          }).join('')}
        </div>
        ${ts.asterisk ? '<div class="floating-asterisk" id="ssFloatingAsterisk">*</div>' : ''}
        <div class="team-badge"><div class="dot"></div><span class="ss-editable" data-ss-path="titleScroller" data-ss-prop="badge">${ts.badge}</span></div>
      </div>`;
      if (ts.disclaimer) {
        html += `<p class="results-may-vary ss-editable" id="ssDisclaimer" data-ss-path="titleScroller" data-ss-prop="disclaimer">${ts.disclaimer}</p>`;
      }
    }

    // Deck
    html += '<div class="deck" id="ssDeck">';
    pres.slides.forEach((s, i) => {
      const heroClass = s.hero ? ' slide-hero' : '';
      const activeClass = i === current ? ' active' : '';
      html += `<div class="slide${heroClass} center${activeClass}" data-slide="${i}">${s.html}</div>`;
    });
    html += '</div>';

    app.innerHTML = html;

    // Cache refs
    deck = document.getElementById('ssDeck');
    progress = document.getElementById('ssProgress');
    counter = document.getElementById('ssCounter');
    scroller = document.getElementById('ssTitleScroller');
    titleItems = scroller ? scroller.querySelectorAll('.title-item') : [];
    disclaimer = document.getElementById('ssDisclaimer');
    slidePicker = document.getElementById('ssSlidePicker');
    sectionIndicator = document.getElementById('ssSectionIndicator');
    slides = deck.querySelectorAll('.slide');

    // Build section indicator
    buildSectionIndicator(pres);

    // Build slide picker
    buildSlidePicker(pres);

    updateTitleScroller(current);
    updateUI();
    if (SS._broadcastState) SS._broadcastState();
  }

  /* ── App-level tap / swipe navigation ──
     Attached to #app so taps work even when title-scroller
     or other overlays sit on top of the deck.               */
  (function initNavGestures() {
    let touchStartX = 0, touchStartY = 0, touchStartTime = 0, touchMoved = false;
    let touchHandled = false;
    const TAP_MAX_DURATION = 400; // ms — longer holds are not taps

    function isInteractive(e) {
      return e.target.closest('.bottom-bar, .menu-dropdown, .slide-picker, .section-pip, #ssCounter, #menuBtn, .ss-editing');
    }

    app.addEventListener('touchstart', (e) => {
      if (isInteractive(e)) return;
      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
      touchStartTime = Date.now();
      touchMoved = false;
    }, { passive: true });

    app.addEventListener('touchmove', () => { touchMoved = true; }, { passive: true });

    // True if a picker / menu overlay is currently open. A tap-outside in this
    // state must ONLY dismiss the overlay — it must not navigate slides.
    function overlayOpen() {
      return (slidePicker && slidePicker.classList.contains('open')) ||
             (menuDropdown && menuDropdown.classList.contains('open'));
    }

    function closeOverlays() {
      if (slidePicker) slidePicker.classList.remove('open');
      if (menuDropdown) menuDropdown.classList.remove('open');
    }

    app.addEventListener('touchend', (e) => {
      if (isInteractive(e)) return;
      if (SS.isEditing && SS.isEditing()) return;
      touchHandled = true;
      // If an overlay (picker / menu) is open, a tap outside it just closes it.
      if (overlayOpen()) { closeOverlays(); return; }
      const dx = e.changedTouches[0].clientX - touchStartX;
      const dy = e.changedTouches[0].clientY - touchStartY;
      const holdDuration = Date.now() - touchStartTime;
      // Swipe (horizontal dominant, > 50px)
      if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) {
        dx < 0 ? goTo(current + 1) : goTo(current - 1);
        return;
      }
      // Tap (no significant movement AND short hold — reject long-press attempts)
      if (holdDuration < TAP_MAX_DURATION && (!touchMoved || (Math.abs(dx) < 10 && Math.abs(dy) < 10))) {
        const x = e.changedTouches[0].clientX / window.innerWidth;
        if (x > 0.5) goTo(current + 1); else goTo(current - 1);
      }
    });

    // Desktop click fallback (non-touch)
    app.addEventListener('click', (e) => {
      // Suppress synthetic click fired after touchend
      if (touchHandled) { touchHandled = false; return; }
      if (isInteractive(e)) return;
      if (SS.isEditing && SS.isEditing()) return;
      // If an overlay (picker / menu) is open, a click outside it just closes it.
      if (overlayOpen()) { closeOverlays(); return; }
      // Don't navigate when clicking editable text on desktop —
      // single click activates the editor instead.
      // In fullscreen (ss-editing-disabled) editing is off, so navigate normally.
      if (!document.body.classList.contains('ss-editing-disabled') && e.target.closest('.ss-editable, .ss-editing')) return;
      const x = e.clientX / window.innerWidth;
      if (x > 0.5) goTo(current + 1); else goTo(current - 1);
    });
  })();

  /* ══════════════════════════════════════
     Title scroller
     ══════════════════════════════════════ */

  function clearAllTimers() {
    clearTimeout(window._asteriskTimeout);
    clearTimeout(window._pulseTimeout);
    clearTimeout(window._disclaimerTimeout);
    clearTimeout(window._blinkTimeout);
    if (window._disclaimerAnim) { window._disclaimerAnim.cancel(); window._disclaimerAnim = null; }
  }

  function updateTitleScroller(slideIndex) {
    if (!currentPres.titleScroller || !scroller) return;
    const ts = currentPres.titleScroller;
    const TITLE_SLIDE_COUNT = ts.heroSlideCount;

    if (slideIndex >= TITLE_SLIDE_COUNT) {
      scroller.classList.add('hidden');
      clearAllTimers();
      const asterisk = document.getElementById('ssFloatingAsterisk');
      if (asterisk) { asterisk.classList.remove('pulse'); asterisk.style.opacity = '0'; }
      if (disclaimer) { disclaimer.style.opacity = '0'; disclaimer.style.transform = 'none'; }
      return;
    }
    scroller.classList.remove('hidden');

    const vh = window.innerHeight;
    const centerY = vh * 0.48;

    titleItems.forEach((el, i) => {
      const offset = i - slideIndex;
      const t = ts.titles[i];

      const yOff = t.yOffset || 0;

      if (offset === 0) {
        el.style.color = 'var(--accent)';
        el.style.opacity = '1';
        el.style.transform = `translateY(${centerY + yOff}px) translateY(-50%) scale(1)`;
        el.style.textShadow = '0 0 80px rgba(106,150,224,0.35), 0 0 160px rgba(106,150,224,0.15)';
        el.style.filter = 'none';
        el.style.pointerEvents = 'auto';
      } else if (offset < 0) {
        const upDistance = 90 * Math.abs(offset);
        // Keep accent color for already-shown titles — only fade & blur them.
        el.style.color = 'var(--accent)';
        el.style.opacity = Math.max(0.18, 0.45 - Math.abs(offset) * 0.12) + '';
        el.style.transform = `translateY(${centerY + yOff - 80 - upDistance}px) translateY(-50%) scale(${t.restScale})`;
        el.style.textShadow = 'none';
        el.style.filter = 'blur(1px)';
        el.style.pointerEvents = 'none';
      } else {
        const downDistance = 70 * offset;
        // Keep accent color for upcoming titles too — prevents a white flash
        // when navigating backwards (current → upcoming would snap to dim).
        el.style.color = 'var(--accent)';
        el.style.opacity = Math.max(0.05, 0.15 - offset * 0.05) + '';
        el.style.transform = `translateY(${centerY + yOff + 80 + downDistance}px) translateY(-50%) scale(${t.restScale})`;
        el.style.textShadow = 'none';
        el.style.filter = 'blur(1px)';
        el.style.pointerEvents = 'none';
      }
    });

    // Asterisk animation on last title slide
    const asterisk = document.getElementById('ssFloatingAsterisk');
    const marriageWord = document.getElementById('marriageWord');
    const teamBadge = scroller.querySelector('.team-badge');

    if (slideIndex === TITLE_SLIDE_COUNT - 1 && asterisk && marriageWord) {
      asterisk.classList.remove('pulse');
      asterisk.style.opacity = '0';
      if (disclaimer) {
        disclaimer.style.opacity = '0';
        disclaimer.style.transform = 'none';
      }
      if (window._disclaimerAnim) { window._disclaimerAnim.cancel(); window._disclaimerAnim = null; }
      clearAllTimers();

      window._asteriskTimeout = setTimeout(() => {
        const badgeRect = teamBadge.getBoundingClientRect();
        const marriageRect = marriageWord.getBoundingClientRect();
        const titleRect = titleItems[TITLE_SLIDE_COUNT - 1].getBoundingClientRect();

        asterisk.style.left = (marriageRect.right + 2) + 'px';
        asterisk.style.top = (marriageRect.top - 8) + 'px';
        asterisk.classList.add('pulse');

        if (disclaimer) {
          window._disclaimerTimeout = setTimeout(() => {
            const startY = badgeRect.top - 20;
            const targetY = titleRect.bottom + 16;
            const dist = targetY - startY;

            disclaimer.style.top = startY + 'px';
            disclaimer.style.transform = 'none';
            disclaimer.style.opacity = '0';

            window._disclaimerAnim = disclaimer.animate([
              { offset: 0,    opacity: 0,   transform: 'translateY(0)' },
              { offset: 0.08, opacity: 0.1, transform: 'translateY(0)' },
              { offset: 0.20, opacity: 0.4, transform: `translateY(${dist * 0.02}px)` },
              { offset: 0.50, opacity: 0.7, transform: `translateY(${dist * 0.45}px)` },
              { offset: 0.72, opacity: 0.85, transform: `translateY(${dist * 0.92}px)` },
              { offset: 0.82, opacity: 0.9, transform: `translateY(${dist * 1.06}px)` },
              { offset: 0.92, opacity: 0.95, transform: `translateY(${dist * 0.98}px)` },
              { offset: 1,    opacity: 1,   transform: `translateY(${dist}px)` },
            ], { duration: 1600, easing: 'linear', fill: 'forwards' });
          }, 400);
        }
      }, 1250);
    } else {
      clearAllTimers();
      if (asterisk) { asterisk.classList.remove('pulse'); asterisk.style.opacity = '0'; }
      if (disclaimer) { disclaimer.style.opacity = '0'; disclaimer.style.transform = 'none'; }
    }
  }

  /* ══════════════════════════════════════
     Section Indicator
     ══════════════════════════════════════ */

  function buildSectionIndicator(pres) {
    if (!sectionIndicator || !pres.sections) return;
    sectionIndicator.innerHTML = pres.sections.map((sec, i) =>
      `<div class="section-pip" data-section="${i}" style="--sec-color: var(--${sec.color});">
        <span class="pip-dot"></span>
        <span class="pip-label">${sec.title}</span>
      </div>`
    ).join('');
  }

  function getCurrentSection() {
    if (!currentPres || !currentPres.sections) return -1;
    for (let i = currentPres.sections.length - 1; i >= 0; i--) {
      if (current >= currentPres.sections[i].startIndex) return i;
    }
    return 0;
  }

  function updateSectionIndicator() {
    if (!sectionIndicator || !currentPres || !currentPres.sections) return;
    const secIdx = getCurrentSection();
    sectionIndicator.querySelectorAll('.section-pip').forEach((el, i) => {
      el.classList.toggle('active', i === secIdx);
    });
  }

  // Section pip clicks
  document.addEventListener('click', (e) => {
    const pip = e.target.closest('.section-pip');
    if (!pip || !currentPres || !currentPres.sections) return;
    e.stopPropagation();
    const idx = parseInt(pip.dataset.section);
    const sec = currentPres.sections[idx];
    if (sec && current !== sec.startIndex) goTo(sec.startIndex);
  });

  /* ══════════════════════════════════════
     Slide Picker
     ══════════════════════════════════════ */

  function getSlideLabel(pres, i) {
    const s = pres.slides[i];
    // Try to extract a title from the slide data
    if (s.title) return s.title;
    // Fallback: parse the first h2 or h3 from html
    const m = s.html.match(/<h[12][^>]*>(.*?)<\/h[12]>/);
    if (m) return m[1].replace(/<[^>]+>/g, '');
    if (i === 0) return 'Title';
    return 'Slide ' + (i + 1);
  }

  function buildSlidePicker(pres) {
    if (!slidePicker) return;
    if (pres.sections) {
      slidePicker.innerHTML = pres.sections.map((sec) => {
        const items = [];
        for (let i = sec.startIndex; i <= sec.endIndex; i++) {
          items.push(
            `<div class="slide-picker-item${i === current ? ' active' : ''}" data-slide="${i}">
              <span class="picker-num">${i + 1}</span>
              <span>${getSlideLabel(pres, i)}</span>
            </div>`
          );
        }
        return `<div class="picker-section">
          <div class="picker-section-label" style="color: var(--${sec.color});">${sec.title}</div>
          ${items.join('')}
        </div>`;
      }).join('');
    } else {
      slidePicker.innerHTML = pres.slides.map((_, i) =>
        `<div class="slide-picker-item${i === current ? ' active' : ''}" data-slide="${i}">
          <span class="picker-num">${i + 1}</span>
          <span>${getSlideLabel(pres, i)}</span>
        </div>`
      ).join('');
    }
  }

  function updatePickerActive() {
    if (!slidePicker) return;
    slidePicker.querySelectorAll('.slide-picker-item').forEach((el, i) => {
      el.classList.toggle('active', i === current);
    });
    // Scroll active item into view
    const active = slidePicker.querySelector('.slide-picker-item.active');
    if (active) active.scrollIntoView({ block: 'nearest' });
  }

  // Counter click toggles picker
  document.addEventListener('click', (e) => {
    if (e.target.closest('#ssCounter')) {
      e.stopPropagation();
      if (slidePicker) slidePicker.classList.toggle('open');
      menuDropdown.classList.remove('open');
      return;
    }
    const pickerItem = e.target.closest('.slide-picker-item');
    if (pickerItem) {
      e.stopPropagation();
      const idx = parseInt(pickerItem.dataset.slide);
      if (idx !== current) goTo(idx);
      slidePicker.classList.remove('open');
      return;
    }
    // Close picker on outside click
    if (slidePicker) slidePicker.classList.remove('open');
  });

  /* ══════════════════════════════════════
     Navigation
     ══════════════════════════════════════ */

  function goTo(n) {
    if (n < 0 || n >= slides.length || n === current) return;
    const oldSlide = slides[current];
    focusedCardIndex = -1;
    oldSlide.classList.remove('active');
    setTimeout(() => {
      oldSlide.classList.remove('has-card-focus', 'insight-focused');
      delete oldSlide.dataset.cardFocus;
      oldSlide.querySelectorAll('.card-focused').forEach(c => c.classList.remove('card-focused'));
    }, 450);
    current = n;
    persistPosition();
    slides[current].classList.add('active');
    if (slidePicker) slidePicker.classList.remove('open');
    updateTitleScroller(current);
    updateUI();
    broadcastState();
  }

  function updateUI() {
    if (progress) progress.style.width = ((current + 1) / slides.length) * 100 + '%';
    if (counter) counter.textContent = (current + 1) + ' / ' + slides.length;
    updatePickerActive();
    updateSectionIndicator();

    // Tint progress bar to current section color
    if (currentPres && currentPres.sections) {
      const secIdx = getCurrentSection();
      if (secIdx >= 0) {
        const sec = currentPres.sections[secIdx];
        progress.style.background = `linear-gradient(90deg, var(--${sec.color}), var(--${sec.color === 'accent' ? 'cyan' : sec.color}))`;
      }
    } else {
      if (progress) progress.style.background = '';
    }
  }

  /* ══════════════════════════════════════
     Card focus system
     ══════════════════════════════════════ */

  function getFocusables(slide) {
    const items = Array.from(slide.querySelectorAll('.card'));
    const takeaways = Array.from(slide.querySelectorAll('.takeaway-item'));
    items.push(...takeaways);
    const insight = slide.querySelector('.insight');
    if (insight) items.push(insight);
    return items;
  }

  function clearCardFocus() {
    const slide = slides[current];
    slide.classList.remove('has-card-focus', 'insight-focused');
    delete slide.dataset.cardFocus;
    slide.querySelectorAll('.card-focused').forEach(c => c.classList.remove('card-focused'));
    focusedCardIndex = -1;
    persistPosition();
  }

  function focusCard(index) {
    const slide = slides[current];
    const items = getFocusables(slide);
    if (!items.length) return false;
    if (index < 0 || index >= items.length) return false;

    slide.classList.add('has-card-focus');
    slide.dataset.cardFocus = String(index);
    items.forEach(c => c.classList.remove('card-focused'));
    items[index].classList.add('card-focused');
    focusedCardIndex = index;
    persistPosition();

    if (items[index].classList.contains('insight')) {
      slide.classList.add('insight-focused');
    } else {
      slide.classList.remove('insight-focused');
    }
    return true;
  }

  function isMultiCardSlide() {
    return getFocusables(slides[current]).length >= 2;
  }

  /* ══════════════════════════════════════
     Keyboard
     ══════════════════════════════════════ */

  document.addEventListener('keydown', (e) => {
    if (!currentPres) return;
    // Don't navigate while editing text (inline slide edit)…
    if (SS.isEditing && SS.isEditing()) return;
    // …or while typing in any form field (e.g. the Drive "new folder" input).
    // Otherwise Space/Backspace/Enter/arrows get hijacked for slide nav and the
    // keystroke is swallowed by preventDefault().
    const t = e.target;
    if (t && (t.isContentEditable ||
              t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT')) return;

    if (e.key === 'ArrowUp' || e.key === ' ' || e.key === 'Enter') {
      e.preventDefault();
      goTo(current + 1);
    } else if (e.key === 'ArrowDown' || e.key === 'Backspace') {
      e.preventDefault();
      goTo(current - 1);
    } else if (e.key === 'ArrowRight') {
      e.preventDefault();
      dispatchArrowNav('right');
    } else if (e.key === 'ArrowLeft') {
      e.preventDefault();
      dispatchArrowNav('left');
    }
  });

  // Dispatch a pure nav action (from SS.navLogic.arrowNav) against the live
  // DOM/state. Keeping the decision in the pure helper and the side effects
  // here means engine.js and the test suite share one traversal source.
  function dispatchArrowNav(direction) {
    const cardCount = getFocusables(slides[current]).length;
    const prevSlideCardCount = current > 0
      ? getFocusables(slides[current - 1]).length
      : 0;
    const action = SS.navLogic.arrowNav(
      { current, slideCount: slides.length, focusedCardIndex, cardCount, prevSlideCardCount },
      direction
    );

    switch (action.type) {
      case 'focusCard':
        focusCard(action.index); broadcastState();
        break;
      case 'clearCardFocus':
        clearCardFocus(); broadcastState();
        break;
      case 'goTo':
        goTo(action.index);
        break;
      case 'goToFocusLast': {
        // Navigate back a slide, then enter it at its last card — but DEFER the
        // focus until the slide's fade-in (opacity 0.4s) completes. Focusing the
        // last card immediately would re-fire the insight pulse mid-transition
        // (the flash-through bug). Guard on `current` so a rapid second Left that
        // navigates away cancels this stale focus.
        const before = current;
        goTo(action.index);
        if (current !== before) {
          const target = current;
          setTimeout(() => {
            if (current === target && focusedCardIndex === -1) {
              focusCard(action.lastCard); broadcastState();
            }
          }, 450);
        }
        break;
      }
      case 'none':
      default:
        break;
    }
  }

  window.addEventListener('resize', () => {
    if (currentPres) updateTitleScroller(current);
  });

  /* ══════════════════════════════════════
     Init
     ══════════════════════════════════════ */

  buildMenu();

  // Apply the persisted resume position (saved by presentation ID, not index)
  // once SS.appState has read the state document. That read is ASYNCHRONOUS,
  // so the caller below paints a default deck first and this reconciles after.
  // If the user (or a remote) has already moved off that first paint by the
  // time the document lands, their position wins — we leave them where they
  // are and simply start persisting from there.
  async function restoreSavedPosition() {
    const paintedPres  = currentPres;
    const paintedSlide = current;
    const paintedCard  = focusedCardIndex;

    try {
      await SS.appState.ready();
    } catch (err) {
      console.warn('[SS] could not read the saved position:', err);
    }

    const moved = currentPres !== paintedPres ||
                  current !== paintedSlide ||
                  focusedCardIndex !== paintedCard;

    try {
      if (!moved) {
        const savedPresId = SS.appState.get('presentationId', null);
        const rawSlide    = SS.appState.get('slideIndex', 0);
        const rawCard     = SS.appState.get('cardIndex', -1);
        const savedSlide  = Number.isInteger(rawSlide) ? rawSlide : 0;
        const savedCard   = Number.isInteger(rawCard) ? rawCard : -1;

        const foundIdx  = savedPresId ? registry.findIndex(p => p.id === savedPresId) : -1;
        const startPres = foundIdx >= 0 ? foundIdx : 0;

        if (startPres !== 0 || savedSlide !== 0) {
          loadPresentation(registry[startPres], savedSlide);
          menuItems.querySelectorAll('.menu-item').forEach((el, i) => {
            if (el.dataset.action) return;
            el.classList.toggle('active', i === startPres);
          });
        }

        if (savedCard >= 0) focusCard(savedCard);
      }
    } catch (err) {
      // A bad saved position must not leave the app un-persisting forever —
      // stay on the first paint and carry on.
      console.warn('[SS] could not apply the saved position:', err);
    }

    // From here on, navigation persists.
    persistEnabled = true;
    persistPosition();
    if (SS._broadcastState) SS._broadcastState();
  }

  // First paint: the default deck at slide 0, rendered synchronously so the
  // app is never blank while the saved position is in flight.
  loadPresentation(registry[0]);
  restoreSavedPosition();

  /* ══════════════════════════════════════
     Remote control via SSE
     ══════════════════════════════════════ */

  // Broadcast the current presenter state (called after navigation
  // and on a heartbeat so a freshly-opened remote can sync up).
  function broadcastState() {
    if (!currentPres || !window.lucidos) return;
    stateSeq++;
    const cardCount = getFocusables(slides[current]).length;
    lucidos.events.emit('SlidePresenterState', {
      summary: `Slide ${current + 1}/${slides.length}: ${currentPres.title}`,
      presentationId: currentPres.id,
      presentationTitle: currentPres.title,
      slideIndex: current,
      slideCount: slides.length,
      slideTitle: getSlideLabel(currentPres, current),
      cardIndex: focusedCardIndex,
      cardCount: cardCount,
      seq: stateSeq,
    }, { transient: true }).catch(err => console.warn('[SS] broadcast failed:', err));
  }

  // Expose for inner functions added before this point
  SS._broadcastState = broadcastState;

  // Listen for remote commands
  if (window.lucidos) {
    lucidos.sse.connect();

    lucidos.sse.on('SlideRemoteCommand', (data) => {
      if (!data || !currentPres) return;

      // ── Absolute-state protocol ────────────────────────
      // Every command carries the full target state:
      //   { action: 'setState', presentationId, slideIndex, cardIndex }
      // The presenter reconciles to that state — no relative ops, no drift.
      //
      // Legacy 'sync' is also accepted (remote asking for a re-broadcast).
      if (data.action === 'sync') { broadcastState(); return; }
      if (data.action !== 'setState') return; // ignore unknown / legacy actions

      const targetPresId   = data.presentationId;
      const targetSlideIdx = typeof data.slideIndex === 'number' ? data.slideIndex : current;
      const targetCardIdx  = typeof data.cardIndex  === 'number' ? data.cardIndex  : -1;

      // 1. Reconcile presentation
      if (targetPresId && targetPresId !== currentPres.id) {
        const idx = registry.findIndex(p => p.id === targetPresId);
        if (idx >= 0) {
          loadPresentation(registry[idx], targetSlideIdx);
          menuItems.querySelectorAll('.menu-item').forEach((el, i) => {
            if (el.dataset.action) return;
            el.classList.toggle('active', i === idx);
          });
          // loadPresentation broadcasts; now reconcile card if requested.
          if (targetCardIdx >= 0) {
            if (focusCard(targetCardIdx)) broadcastState();
          }
          return;
        }
        // Unknown presentation — ignore (don't move within current deck either).
        return;
      }

      // 2. Reconcile slide
      if (targetSlideIdx !== current) goTo(targetSlideIdx);

      // 3. Reconcile card
      if (targetCardIdx !== focusedCardIndex) {
        if (targetCardIdx < 0) {
          if (focusedCardIndex !== -1) { clearCardFocus(); broadcastState(); }
        } else {
          if (focusCard(targetCardIdx)) broadcastState();
        }
      }
    });

    // Re-broadcast on resync requests (remote opens later — ping is transient)
    lucidos.sse.on('SlidePresenterPing', () => broadcastState());

    // Initial announce so any open remote picks us up
    setTimeout(broadcastState, 200);
  }
};
</script>

/* ═══════════ remote-mode.js (inlined) ═══════════ */
