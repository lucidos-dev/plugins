const SS = {};

/* ══════════════════════════════════════════════
   Workspace-scoped app state (SS.appState)
   ══════════════════════════════════════════════
   The app runs in an isolated iframe at an opaque origin, so
   `localStorage` throws SecurityError — and an unguarded throw
   takes the rest of the script with it. Everything that used to
   live there and is a WORKSPACE fact rather than a device fact
   now lives in one JSON document, read and written over the SDK
   bridge:

     artifacts/super-slides/state.json
       presentationId   ← ss-pres
       slideIndex       ← ss-slide
       cardIndex        ← ss-card
       driveFileMap     ← ss-drive-map
       driveLastFolder  ← ss-drive-last-folder

   Two consequences every caller has to respect:

   1. The read is ASYNCHRONOUS where localStorage was synchronous.
      `get()` answers from an in-memory mirror that is empty until
      the document lands, so render a sane default first and apply
      the restored value inside `ready().then(…)`.
   2. Writes are DEBOUNCED. A data write makes a git commit, and
      slide navigation persists on every step.

   `ss-mode` deliberately did NOT move here — it is a per-device
   fact (presenter on the laptop, remote on the phone). See init.js
   and remote-mode.js.
   ══════════════════════════════════════════════ */

SS.appState = (function () {
  const PATH = 'artifacts/super-slides/state.json';
  const WRITE_DEBOUNCE_MS = 1500;

  let state = {};        // in-memory mirror — always readable synchronously
  let loadPromise = null;
  let writeTimer = null;
  let writing = false;
  let dirty = false;

  // Resolves once the document has been read (or has been established as
  // absent). Safe to call repeatedly — the read happens once.
  function ready() {
    if (loadPromise) return loadPromise;
    loadPromise = (async () => {
      try {
        const parsed = JSON.parse(await lucidos.data.read(PATH));
        if (parsed && typeof parsed === 'object') state = parsed;
      } catch (e) {
        // No document yet (404), malformed, or no SDK — start empty.
        state = {};
      }
      return state;
    })();
    return loadPromise;
  }

  function get(key, fallback) {
    return Object.prototype.hasOwnProperty.call(state, key) ? state[key] : fallback;
  }

  function set(key, value) {
    // Cheap no-op guard for scalars; objects are always re-persisted.
    if (value === null || typeof value !== 'object') {
      if (state[key] === value) return;
    }
    state[key] = value;
    dirty = true;
    if (writeTimer) clearTimeout(writeTimer);
    writeTimer = setTimeout(flush, WRITE_DEBOUNCE_MS);
  }

  async function flush() {
    if (writeTimer) { clearTimeout(writeTimer); writeTimer = null; }
    // A write already in flight will pick up the newer state when it settles.
    if (!dirty || writing) return;
    if (!window.lucidos || !lucidos.data) return;
    dirty = false;
    writing = true;
    try {
      await lucidos.data.write(PATH, JSON.stringify(state, null, 2));
    } catch (e) {
      console.warn('[SS] state write failed:', e);
    } finally {
      writing = false;
      if (dirty) writeTimer = setTimeout(flush, WRITE_DEBOUNCE_MS);
    }
  }

  // Best-effort: don't drop a debounced write when the page goes away.
  window.addEventListener('pagehide', () => { flush(); });
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden') flush();
  });

  // Start the read immediately — every caller's first paint races it.
  if (window.lucidos && lucidos.data) ready();

  return { ready, get, set, flush, PATH };
})();

// ── Custom component registry ──

SS._customComponents = {};

SS.registerComponent = (name, renderFn) => {
  SS._customComponents[name] = renderFn;
};

// ── Utility: build class list from semantic props ──

SS._classes = (base, node) => {
  const c = Array.isArray(base) ? [...base] : [base];
  if (node.mt) c.push('mt-' + node.mt);
  if (node.mb) c.push('mb-' + node.mb);
  if (node.align) c.push('align-' + node.align);
  if (node.gap) c.push('gap-' + node.gap);
  return c.filter(Boolean).join(' ');
};

// ── Editable wrapper: wraps text in a span with edit data attrs ──

SS._editable = (text, path, prop) => {
  if (!path) return text;
  return `<span class="ss-editable" data-ss-path="${path}" data-ss-prop="${prop}">${text}</span>`;
};

// ── Tags ──

SS.tag = (text, color, path) => {
  const editAttr = path ? ` data-ss-path="${path}" data-ss-prop="text"` : '';
  const editCls = path ? ' ss-editable' : '';
  return `<span class="tag tag-${color}${editCls}"${editAttr}>${text}</span>`;
};

// ── Slide header (tag + h2 + subtitle) ──

SS.slideHeader = (tagHtml, title, subtitle, path) => {
  const titleAttr = path ? ` data-ss-path="${path}" data-ss-prop="title"` : '';
  const titleCls = path ? ' ss-editable' : '';
  const subAttr = path ? ` data-ss-path="${path}" data-ss-prop="subtitle"` : '';
  const subCls = path ? ' ss-editable' : '';
  return `<div class="slide-header">
    ${tagHtml}
    <h2 class="${titleCls}"${titleAttr}>${title}</h2>
    <p class="subtitle${subCls}"${subAttr}>${subtitle}</p>
  </div>`;
};

// ── Cards ──

SS.card = (content, node = {}) => {
  const classes = ['card'];
  if (node.highlight) classes.push('highlight-' + node.highlight);
  if (node.className) classes.push(node.className);
  if (node.mt) classes.push('mt-' + node.mt);
  if (node.mb) classes.push('mb-' + node.mb);
  if (node.align) classes.push('ta-' + node.align);
  return `<div class="${classes.join(' ')}">${content}</div>`;
};

// ── Layout ──

SS.columns = (items, node = {}) =>
  `<div class="${SS._classes('columns', node)}">${items.join('')}</div>`;

SS.threeCol = (items, node = {}) =>
  `<div class="${SS._classes('three-col', node)}">${items.join('')}</div>`;

SS.fourCol = (items, node = {}) =>
  `<div class="${SS._classes('four-col', node)}">${items.join('')}</div>`;

// ── Insight ──

SS.insight = (content, color, path) => {
  const editAttr = path ? ` data-ss-path="${path}" data-ss-prop="text"` : '';
  const editCls = path ? ' ss-editable' : '';
  return `<div class="insight${color ? ' insight-' + color : ''}"><p class="${editCls}"${editAttr}>${content}</p></div>`;
};

// ── Icon ──

SS.icon = (emoji) =>
  `<span class="icon-large">${emoji}</span>`;

// ── Unordered list ──

SS.list = (items, path) => {
  if (path) {
    return `<ul>${items.map((item, i) =>
      `<li class="ss-editable" data-ss-path="${path}" data-ss-prop="items[${i}]">${item}</li>`
    ).join('')}</ul>`;
  }
  return `<ul>${items.map(i => `<li>${i}</li>`).join('')}</ul>`;
};

// ── Skill chips ──

SS.skillChips = (chips, path) => {
  if (path) {
    return `<div class="skill-chips">${chips.map((c, i) =>
      `<span class="skill-chip ss-editable" data-ss-path="${path}" data-ss-prop="chips[${i}]">${c}</span>`
    ).join('')}</div>`;
  }
  return `<div class="skill-chips">${chips.map(c => `<span class="skill-chip">${c}</span>`).join('')}</div>`;
};

// ── Pipeline ──

SS.pipeline = (steps) =>
  `<div class="pipeline">${steps.join('')}</div>`;

SS.pipelineStep = (icon, label, ownerClass, ownerLabel, sub, path) =>
  `<div class="pipeline-step">
    <span class="step-icon">${SS._editable(icon, path, 'icon')}</span>
    <span class="step-label">${SS._editable(label, path, 'label')}</span>
    <span class="step-owner ${ownerClass}">${SS._editable(ownerLabel, path, 'ownerLabel')}</span>
    <span class="step-sub">${SS._editable(sub, path, 'sub')}</span>
  </div>`;

// ── Takeaways ──

SS.takeawayList = (items) =>
  `<div class="takeaway-list">${items.join('')}</div>`;

SS.takeawayItem = (num, title, body, path) =>
  `<div class="takeaway-item">
    <span class="takeaway-num">${SS._editable(num, path, 'num')}</span>
    <div><h3>${SS._editable(title, path, 'title')}</h3><p>${SS._editable(body, path, 'body')}</p></div>
  </div>`;

// ── Event Sourcing flow ──

SS.esFlow = (events, path) => {
  if (path) {
    return `<div class="es-flow">${events.map((e, i) =>
      (i > 0 ? '<span class="es-arrow">→</span>' : '') +
      `<span class="es-event ss-editable" data-ss-path="${path}" data-ss-prop="events[${i}]">${e}</span>`
    ).join('')}</div>`;
  }
  return `<div class="es-flow">${events.map((e, i) =>
    (i > 0 ? '<span class="es-arrow">→</span>' : '') +
    `<span class="es-event">${e}</span>`
  ).join('')}</div>`;
};

// ── Tree / code block ──

SS.tree = (content) =>
  `<div class="tree">${content}</div>`;

// ── Team badge ──

SS.teamBadge = (text, path) => {
  const inner = SS._editable(text, path, 'text');
  return `<div class="team-badge"><div class="dot"></div><span>${inner}</span></div>`;
};

// ── VS label ──

SS.vsLabel = (text, path, color) => {
  const editAttr = path ? ` data-ss-path="${path}" data-ss-prop="text"` : '';
  const editCls = path ? ' ss-editable' : '';
  const colorCls = color ? ` c-${color}` : '';
  return `<p class="vs-label${colorCls}${editCls}"${editAttr}>${text}</p>`;
};

// ── Arch diagram (SVG wrapper) ──

SS.archDiagram = (svgContent) =>
  `<div class="arch-diagram">${svgContent}</div>`;

// ── Heading ──

SS.heading = (node, path) => {
  const tag = `h${node.level || 2}`;
  const classes = [];
  if (node.color) classes.push('c-' + node.color);
  if (node.size) classes.push('sz-' + node.size);
  if (node.mt) classes.push('mt-' + node.mt);
  if (node.mb) classes.push('mb-' + node.mb);
  const cls = classes.length ? ` class="${classes.join(' ')}"` : '';

  let content;
  if (node.sub) {
    // Wrap text and sub separately for independent editing
    content = SS._editable(node.text || '', path, 'text');
    content += ` <span class="heading-sub${node.subColor ? ' c-' + node.subColor : ''}">${SS._editable(node.sub, path, 'sub')}</span>`;
  } else if (path) {
    // No sub — make the whole heading editable
    content = node.text || '';
    // Add editable attrs to the heading tag itself
    const editCls = classes.length ? classes.join(' ') + ' ss-editable' : 'ss-editable';
    return `<${tag} class="${editCls}" data-ss-path="${path}" data-ss-prop="text">${content}</${tag}>`;
  } else {
    content = node.text || '';
  }

  return `<${tag}${cls}>${content}</${tag}>`;
};

// ── Text ──

SS.text = (node, path) => {
  const classes = [];
  if (node.color) classes.push('c-' + node.color);
  if (node.align) classes.push('ta-' + node.align);
  if (node.size) classes.push('sz-' + node.size);
  if (node.font === 'mono') classes.push('font-mono');
  if (node.weight) classes.push('fw-' + node.weight);
  if (node.mt) classes.push('mt-' + node.mt);
  if (node.mb) classes.push('mb-' + node.mb);
  if (node.leading) classes.push('leading-' + node.leading);
  if (path) classes.push('ss-editable');
  const cls = classes.length ? ` class="${classes.join(' ')}"` : '';
  const editAttr = path ? ` data-ss-path="${path}" data-ss-prop="text"` : '';
  return `<p${cls}${editAttr}>${node.text || ''}</p>`;
};

// ── Stat ──

SS.stat = (node, path) => {
  const colorCls = node.color ? ' stat-' + node.color : '';
  let html = `<div class="stat-block${colorCls}">`;
  html += `<p class="stat-value${path ? ' ss-editable' : ''}"${path ? ` data-ss-path="${path}" data-ss-prop="value"` : ''}>${node.value}</p>`;
  if (node.label) html += `<p class="stat-label${path ? ' ss-editable' : ''}"${path ? ` data-ss-path="${path}" data-ss-prop="label"` : ''}>${node.label}</p>`;
  if (node.sublabel) html += `<p class="stat-sublabel${path ? ' ss-editable' : ''}"${path ? ` data-ss-path="${path}" data-ss-prop="sublabel"` : ''}>${node.sublabel}</p>`;
  html += '</div>';
  return html;
};

// ── Spacer ──

SS.spacer = (size) =>
  `<div class="spacer spacer-${size || 'md'}"></div>`;

// ── Node renderer (walks JSON trees → HTML) ──
// path: JSON path string for this node (e.g. "sections[0].slides[1].content[2]")

SS.renderNode = (node, path) => {
  if (!node) return '';

  // Check custom registry first
  if (SS._customComponents[node.type]) {
    return SS._customComponents[node.type](node, path);
  }

  const children = (node.children || []).map((child, i) =>
    SS.renderNode(child, path ? `${path}.children[${i}]` : null)
  );

  switch (node.type) {
    case 'slideHeader':
      return SS.slideHeader(
        SS.tag(node.tag.text, node.tag.color, path ? `${path}.tag` : null),
        node.title, node.subtitle, path
      );
    case 'card':
      return SS.card(children.join(''), node);
    case 'columns':
      return SS.columns(children, node);
    case 'threeCol':
      return SS.threeCol(children, node);
    case 'fourCol':
      return SS.fourCol(children, node);
    case 'insight':
      return SS.insight(node.text, node.color, path);
    case 'icon':
      return SS.icon(node.emoji);
    case 'list':
      return SS.list(node.items, path);
    case 'skillChips':
      return SS.skillChips(node.chips, path);
    case 'pipeline':
      return SS.pipeline(children);
    case 'pipelineStep':
      return SS.pipelineStep(node.icon, node.label, node.ownerClass, node.ownerLabel, node.sub, path);
    case 'takeawayList':
      return SS.takeawayList(children);
    case 'takeawayItem':
      return SS.takeawayItem(node.num, node.title, node.body, path);
    case 'esFlow':
      return SS.esFlow(node.events, path);
    case 'tree':
      return SS.tree(node.content);
    case 'teamBadge':
      return SS.teamBadge(node.text, path);
    case 'vsLabel':
      return SS.vsLabel(node.text, path, node.color);
    case 'archDiagram':
      return SS.archDiagram(node.content);
    case 'group': {
      const cls = SS._classes('group', node);
      return `<div class="${cls}">${children.join('')}</div>`;
    }

    // Semantic components
    case 'heading':
      return SS.heading(node, path);
    case 'text':
      return SS.text(node, path);
    case 'stat':
      return SS.stat(node, path);
    case 'spacer':
      return SS.spacer(node.size);
    case 'include':
      return node._resolved || `<!-- include not loaded: ${node.src} -->`;

    // Escape hatch — should be rare
    case 'html':
      return node.content;

    default:
      console.warn('Unknown node type:', node.type);
      return `<div class="ss-render-error">Unknown node type: <strong>${node.type || '(empty)'}</strong></div>`;
  }
};

// ── Error display ──

SS.showError = (title, message, detail, source) => {
  const app = document.getElementById('app');
  const overlay = document.createElement('div');
  overlay.className = 'ss-error-overlay';
  overlay.innerHTML = `
    <div class="ss-error-box">
      <span class="ss-error-icon">⚠</span>
      <h2>${title}</h2>
      <p class="ss-error-message">${message}</p>
      ${detail ? `<pre class="ss-error-detail">${detail}</pre>` : ''}
      ${source ? `<p class="ss-error-source">${source}</p>` : ''}
    </div>`;
  (app || document.body).appendChild(overlay);
};

// ── Presentation registry ──

window._superSlidesRegistry = [];

SS.registerPresentation = (presentation) => {
  window._superSlidesRegistry.push(presentation);
};

// ── Resolve include nodes (async, called during load) ──

SS._resolveIncludes = async (data, baseDir) => {
  const promises = [];

  function walk(nodes) {
    if (!nodes) return;
    for (let i = 0; i < nodes.length; i++) {
      const node = nodes[i];
      if (node.type === 'include' && node.src) {
        const idx = i;
        const arr = nodes;
        promises.push(
          lucidos.data.read(`${baseDir}/${node.src}`)
            .then(html => { arr[idx]._resolved = html; })
            .catch(() => { arr[idx]._resolved = `<!-- include not found: ${node.src} -->`; })
        );
      }
      if (node.children) walk(node.children);
    }
  }

  if (data.sections) {
    data.sections.forEach(sec => sec.slides.forEach(s => walk(s.content)));
  } else if (data.slides) {
    data.slides.forEach(s => walk(s.content));
  }

  await Promise.all(promises);
};

// ── Load custom components & styles for a presentation ──

SS._loadCustomAssets = async (presId, baseDir) => {
  // Clean up previous custom assets
  document.querySelectorAll('style[data-ss-custom]').forEach(el => el.remove());
  SS._customComponents = {};

  const presDir = `${baseDir}/${presId}`;

  // Load custom styles
  try {
    const css = await lucidos.data.read(`${presDir}/styles.css`);
    const el = document.createElement('style');
    el.dataset.ssCustom = presId;
    el.textContent = css;
    document.head.appendChild(el);
  } catch (e) { /* no custom styles */ }

  // Load custom components
  try {
    const js = await lucidos.data.read(`${presDir}/components.js`);
    new Function(js)();
  } catch (e) { /* no custom components */ }
};

// ── Load a JSON presentation file ──

SS.loadPresentation = async (path) => {
  let raw;
  try {
    raw = await lucidos.data.read(path);
  } catch (err) {
    SS.showError(
      'Failed to Load',
      `Could not read presentation file.`,
      err.message,
      path
    );
    throw err;
  }

  let data;
  try {
    data = JSON.parse(raw);
  } catch (err) {
    const match = err.message.match(/position (\d+)/);
    let detail = err.message;
    if (match) {
      const pos = parseInt(match[1]);
      const snippet = raw.substring(Math.max(0, pos - 60), pos + 60);
      const arrow = ' '.repeat(Math.min(60, pos)) + '^^^';
      detail = err.message + '\n\n' + snippet + '\n' + arrow;
    }
    SS.showError(
      'Invalid JSON',
      'The presentation file contains malformed JSON.',
      detail,
      path
    );
    throw err;
  }

  // Resolve base directory for includes and custom assets
  const baseDir = path.substring(0, path.lastIndexOf('/'));

  // Artifact path for editing — already in SDK format
  const sourceFile = path;

  // Resolve include nodes
  await SS._resolveIncludes(data, `${baseDir}/${data.id}`);

  // Load custom components & styles
  await SS._loadCustomAssets(data.id, baseDir);

  // Build flat slide list with JSON path threading
  let flatSlides = [];
  let sections = null;

  if (data.sections && data.sections.length) {
    sections = [];
    data.sections.forEach((sec, secIdx) => {
      const startIndex = flatSlides.length;
      const rendered = sec.slides.map((s, slideIdx) => ({
        html: s.content ? s.content.map((n, i) =>
          SS.renderNode(n, `sections[${secIdx}].slides[${slideIdx}].content[${i}]`)
        ).join('') : '',
        hero: s.hero || false,
        title: s.title || undefined,
        notes: s.notes || '',
        cardNotes: Array.isArray(s.cardNotes) ? s.cardNotes.slice() : undefined,
        path: `sections[${secIdx}].slides[${slideIdx}]`,
      }));
      flatSlides.push(...rendered);
      sections.push({
        title: sec.title,
        color: sec.color || 'accent',
        startIndex,
        endIndex: flatSlides.length - 1,
        count: rendered.length,
      });
    });
  } else if (data.slides) {
    flatSlides = data.slides.map((s, slideIdx) => ({
      html: s.content ? s.content.map((n, i) =>
        SS.renderNode(n, `slides[${slideIdx}].content[${i}]`)
      ).join('') : '',
      hero: s.hero || false,
      title: s.title || undefined,
      notes: s.notes || '',
      cardNotes: Array.isArray(s.cardNotes) ? s.cardNotes.slice() : undefined,
      path: `slides[${slideIdx}]`,
    }));
  }

  const pres = {
    id: data.id,
    title: data.title,
    subtitle: data.subtitle,
    titleScroller: data.titleScroller,
    slides: flatSlides,
    sections: sections,
    sourceFile: sourceFile,
    rawData: data,
    sourceUrl: path,
  };

  SS.registerPresentation(pres);
  return pres;
};
</script>
<script>
/* ═══════════ remote.js (inlined) ═══════════ */
/* ══════════════════════════════════════════════════════
   Super Slides — Remote (speaker view)
   ══════════════════════════════════════════════════════
   A stripped-down companion UI that:
   - Shows current slide title, section, and speaker notes
   - Sends SlideRemoteCommand events to drive the presenter
   - Listens for SlidePresenterState to mirror live position
   ══════════════════════════════════════════════════════ */

(function () {
  const STATE = {
    presentationId: null,
    presentationTitle: null,
    slideIndex: 0,
    slideCount: 0,
    cardIndex: -1,
    presentation: null,    // full loaded presentation (for notes, picker)
  };

  function showRemoteError(msg) {
    els.notesBody.innerHTML =
      `<div style="color:var(--rose,#f87171);white-space:pre-wrap;font-size:.85rem;line-height:1.5;">${
        msg.replace(/[<>&]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]))
      }</div>`;
    els.slideTitle.textContent = 'Error loading presentation';
    els.pickerBtn.disabled = true;
  }

  // Match the presenter's persisted position — a sensible default when the
  // remote opens before the presenter has broadcast. It lives in the workspace
  // state document now (localStorage throws in the isolated app frame), so the
  // read is ASYNCHRONOUS: these start empty and init() fills them in after
  // painting the shell.
  let SAVED_PRES_ID = null;
  let SAVED_SLIDE   = 0;

  const els = {
    presTitle: document.getElementById('presTitle'),
    connStatus: document.getElementById('connStatus'),
    counter: document.getElementById('counter'),
    sectionPill: document.getElementById('sectionPill'),
    slideTitle: document.getElementById('slideTitle'),
    nextUp: document.getElementById('nextUp'),
    notesBody: document.getElementById('notesBody'),
    prevBtn: document.getElementById('prevBtn'),
    nextBtn: document.getElementById('nextBtn'),
    pickerBtn: document.getElementById('pickerBtn'),
    pickerOverlay: document.getElementById('pickerOverlay'),
    pickerCloseBtn: document.getElementById('pickerCloseBtn'),
    pickerList: document.getElementById('pickerList'),
  };

  /* ── Load a presentation file directly (for notes + picker) ────────── */

  // Maintain our own registry; SS.loadPresentation appends to the global one.
  async function ensurePresentationLoaded(presentationId) {
    const reg = window._superSlidesRegistry || [];
    let pres = reg.find(p => p.id === presentationId);
    if (pres) return pres;

    const errors = [];

    // Try direct load first — fast, no glob needed
    const directPath = `artifacts/presentations/${presentationId}.slides`;
    try {
      await SS.loadPresentation(directPath);
      pres = (window._superSlidesRegistry || []).find(p => p.id === presentationId);
      if (pres) return pres;
    } catch (e) {
      errors.push(`Direct load failed (${directPath}): ${e.message}`);
    }

    // Fall back to listing all presentations
    let files = [];
    try {
      files = await lucidos.data.list('artifacts/presentations/*.slides');
    } catch (e) {
      errors.push(`Could not list presentations: ${e.message}`);
    }
    for (const path of files) {
      try {
        await SS.loadPresentation(path);
      } catch (e) {
        errors.push(`Failed to load ${path}: ${e.message}`);
      }
    }
    pres = (window._superSlidesRegistry || []).find(p => p.id === presentationId) || null;
    if (!pres) {
      const knownIds = (window._superSlidesRegistry || []).map(p => p.id);
      const errMsg = `Could not load presentation "${presentationId}".\n` +
        (errors.length ? errors.join('\n') : 'No errors, but ID not found.') +
        (knownIds.length ? `\nLoaded IDs: ${knownIds.join(', ')}` : '\nNo presentations loaded.');
      console.error('[remote]', errMsg);
      showRemoteError(errMsg);
    }
    return pres;
  }

  /* ── Find which section a flat slide index belongs to ──────────────── */

  function getSectionFor(pres, idx) {
    if (!pres || !pres.sections) return null;
    for (let i = pres.sections.length - 1; i >= 0; i--) {
      if (idx >= pres.sections[i].startIndex) return pres.sections[i];
    }
    return null;
  }

  function slideTitleFor(pres, idx) {
    if (!pres || !pres.slides[idx]) return `Slide ${idx + 1}`;
    const s = pres.slides[idx];
    if (s.title) return s.title;
    const m = (s.html || '').match(/<h[12][^>]*>(.*?)<\/h[12]>/);
    if (m) return m[1].replace(/<[^>]+>/g, '');
    return idx === 0 ? 'Title' : `Slide ${idx + 1}`;
  }

  /* ── Render the remote UI for the current state ────────────────────── */

  function render() {
    const pres = STATE.presentation;
    els.presTitle.textContent = STATE.presentationTitle || (pres && pres.title) || '—';

    const total = STATE.slideCount || (pres ? pres.slides.length : 0);
    els.counter.textContent = total
      ? `${STATE.slideIndex + 1} / ${total}`
      : '— / —';

    // Re-enable controls once presentation loads (clears any earlier error state)
    els.pickerBtn.disabled = !pres;

    if (pres) {
      const sec = getSectionFor(pres, STATE.slideIndex);
      if (sec) {
        els.sectionPill.hidden = false;
        els.sectionPill.textContent = sec.title;
        els.sectionPill.style.setProperty('--pill-color', `var(--${sec.color || 'accent'})`);
      } else {
        els.sectionPill.hidden = true;
      }
      els.slideTitle.textContent = slideTitleFor(pres, STATE.slideIndex);

      const next = STATE.slideIndex + 1;
      if (next < pres.slides.length) {
        els.nextUp.textContent = `Next: ${slideTitleFor(pres, next)}`;
        els.nextUp.hidden = false;
      } else {
        els.nextUp.hidden = true;
      }

      const slide = pres.slides[STATE.slideIndex];
      let notes = '';
      if (STATE.cardIndex >= 0 && slide?.cardNotes?.[STATE.cardIndex]) {
        notes = slide.cardNotes[STATE.cardIndex].trim();
      } else if (slide?.notes) {
        notes = slide.notes.trim();
      }
      if (notes) {
        // Notes may contain simple inline markup; treat as semi-trusted (presenter's own file).
        // Convert plain newlines to <br> for readability.
        els.notesBody.innerHTML = notes
          .split(/\n{2,}/)
          .map(p => `<p>${p.replace(/\n/g, '<br>')}</p>`)
          .join('');
      } else {
        els.notesBody.innerHTML = '<em class="remote-notes-empty">No notes for this slide.</em>';
      }
    } else {
      els.sectionPill.hidden = true;
      els.slideTitle.textContent = STATE.presentationTitle ? 'Loading…' : 'Waiting for presenter';
      els.nextUp.hidden = true;
      els.notesBody.innerHTML = '<em class="remote-notes-empty">No notes for this slide.</em>';
    }

    // Picker (rebuild if open)
    if (!els.pickerOverlay.hidden) buildPicker();
  }

  /* ── Slide picker ──────────────────────────────────────────────────── */

  function buildPicker() {
    const pres = STATE.presentation;
    if (!pres) {
      els.pickerList.innerHTML = '<div class="remote-picker-empty">No presentation loaded.</div>';
      return;
    }
    let html = '';
    if (pres.sections) {
      pres.sections.forEach(sec => {
        html += `<div class="remote-picker-section-label" style="color: var(--${sec.color || 'accent'})">${sec.title}</div>`;
        for (let i = sec.startIndex; i <= sec.endIndex; i++) {
          html += pickerItem(pres, i);
        }
      });
    } else {
      pres.slides.forEach((_, i) => { html += pickerItem(pres, i); });
    }
    els.pickerList.innerHTML = html;
    const active = els.pickerList.querySelector('.remote-picker-item.active');
    if (active) active.scrollIntoView({ block: 'nearest' });
  }

  function pickerItem(pres, i) {
    const isActive = i === STATE.slideIndex;
    return `<button class="remote-picker-item${isActive ? ' active' : ''}" data-slide="${i}">
      <span class="remote-picker-num">${i + 1}</span>
      <span class="remote-picker-title">${escapeHtml(slideTitleFor(pres, i))}</span>
    </button>`;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
  }

  function openPicker() {
    buildPicker();
    els.pickerOverlay.hidden = false;
  }
  function closePicker() {
    els.pickerOverlay.hidden = true;
  }

  /* ── Commands → presenter ──────────────────────────────────────────── */

  // Absolute-state protocol: every command carries the full target state.
  function sendState(extra) {
    const payload = Object.assign({
      summary: 'Remote: setState',
      action: 'setState',
      presentationId: STATE.presentationId,
      slideIndex: STATE.slideIndex,
      cardIndex: STATE.cardIndex,
    }, extra || {});
    lucidos.events.emit('SlideRemoteCommand', payload, { transient: true }).catch(err => {
      console.warn('[remote] send failed:', err);
    });
  }

  function next() {
    const target = STATE.slideIndex + 1;
    if (STATE.slideCount && target >= STATE.slideCount) return;
    pendingGoto = target;
    pendingTime = Date.now();
    STATE.slideIndex = target;
    STATE.cardIndex = -1;
    render();
    sendState();
  }
  function prev() {
    const target = STATE.slideIndex - 1;
    if (target < 0) return;
    pendingGoto = target;
    pendingTime = Date.now();
    STATE.slideIndex = target;
    STATE.cardIndex = -1;
    render();
    sendState();
  }
  let pendingGoto = null;
  let pendingTime = 0;
  const PENDING_TIMEOUT = 3000; // accept presenter state after 3s even if unacknowledged

  function goto(idx) {
    // Optimistic update so the UI feels responsive
    pendingGoto = idx;
    pendingTime = Date.now();
    STATE.slideIndex = idx;
    STATE.cardIndex = -1;
    render();
    sendState();
  }

  /* ── Wire up controls ──────────────────────────────────────────────── */

  els.nextBtn.addEventListener('click', next);
  els.prevBtn.addEventListener('click', prev);
  els.pickerBtn.addEventListener('click', openPicker);
  els.pickerCloseBtn.addEventListener('click', closePicker);
  els.pickerOverlay.addEventListener('click', (e) => {
    if (e.target === els.pickerOverlay) closePicker();
  });
  els.pickerList.addEventListener('click', (e) => {
    const btn = e.target.closest('.remote-picker-item');
    if (!btn) return;
    const idx = parseInt(btn.dataset.slide);
    goto(idx);
    closePicker();
  });

  document.addEventListener('keydown', (e) => {
    // Don't intercept while typing in inputs (none today, but future-proof)
    if (e.target.matches('input, textarea, [contenteditable]')) return;
    if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') {
      e.preventDefault(); next();
    } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
      e.preventDefault(); prev();
    } else if (e.key === 'Escape' && !els.pickerOverlay.hidden) {
      e.preventDefault(); closePicker();
    } else if (e.key === 'g') {
      e.preventDefault(); openPicker();
    }
  });

  // Touch swipes for phone use
  let touchStartX = 0, touchStartY = 0, touchMoved = false;
  document.addEventListener('touchstart', (e) => {
    if (e.target.closest('.remote-nav, .remote-picker-overlay, button')) return;
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
    touchMoved = false;
  }, { passive: true });
  document.addEventListener('touchmove', () => { touchMoved = true; }, { passive: true });
  document.addEventListener('touchend', (e) => {
    if (e.target.closest('.remote-nav, .remote-picker-overlay, button')) return;
    if (!touchMoved) return;
    const dx = e.changedTouches[0].clientX - touchStartX;
    const dy = e.changedTouches[0].clientY - touchStartY;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) {
      dx < 0 ? next() : prev();
    }
  });

  /* ── State sync via SSE ────────────────────────────────────────────── */

  function setStatus(text, ok) {
    els.connStatus.textContent = text;
    els.connStatus.dataset.ok = ok ? '1' : '0';
  }

  async function applyPresenterState(data) {
    if (!data) return;
    setStatus('connected', true);

    // If we have a pending goto, check whether this state confirms or conflicts
    if (pendingGoto !== null) {
      const elapsed = Date.now() - pendingTime;
      if (typeof data.slideIndex === 'number' && data.slideIndex === pendingGoto) {
        // Presenter confirmed our goto — clear pending
        pendingGoto = null;
      } else if (elapsed < PENDING_TIMEOUT) {
        // Stale heartbeat from before the goto reached the presenter — ignore
        return;
      } else {
        // Timed out — accept the presenter's authoritative state
        pendingGoto = null;
      }
    }

    const presChanged = data.presentationId && data.presentationId !== STATE.presentationId;
    STATE.presentationId    = data.presentationId    || STATE.presentationId;
    STATE.presentationTitle = data.presentationTitle || STATE.presentationTitle;
    STATE.slideIndex        = typeof data.slideIndex === 'number' ? data.slideIndex : STATE.slideIndex;
    STATE.slideCount        = data.slideCount        || STATE.slideCount;
    STATE.cardIndex         = typeof data.cardIndex === 'number' ? data.cardIndex : -1;

    if (presChanged || !STATE.presentation || STATE.presentation.id !== STATE.presentationId) {
      try {
        STATE.presentation = await ensurePresentationLoaded(STATE.presentationId);
      } catch (e) {
        showRemoteError(`Failed to load presentation: ${e.message}`);
        return;
      }
    }
    render();
  }

  lucidos.sse.connect();

  // Debounce incoming state events — SSE may replay a burst of stored events
  // on connect. We only care about the latest one.
  let pendingStateData = null;
  let stateDebounce = null;
  lucidos.sse.on('SlidePresenterState', (data) => {
    pendingStateData = data;
    if (!stateDebounce) {
      stateDebounce = setTimeout(() => {
        stateDebounce = null;
        applyPresenterState(pendingStateData);
        pendingStateData = null;
      }, 150);
    }
  });

  // Ask the presenter to re-broadcast — handles "remote opened after presenter"
  function pingPresenter() {
    lucidos.events.emit('SlidePresenterPing', {
      summary: 'Remote requesting presenter state',
    }, { transient: true }).catch(() => {});
  }

  /* ── Bootstrap ─────────────────────────────────────────────────────── */

  let connected = false;
  let connectTimeout = null;

  // Override setStatus to track connection
  const _origSetStatus = setStatus;
  setStatus = function(text, ok) {
    if (ok) {
      connected = true;
      if (connectTimeout) { clearTimeout(connectTimeout); connectTimeout = null; }
    }
    _origSetStatus(text, ok);
  };

  (async function init() {
    setStatus('connecting…', false);
    // Paint the empty shell first — the saved-position read below is async.
    render();

    // Pick up the presenter's persisted position, if the state document has one.
    try {
      await SS.appState.ready();
      SAVED_PRES_ID = SS.appState.get('presentationId', null);
      const savedSlide = SS.appState.get('slideIndex', 0);
      SAVED_SLIDE = Number.isInteger(savedSlide) ? savedSlide : 0;
    } catch (e) {
      // No saved position — wait for the presenter's broadcast instead.
    }

    // Optimistically load the last presentation the user had open
    if (SAVED_PRES_ID) {
      STATE.presentationId = SAVED_PRES_ID;
      STATE.slideIndex = SAVED_SLIDE;
      try {
        STATE.presentation = await ensurePresentationLoaded(SAVED_PRES_ID);
      } catch (e) {
        showRemoteError(`Bootstrap load failed: ${e.message}`);
      }
      if (STATE.presentation) {
        STATE.presentationTitle = STATE.presentation.title;
        STATE.slideCount = STATE.presentation.slides.length;
        render();
      }
    } else {
      render();
    }

    // Ask the live presenter for authoritative state via ping
    // (SlidePresenterState is transient — no stored events to query)
    pingPresenter();
    setTimeout(pingPresenter, 800); // retry once in case SSE was still connecting

    // If no presenter responds within 5s, show a helpful message
    connectTimeout = setTimeout(() => {
      if (!connected) {
        setStatus = _origSetStatus; // restore
        _origSetStatus('no presenter found', false);
        els.slideTitle.textContent = 'Presenter not detected';
        els.notesBody.innerHTML =
          '<p style="color:var(--text-dim);">Make sure Super Slides is open in another window or tab.</p>' +
          '<p style="margin-top:.75rem"><button id="retryBtn" style="' +
            'background:var(--accent);color:#fff;border:none;padding:.5rem 1.25rem;' +
            'border-radius:.5rem;font-size:.95rem;cursor:pointer">Retry</button></p>';
        document.getElementById('retryBtn').addEventListener('click', () => {
          connected = false;
          _origSetStatus('connecting…', false);
          els.slideTitle.textContent = 'Reconnecting…';
          els.notesBody.innerHTML = '<em class="remote-notes-empty">No notes for this slide.</em>';
          pingPresenter();
          setTimeout(pingPresenter, 800);
          connectTimeout = setTimeout(() => {
            if (!connected) {
              _origSetStatus('no presenter found', false);
              els.slideTitle.textContent = 'Presenter not detected';
              els.notesBody.innerHTML =
                '<p style="color:var(--text-dim);">Still no presenter. Check that Super Slides is open.</p>' +
                '<p style="margin-top:.75rem"><button onclick="location.reload()" style="' +
                  'background:var(--accent);color:#fff;border:none;padding:.5rem 1.25rem;' +
                  'border-radius:.5rem;font-size:.95rem;cursor:pointer">Reload</button></p>';
            }
          }, 5000);
        });
      }
    }, 5000);
  })();
})();
</script>
</body>
</html>
